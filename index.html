<h1>Урок 7. Чат-приложение с памятью</h1>

<div class="lesson-meta">
  <span><strong>Цель:</strong> сделать чат-бот, который помнит контекст разговора</span>
  <span><strong>Время:</strong> ~60 минут</span>
  <span><strong>Источник:</strong> generative-ai-for-beginners/07</span>
</div>

<h2>Зачем тебе этот урок</h2>
<p>Скрипт из урока 6 — однократный вызов: «введи промпт → получи ответ → конец». Реальные ИИ-продукты — почти все чат-формата: бот помнит контекст, продолжает беседу, держит роль. ChatGPT, Claude.ai, корпоративные ассистенты — все построены на одной механике, которую ты освоишь сегодня.</p>
<p>Отдельная сложность — <strong>память</strong>. LLM stateless: ничего не помнит между вызовами. «Память» — это то, что ты сам подсовываешь в контекст. Этот урок — про разные стратегии, как это делать правильно.</p>

<h2>1. Stateless API и иллюзия памяти</h2>

<p>Вспомни урок 1: каждый запрос к LLM API независим. Модель не «помнит» прошлые сообщения. Если ты хочешь, чтобы она знала контекст — <strong>ты должен отправить весь контекст</strong> в массиве <code>messages</code>:</p>

<pre><code># Запрос 1
client.chat.completions.create(
    model="gpt-4o-mini",
    messages=[{"role": "user", "content": "Меня зовут Иван"}]
)
# → "Приятно познакомиться, Иван!"

# Запрос 2 — модель ничего не помнит
client.chat.completions.create(
    model="gpt-4o-mini",
    messages=[{"role": "user", "content": "Как меня зовут?"}]
)
# → "Я не знаю, как вас зовут"

# Запрос 2 правильный — передаём всю историю
client.chat.completions.create(
    model="gpt-4o-mini",
    messages=[
        {"role": "user", "content": "Меня зовут Иван"},
        {"role": "assistant", "content": "Приятно познакомиться, Иван!"},
        {"role": "user", "content": "Как меня зовут?"}
    ]
)
# → "Вас зовут Иван."</code></pre>

<p>Вся «память» чат-бота — это твой массив сообщений, который ты ведёшь на стороне приложения и каждый раз отправляешь целиком.</p>

<h2>2. Простейший чат-бот</h2>

<pre><code>import os
from dotenv import load_dotenv
from openai import OpenAI

load_dotenv()
client = OpenAI()

class ChatBot:
    def __init__(self, system_prompt: str, model: str = "gpt-4o-mini"):
        self.model = model
        self.history = [{"role": "system", "content": system_prompt}]

    def chat(self, user_msg: str) -> str:
        self.history.append({"role": "user", "content": user_msg})

        response = client.chat.completions.create(
            model=self.model,
            messages=self.history,
            temperature=0.7
        )
        reply = response.choices[0].message.content

        # сохраняем ответ в историю — он понадобится в следующих запросах
        self.history.append({"role": "assistant", "content": reply})
        return reply


# Используем
bot = ChatBot("Ты помощник по фитнесу. Кратко, по делу. Спрашивай уточняющие вопросы.")

while True:
    msg = input("Ты: ")
    if msg.lower() in ("exit", "quit", "выход"):
        break
    print("Бот:", bot.chat(msg))</code></pre>

<p>Запускаешь — получаешь рабочий чат с ботом, который помнит весь разговор.</p>

<h2>3. Проблема: контекст растёт</h2>

<p>На 5-м сообщении массив <code>history</code> содержит 11 элементов (1 system + 10 messages), на 50-м — уже 101. Что в этом плохого:</p>

<ol>
<li><strong>Цена.</strong> Каждый запрос отправляет всю историю. На 50-м сообщении ты платишь за токены 50 предыдущих + новый.</li>
<li><strong>Лимит.</strong> Контекстное окно ограничено (128k у GPT-4o). На очень длинных диалогах упрёшься.</li>
<li><strong>Качество.</strong> «Lost in the middle» — модель хуже помнит середину длинного контекста.</li>
<li><strong>Latency.</strong> Большой контекст обрабатывается дольше.</li>
</ol>

<p>Решение — <strong>стратегии управления историей</strong>.</p>

<h2>4. Стратегия 1: Sliding Window (скользящее окно)</h2>

<h3>Идея</h3>
<p>Хранить только последние N сообщений. Старое — забывать.</p>

<pre><code>class ChatBot:
    def __init__(self, system_prompt: str, max_history: int = 10):
        self.system_prompt = system_prompt
        self.max_history = max_history
        self.history = []

    def chat(self, user_msg: str) -> str:
        self.history.append({"role": "user", "content": user_msg})

        # отрезаем sliding window
        recent = self.history[-self.max_history:]
        messages = [{"role": "system", "content": self.system_prompt}] + recent

        response = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=messages,
            temperature=0.7
        )
        reply = response.choices[0].message.content
        self.history.append({"role": "assistant", "content": reply})
        return reply</code></pre>

<h3>Когда подходит</h3>
<ul>
<li>Короткие фокусные диалоги (helpdesk, FAQ).</li>
<li>Не нужно помнить детали из начала.</li>
</ul>

<h3>Минусы</h3>
<ul>
<li>Бот «забывает» имя, контекст, ранние решения.</li>
<li>Резкая граница: 10 сообщений помнит, 11-е — забыл начисто.</li>
</ul>

<h2>5. Стратегия 2: Summary (саммари)</h2>

<h3>Идея</h3>
<p>Когда история становится длинной, просим модель <strong>суммировать</strong> старую часть и заменяем её на summary.</p>

<pre><code>class ChatBot:
    def __init__(self, system_prompt: str, summarize_every: int = 20):
        self.system_prompt = system_prompt
        self.summarize_every = summarize_every
        self.summary = ""
        self.recent = []  # последние сообщения, не сжатые

    def _summarize_old(self, old_messages):
        text = "\\n".join([f"{m['role']}: {m['content']}" for m in old_messages])
        response = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=[
                {"role": "system", "content": "Сожми диалог в краткое саммари ключевых фактов и решений (1 абзац)."},
                {"role": "user", "content": text}
            ]
        )
        return response.choices[0].message.content

    def chat(self, user_msg: str) -> str:
        self.recent.append({"role": "user", "content": user_msg})

        # компонуем системный промпт с актуальным саммари
        sys = self.system_prompt
        if self.summary:
            sys += f"\\n\\nКонтекст из предыдущей части диалога: {self.summary}"

        messages = [{"role": "system", "content": sys}] + self.recent

        response = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=messages,
            temperature=0.7
        )
        reply = response.choices[0].message.content
        self.recent.append({"role": "assistant", "content": reply})

        # если накопилось много — сжимаем старое
        if len(self.recent) >= self.summarize_every:
            old = self.recent[:-10]   # сжимаем всё кроме последних 10
            self.recent = self.recent[-10:]
            new_summary = self._summarize_old(old)
            self.summary = (
                f"{self.summary}\\n{new_summary}" if self.summary else new_summary
            )

        return reply</code></pre>

<h3>Когда подходит</h3>
<ul>
<li>Длинные обучающие диалоги (репетитор, ментор).</li>
<li>Долгое сопровождение клиента.</li>
<li>Когда важны ранние решения и факты.</li>
</ul>

<h3>Минусы</h3>
<ul>
<li>Дополнительные вызовы LLM (1 саммари = 1 запрос).</li>
<li>Информация теряется при сжатии.</li>
<li>Качество саммари влияет на всё дальнейшее.</li>
</ul>

<h2>6. Стратегия 3: Hierarchical (иерархическая)</h2>

<p>Гибрид:</p>
<ul>
<li>Последние 5–10 сообщений — целиком.</li>
<li>Чуть более старые — суммаризированы по 5 в одну запись.</li>
<li>Древние — глобальное саммари «о чём вообще шёл разговор».</li>
</ul>

<p>Сложнее в реализации, но даёт хороший баланс «точность недавнего» + «общее понимание».</p>

<h2>7. Стратегия 4: Vector memory (векторная память)</h2>

<p>Самая мощная: храним все сообщения в <strong>векторной БД</strong>, при каждом запросе достаём релевантные текущему вопросу. Это уже <strong>RAG</strong> — будем разбирать в уроке 14. Тут просто упомянем для полноты.</p>

<h2>8. Подсчёт токенов и обрезка</h2>

<p>Чтобы понять, когда применять стратегию — нужно считать токены. Есть библиотека <code>tiktoken</code> (для OpenAI):</p>

<pre><code>pip install tiktoken</code></pre>

<pre><code>import tiktoken

def count_tokens(messages, model="gpt-4o-mini"):
    enc = tiktoken.encoding_for_model(model)
    total = 0
    for m in messages:
        # в реальности OpenAI добавляет ~4 токена на сообщение для метаданных
        total += len(enc.encode(m["content"])) + 4
    return total + 2  # +2 для приоритета</code></pre>

<p>Перед запросом проверяй и обрезай:</p>

<pre><code>MAX_CONTEXT = 100_000  # с запасом

while count_tokens(messages) > MAX_CONTEXT:
    # удаляем второе сообщение (после system)
    messages.pop(1)</code></pre>

<h2>9. System prompt — главный инструмент устойчивости</h2>

<p>System prompt задаётся один раз и держит характер бота на весь диалог. Сюда кладём:</p>

<ul>
<li><strong>Роль и сфера.</strong></li>
<li><strong>Стиль общения</strong> (тон, длина ответов).</li>
<li><strong>Правила поведения.</strong></li>
<li><strong>Что делать в граничных случаях.</strong></li>
<li><strong>Что НЕ делать.</strong></li>
</ul>

<h3>Пример хорошего system prompt</h3>
<pre><code>SYSTEM = """Ты — Никита, виртуальный помощник студии веб-разработки.
Твоя задача — помочь клиенту понять, подойдём ли мы под его проект.

Стиль:
- Прямо и по делу, без воды.
- Короткие ответы (2-4 предложения).
- На "ты", дружелюбно, но профессионально.

Что ты делаешь:
- Спрашиваешь про проект клиента: цели, бюджет, сроки.
- Объясняешь наши услуги (разработка сайтов, мобильные приложения).
- Если клиент готов — предлагаешь созвон с менеджером.

Что ты НЕ делаешь:
- Не называешь конкретные цены — это решает менеджер на созвоне.
- Не обещаешь сроков.
- Не отвечаешь на вопросы вне темы (политика, погода и т.п.) —
  вежливо возвращаешь к теме проекта.

Если не знаешь ответа на технический вопрос — скажи прямо
"уточню у команды и вернусь" и предложи оставить контакты."""</code></pre>

<h2>10. Persistence — сохранение между сессиями</h2>

<p>Если бот должен помнить тебя между запусками — сохраняй историю в файл:</p>

<pre><code>import json
from pathlib import Path

class ChatBot:
    def __init__(self, system_prompt, history_file="chat_history.json"):
        self.system_prompt = system_prompt
        self.history_file = Path(history_file)
        self.history = self._load()

    def _load(self):
        if self.history_file.exists():
            with open(self.history_file) as f:
                return json.load(f)
        return []

    def _save(self):
        with open(self.history_file, "w") as f:
            json.dump(self.history, f, ensure_ascii=False, indent=2)

    def chat(self, user_msg):
        self.history.append({"role": "user", "content": user_msg})
        response = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=[{"role": "system", "content": self.system_prompt}] + self.history[-20:],
            temperature=0.7
        )
        reply = response.choices[0].message.content
        self.history.append({"role": "assistant", "content": reply})
        self._save()
        return reply</code></pre>

<p>Для production — лучше БД (SQLite, Postgres), не JSON-файл.</p>

<h2>11. UI на Streamlit за 30 строк</h2>

<p>Терминал — для отладки. Для пользователей — нужен веб-UI. Streamlit делает это за 5 минут.</p>

<pre><code>pip install streamlit</code></pre>

<h2>12. Тонкости</h2>

<h3>Не клади всё в system prompt</h3>
<p>Если у тебя 50-страничный мануал, и ты пихаешь его в system prompt каждого запроса — ты платишь за него каждый раз. Лучше — RAG (урок 14): подгружать релевантные куски только когда нужно.</p>

<h3>System prompt и role-confusion</h3>
<p>Иногда модель «забывает» о своей роли в долгих диалогах, если пользователь активно её сбивает. Лекарство: <strong>повторять ключевые правила</strong> либо в начале, либо в конце контекста (помним про lost in the middle).</p>

<h3>Идентификация пользователя</h3>
<p>В мульти-пользовательском боте нельзя смешивать историю разных людей. Каждому юзеру — отдельный <code>history</code>, ключуй по user_id.</p>

<h3>Цензура и фильтры</h3>
<p>Если бот публичный — добавь Moderation API:</p>
<pre><code>moderation = client.moderations.create(input=user_msg)
if moderation.results[0].flagged:
    return "Я не могу ответить на это."</code></pre>

<h3>Streaming + не блокирующий UI</h3>
<p>В Streamlit это делается одной строкой <code>st.write_stream(stream)</code>. В голом Flask/FastAPI — через Server-Sent Events.</p>

<h2>15. Проверь себя</h2>

<p><strong>1. Почему чат «помнит» если LLM stateless?</strong><br>
Приложение хранит историю на своей стороне и подставляет её в каждый запрос. Сама LLM ничего не помнит.</p>

<p><strong>2. Что такое sliding window?</strong><br>
Стратегия памяти: храним только последние N сообщений, остальное выбрасываем.</p>

<p><strong>3. Зачем считать токены?</strong><br>
Чтобы не упереться в лимит контекста и не платить за лишнее. Также — чтобы заранее обрезать историю.</p>

<p><strong>4. Когда нужен summary вместо sliding window?</strong><br>
Когда важно помнить ранние решения/факты, но не каждое слово. Жертвуем точностью ради покрытия.</p>

<p><strong>5. Что обязательно в system prompt?</strong><br>
Роль, стиль общения, что делать, чего не делать, что в граничных случаях.</p>

<p><strong>6. У меня 100 пользователей бота. Что важно?</strong><br>
Хранить историю отдельно для каждого user_id, никогда не смешивать. Идентифицировать по сессии или auth.</p>

<p><strong>7. Бот теряет роль на 30-м сообщении. Что делать?</strong><br>
(а) Проверить, не выпал ли system prompt из окна. (б) Дублировать ключевые правила в начале или конце контекста. (в) Использовать summary-стратегию, оставляя главное в саммари.</p>

<p><strong>8. Streamlit vs голый Flask — что выбрать?</strong><br>
Streamlit — для быстрых прототипов и внутренних инструментов. 30 строк = рабочий чат. Flask/FastAPI — для production: контроль над HTTP, мульти-юзер, аутентификация.</p>

<p><strong>9. Как сохранить историю на 1000 пользователей?</strong><br>
SQLite или Postgres, таблица <code>(user_id, role, content, timestamp)</code>. JSON-файл подойдёт только для одного пользователя.</p>

<p><strong>10. Как защитить чат от вредных запросов?</strong><br>
Moderation API на входе и/или выходе. Чёткий system prompt с явным «что не делать». Логирование и алерты на странные паттерны.</p>

<h1>Урок 8. Поиск с эмбеддингами (semantic search)</h1>

<div class="lesson-meta">
  <span><strong>Цель:</strong> понять как ИИ ищет «по смыслу» и сделать свой semantic-поисковик</span>
  <span><strong>Время:</strong> ~60 минут</span>
  <span><strong>Источник:</strong> generative-ai-for-beginners/08</span>
</div>

<h2>Зачем тебе этот урок</h2>
<p>Обычный поиск ищет <strong>совпадения слов</strong>. Если у тебя в заметках есть запись «как корректно расстаться с компанией», а ты ищешь «как уволиться без скандала» — обычный grep ничего не найдёт. Semantic search найдёт, потому что понимает смысл.</p>
<p>Это <strong>фундаментальная техника</strong>:</p>
<ul>
<li>Под капотом RAG (урок 14) — самой популярной паттерны для работы с документами.</li>
<li>Поиск по своим заметкам, тикетам, документам.</li>
<li>Дедупликация (найти похожие вопросы в FAQ).</li>
<li>Кластеризация (группировка отзывов по темам).</li>
<li>Рекомендации.</li>
</ul>
<p>К концу урока у тебя будет рабочий поисковик по твоим собственным заметкам, понимающий запросы на естественном языке.</p>

<h2>1. Что такое embedding</h2>

<h3>Идея</h3>
<p><strong>Embedding</strong> (эмбеддинг, векторное представление) — это превращение текста в <strong>массив чисел фиксированной длины</strong>, отражающий смысл этого текста. Тексты с близким смыслом имеют близкие векторы; разные — далёкие.</p>

<p>Длина вектора зависит от модели:</p>
<ul>
<li><code>text-embedding-3-small</code> — 1536 чисел.</li>
<li><code>text-embedding-3-large</code> — 3072 числа.</li>
<li>BGE-M3 — 1024.</li>
<li>Старая <code>text-embedding-ada-002</code> — 1536.</li>
</ul>

<h3>Упрощённое представление</h3>
<p>Представь, что ты строишь координатную систему смыслов. Каждый текст — точка в этом пространстве. Похожие смыслы — рядом.</p>

<pre><code>"Я хочу есть"        → [0.21, -0.45, 0.12, ...]   (1536 чисел)
"Хочу пиццу"         → [0.20, -0.43, 0.15, ...]   (близко)
"Голоден"            → [0.22, -0.44, 0.10, ...]   (близко)
"Где Эйфелева башня" → [-0.50, 0.31, -0.20, ...]  (далеко)
"Париж — столица"    → [-0.48, 0.30, -0.22, ...]  (далеко от еды, близко к башне)</code></pre>

<p>Конечно реальные числа намного сложнее и не интерпретируемы напрямую — каждое из 1536 «измерений» отвечает за какой-то смысловой аспект, выученный моделью на огромном корпусе.</p>

<h3>Откуда берутся эмбеддинги</h3>
<p>Тренируются специальные модели (отдельные от chat-моделей):</p>
<ul>
<li><strong>OpenAI:</strong> text-embedding-3-small/large.</li>
<li><strong>Open-source:</strong> BGE, E5, Sentence Transformers, BERT.</li>
<li><strong>Cohere:</strong> embed-multilingual-v3.</li>
<li><strong>Google:</strong> text-embedding-005.</li>
</ul>

<p>Под капотом это нейросеть-трансформер, которая пропускает текст через свои слои и выдаёт вектор. Принцип: текст подаётся на вход, выход последнего слоя усредняется и нормализуется.</p>

<h2>2. Косинусное сходство — как мерить «близость» векторов</h2>

<p>Когда у нас есть векторы — нам нужна метрика близости. Стандарт — <strong>cosine similarity</strong>.</p>

<h3>Формула на пальцах</h3>
<p>Косинус угла между двумя векторами. Значения от -1 до 1:</p>
<ul>
<li><code>1.0</code> — векторы совпадают (одинаковый смысл).</li>
<li><code>0.7–0.9</code> — близкий смысл.</li>
<li><code>0.3–0.6</code> — связанные темы.</li>
<li><code>0.0</code> — не связаны.</li>
<li><code>-1.0</code> — противоположны (редко на эмбеддингах текста).</li>
</ul>

<h3>Реализация на Python</h3>
<pre><code>import numpy as np

def cosine_similarity(a, b):
    a, b = np.array(a), np.array(b)
    return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))

# или, если векторы уже нормализованы (как у OpenAI):
# просто скалярное произведение
def dot(a, b):
    return sum(x*y for x, y in zip(a, b))</code></pre>

<h3>Альтернативные метрики</h3>
<ul>
<li><strong>Euclidean distance</strong> — евклидово расстояние. Работает, но cosine обычно лучше для текста.</li>
<li><strong>Dot product</strong> — для нормализованных векторов = cosine. Быстрее.</li>
<li><strong>Manhattan</strong> — почти не используется для текста.</li>
</ul>

<h2>3. Pipeline semantic search</h2>

<p>Стандартная схема (для всех векторных систем):</p>

<pre><code>┌─────────────────┐    ┌──────────┐    ┌──────────────┐    ┌──────────┐
│ Документы (.md, │ -> │ Chunking │ -> │ Embedding    │ -> │ Vector   │
│ pdf, txt, ...)  │    │          │    │ model        │    │ DB       │
└─────────────────┘    └──────────┘    └──────────────┘    └──────────┘

                                                                │
                            запрос пользователя                  │
                                    │                            │
                                    ▼                            │
                            ┌──────────────┐                     │
                            │ Embedding    │                     │
                            │ model        │                     │
                            └──────────────┘                     │
                                    │                            │
                                    ▼                            │
                            ┌──────────────────────────────────┐ │
                            │ Поиск ближайших по cosine sim    │◄┘
                            └──────────────────────────────────┘
                                    │
                                    ▼
                            топ-K результатов</code></pre>

<h3>Этапы</h3>

<p><strong>1. Chunking — нарезка документов.</strong></p>
<p>Документ редко влезает целиком в эмбеддинг. Нарезаем на куски по 200–800 токенов с небольшим перекрытием (50 токенов overlap), чтобы не разрывать важные связи.</p>

<p><strong>2. Embedding — превращение в векторы.</strong></p>
<p>Каждый chunk прогоняем через embedding-модель.</p>

<p><strong>3. Storage — хранение в векторной БД.</strong></p>
<p>Сохраняем (id, embedding, original_text, metadata).</p>

<p><strong>4. Query — поиск.</strong></p>
<p>Эмбеддим запрос, ищем top-K ближайших chunks по cosine.</p>

<p><strong>5. Return — отдаём пользователю.</strong></p>
<p>Возвращаем найденные тексты + score близости.</p>

<h2>5. Полный пример с Chroma</h2>

<pre><code>pip install chromadb openai</code></pre>

<pre><code>from openai import OpenAI
import chromadb

client = OpenAI()
chroma = chromadb.PersistentClient(path="./chroma_db")
collection = chroma.get_or_create_collection("notes")

def embed(text: str) -> list[float]:
    """Получить эмбеддинг текста через OpenAI."""
    response = client.embeddings.create(
        model="text-embedding-3-small",
        input=text
    )
    return response.data[0].embedding

# 1. Индексация заметок
notes = [
    "Сегодня встретился с Иваном, обсудили сроки запуска MVP.",
    "Купить корм коту, заехать в зоомагазин в среду.",
    "Идея: сервис для автоматической генерации тестов из ТЗ.",
    "Дед-лайн по статье — пятница.",
    "Почитать про векторные базы данных.",
    "В четверг забрать ребёнка из садика в 17:00.",
    "TODO: написать ответ HR в Лаборатории Касперского."
]

# Эмбеддим и кладём в Chroma
embeddings = [embed(note) for note in notes]
collection.add(
    ids=[f"note_{i}" for i in range(len(notes))],
    embeddings=embeddings,
    documents=notes
)

# 2. Поиск
def search(query: str, k: int = 3):
    query_emb = embed(query)
    results = collection.query(
        query_embeddings=[query_emb],
        n_results=k
    )
    return list(zip(results["documents"][0], results["distances"][0]))

# Пробуем
print(search("что мне нужно купить?"))
# → найдёт «корм коту»

print(search("какие у меня дед-лайны?"))
# → найдёт «статья пятница» и MVP

print(search("задачи связанные с детьми"))
# → найдёт «забрать ребёнка»

print(search("есть ли у меня вакансии или офферы?"))
# → найдёт «HR в Лаборатории Касперского»</code></pre>

<p>Заметь — в каждом случае модель находит правильный chunk, хотя <strong>прямых совпадений слов</strong> нет.</p>

<h2>6. Стратегии чанкинга</h2>

<h3>Простая нарезка</h3>
<pre><code>def chunk_text(text: str, chunk_size: int = 500, overlap: int = 50):
    chunks = []
    start = 0
    while start < len(text):
        end = start + chunk_size
        chunks.append(text[start:end])
        start = end - overlap
    return chunks</code></pre>
<p>Минус — режет посередине предложения.</p>

<h3>По параграфам</h3>
<pre><code>chunks = text.split("\\n\\n")</code></pre>
<p>Натуральные границы, но размеры разные.</p>

<h3>По смыслу (рекомендуется)</h3>
<p>Используй <code>RecursiveCharacterTextSplitter</code> из LangChain или его аналог:</p>
<pre><code>def smart_chunk(text, max_size=500):
    # сначала по параграфам, потом по предложениям, потом по словам
    paragraphs = text.split("\\n\\n")
    chunks = []
    current = ""
    for p in paragraphs:
        if len(current) + len(p) <= max_size:
            current += "\\n\\n" + p
        else:
            if current: chunks.append(current.strip())
            if len(p) > max_size:
                # длинный параграф — режем по предложениям
                sentences = p.split(". ")
                ...
            else:
                current = p
    if current: chunks.append(current.strip())
    return chunks</code></pre>

<h3>Размер chunk — компромисс</h3>
<ul>
<li><strong>Маленькие (~100 токенов)</strong> — точный поиск, но теряется контекст.</li>
<li><strong>Средние (~500)</strong> — стандарт.</li>
<li><strong>Большие (~2000)</strong> — широкий контекст, но смешивает темы.</li>
</ul>
<p>Для большинства задач 500 + overlap 50 — рабочая точка.</p>

<h2>7. Hybrid search — комбо semantic + keyword</h2>

<p>Иногда semantic пропускает запросы, где важно <strong>точное слово</strong> (имя продукта, артикул, аббревиатура). Hybrid search комбинирует:</p>

<ul>
<li><strong>Semantic</strong> (эмбеддинги) — для смысла.</li>
<li><strong>BM25 / keyword</strong> — для точных совпадений.</li>
<li><strong>Reranking</strong> — пересортировка финальных результатов второй моделью (cross-encoder).</li>
</ul>

<p>Поддерживается в Weaviate, Qdrant, Elasticsearch + плагины. Для прода почти всегда выигрывает у чистого semantic.</p>

<h2>8. Стоимость эмбеддингов</h2>

<p>Цены OpenAI:</p>
<ul>
<li>text-embedding-3-small: <strong>$0.02 / 1M токенов</strong> input.</li>
<li>text-embedding-3-large: <strong>$0.13 / 1M</strong>.</li>
</ul>

<p>Реально:</p>
<ul>
<li>Эмбеддинг 1000 заметок по 200 токенов = 200k токенов = <strong>$0.004</strong>. Копейки.</li>
<li>Эмбеддинг целой Wikipedia (~3 миллиарда токенов) = <strong>$60</strong>.</li>
</ul>

<p>Однажды эмбеддишь — потом только запросы. Запрос — 1 эмбеддинг = ~50 токенов = $0.000001. Очень дёшево.</p>

<h2>9. Open-source эмбеддинги</h2>

<p>Если не хочешь платить или нужна приватность — open-source модели через <code>sentence-transformers</code>:</p>

<pre><code>pip install sentence-transformers</code></pre>

<pre><code>from sentence_transformers import SentenceTransformer

# Качественная мультиязычная модель

# Один раз скачается (~2 ГБ), потом работает локально

# Батчем для скорости

<p>Качество BGE-M3 на русском сравнимо с OpenAI. Бесплатно после скачивания. На современном CPU — ~50 эмбеддингов/сек, на GPU — тысячи.</p>

<h2>10. Тонкости и подводные камни</h2>

<h3>Метаданные</h3>
<p>Сохраняй вместе с эмбеддингами полезные метаданные — потом можно фильтровать:</p>
<pre><code>collection.add(
    ids=["note_1"],
    embeddings=[emb],
    documents=[note],
    metadatas=[{"date": "2026-05-04", "tag": "work", "author": "me"}]
)

# Поиск с фильтром
collection.query(
    query_embeddings=[q_emb],
    n_results=5,
    where={"tag": "work"}
)</code></pre>

<h3>Несовпадение моделей при поиске</h3>
<p>Если эмбеддил коллекцию моделью X, а ищешь моделью Y — результаты будут полным мусором. Векторные пространства разных моделей <strong>несовместимы</strong>. Запиши в metadata, какой моделью эмбеддил.</p>

<h3>Multilingual проблемы</h3>
<p>Не все embedding-модели хорошо работают на русском. Хорошие на русском:</p>
<ul>
<li>OpenAI text-embedding-3-* — отлично.</li>
<li>BGE-M3 — отлично, мультиязычно.</li>
<li>multilingual-e5-large — отлично.</li>
<li>cohere multilingual-v3 — отлично.</li>
</ul>
<p>Старая ada-002 на русском была слабее, но всё ещё рабочая.</p>

<h3>Когда semantic проигрывает</h3>
<ul>
<li>Поиск по точным артикулам, ID, кодам.</li>
<li>Очень короткие запросы (1–2 слова).</li>
<li>Тексты на узком жаргоне, где модель не училась.</li>
</ul>
<p>Решение — hybrid search (см. секция 7).</p>

<h3>Скейл</h3>
<p>Cosine similarity между N векторами и одним запросом — O(N). При 1M документов это ~100ms на CPU. Для бо́льших объёмов — приближённый поиск (ANN — Approximate Nearest Neighbor): HNSW, IVF. Все нормальные векторные БД делают это автоматически.</p>

<h2>11. Глоссарий</h2>
<ul>
<li><strong>Embedding</strong> — числовой вектор, представляющий смысл текста.</li>
<li><strong>Cosine similarity</strong> — мера близости двух векторов (-1...1).</li>
<li><strong>Chunk</strong> — кусок исходного документа.</li>
<li><strong>Chunking</strong> — стратегия нарезки документов.</li>
<li><strong>Vector DB</strong> — хранилище векторов с быстрым поиском.</li>
<li><strong>k-NN</strong> — k-Nearest Neighbors, поиск k ближайших.</li>
<li><strong>ANN</strong> — Approximate Nearest Neighbor, быстрый приближённый поиск.</li>
<li><strong>HNSW</strong> — Hierarchical Navigable Small World, популярный ANN-алгоритм.</li>
<li><strong>BM25</strong> — классический keyword-алгоритм.</li>
<li><strong>Hybrid search</strong> — combo semantic + keyword.</li>
<li><strong>Reranking</strong> — пересортировка результатов второй моделью.</li>
<li><strong>Cross-encoder</strong> — модель для reranking, оценивает пару (query, doc).</li>
<li><strong>Sentence Transformers</strong> — Python-библиотека для embedding-моделей.</li>
</ul>

<h2>12. Практика (60 минут)</h2>

<h2>13. Проверь себя</h2>

<p><strong>1. Что такое embedding одним предложением?</strong><br>
Числовой вектор фиксированной длины, представляющий смысл текста. Близкие смыслы = близкие векторы.</p>

<p><strong>2. Почему semantic search умнее keyword?</strong><br>
Понимает синонимы, перефразировки, смысловые связи. Находит «купить корм коту» по запросу «что нужно купить».</p>

<p><strong>3. Зачем чанкать документы перед эмбеддингом?</strong><br>
(а) Документ не влезает целиком (лимит embedding-модели). (б) Маленькие куски дают точный поиск. (в) Гранулярность результатов — пользователь видит релевантный кусок, а не всю книгу.</p>

<p><strong>4. Какая мера близости используется?</strong><br>
Cosine similarity (косинус угла). Для нормализованных векторов эквивалентно скалярному произведению.</p>

<p><strong>5. Назови 3 векторные БД.</strong><br>
Chroma, Qdrant, Pinecone (или Weaviate, pgvector, Milvus, LanceDB, FAISS).</p>

<p><strong>6. Я эмбеддил коллекцию ada-002. Можно искать в ней с text-embedding-3-small?</strong><br>
Нет. Векторные пространства разных моделей несовместимы — поиск выдаст мусор. Нужно переэмбеддить всё одной моделью.</p>

<p><strong>7. Стандартный размер chunk?</strong><br>
500 токенов с overlap 50. Зависит от задачи: для точного поиска факта — меньше (~200), для широкого контекста — больше (~1000).</p>

<p><strong>8. Когда нужен hybrid search?</strong><br>
Когда важны точные совпадения (артикулы, имена, аббревиатуры) И смысл одновременно. Чистый semantic иногда пропускает важные точные совпадения.</p>

<p><strong>9. Что такое ANN и зачем?</strong><br>
Approximate Nearest Neighbor — приближённый поиск ближайших векторов. Жертвует точностью ради скорости. Нужен при объёме &gt;100k векторов, иначе линейный поиск медленный.</p>

<p><strong>10. Бесплатные embedding-модели для русского?</strong><br>
BGE-M3, multilingual-e5-large — обе через <code>sentence-transformers</code>, работают локально, качество как у OpenAI.</p>

<h2>14. Что должно остаться в голове</h2>
<ol>
<li><strong>Embedding</strong> — вектор смысла. База всего semantic-мира.</li>
<li><strong>Cosine similarity</strong> — стандартная мера близости.</li>
<li><strong>Pipeline:</strong> chunks → embed → vector DB → query embed → top-K.</li>
<li><strong>Chroma</strong> для прототипов; <strong>Qdrant / pgvector</strong> для прода.</li>
<li><strong>Chunking</strong> 500 + overlap 50 — рабочая точка.</li>
<li><strong>Hybrid search</strong> побеждает чистый semantic в проде.</li>
<li><strong>OpenAI embeddings</strong> для удобства; <strong>BGE-M3</strong> для приватности и экономии.</li>
<li><strong>Метаданные</strong> в БД для фильтров — обязательно.</li>
</ol>

      <p style="margin-top: 2rem; font-size: 0.85rem; color: var(--text-muted);">Готово полных уроков: <strong>${written}</strong> из ${total}. Остальные — со структурой и кратким описанием.</p>
    </div>
    <div class="callout callout-info" style="margin-top: 3rem;">
      <h3>Как заниматься</h3>
      <ol>
        <li><strong>Не больше 1 урока в день.</strong> Делай дайджест в конце каждого.</li>
        <li><strong>Каждый урок = микро-результат.</strong> Без своего кода/скриншота — урок не закрыт.</li>
        <li><strong>Веди журнал</strong> в файле <code>progress.md</code> рядом.</li>
        <li><strong>Возвращайся.</strong> В конце каждой фазы — устный пересказ ключевых пунктов.</li>
        <li><strong>Один проект сквозь все фазы.</strong> Возьми реальную задачу и наращивай её.</li>
      </ol>
    </div>
    <div class="callout callout-success">
      <h3>Структура</h3>
      <p><strong>Фаза 1. Пользователь</strong> (12 уроков) — LLM, промпты, RAG, безопасность.</p>
      <p><strong>Фаза 2. Строитель</strong> (18 уроков) — function calling, агенты, продакшен.</p>
      <p><strong>Фаза 3. Практик</strong> (20 уроков) — нейросети с нуля, CV, NLP, трансформеры.</p>
      <p><strong>Фаза 4. Инженер</strong> (22 урока) — ML, RL, MLOps, fine-tuning.</p>
    </div>
  `;
}

function filterLessons(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.lesson-link').forEach(link => {
    const matches = !q || link.dataset.title.includes(q);
    link.style.display = matches ? '' : 'none';
  });
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('theme-icon').textContent = next === 'dark' ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = next === 'dark' ? 'Светлая тема' : 'Тёмная тема';
  localStorage.setItem(THEME_KEY, next);
}

// Init
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme) {
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('theme-icon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = savedTheme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
}

buildNav();
updateProgressUI();

// Open from hash if present
const hashMatch = window.location.hash.match(/lesson-(\d+)/);
const staticHash = window.location.hash.replace('#', '');
if (hashMatch) {
  openLesson(parseInt(hashMatch[1]));
} else if (['about', 'howto', 'faq'].includes(staticHash)) {
  openStaticPage(staticHash);
} else {
  // Новый посетитель → страница "О курсе"
  // Возвращающийся (что-то прошёл) → продолжить с последнего урока
  const hasProgress = Object.keys(progress).length > 0;
  if (hasProgress) {
    renderWelcome();
  } else {
    openStaticPage('about');
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft' && currentLessonId) {
    const prev = LESSONS.find(l => l.id === currentLessonId - 1);
    if (prev) openLesson(prev.id);
  }
  if (e.key === 'ArrowRight' && currentLessonId) {
    const next = LESSONS.find(l => l.id === currentLessonId + 1);
    if (next) openLesson(next.id);
  }
});
</script>
</body>
