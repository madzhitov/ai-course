function openQuiz(phaseId) {
  currentLessonId = null;
  setActiveStaticLink(null);
  closeSidebar();
  history.replaceState(null, '', `#quiz-${phaseId}`);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderQuiz(phaseId);
  buildNav();
}

function renderQuiz(phaseId) {
  const quiz = QUIZZES[phaseId];
  if (!quiz) {
    document.getElementById('lesson-content').innerHTML = `
      <h1>Квиз пока не готов</h1>
      <p>Нужно пройти больше уроков, чтобы появился квиз.</p>
    `;
    return;
  }

  const stateKey = `quiz_phase_${phaseId}_state`;
  let answers = JSON.parse(localStorage.getItem(stateKey) || '{}');

  let html = `
    <h1>🎓 ${quiz.title}</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">${quiz.description}</p>
    <div class="quiz-progress" id="quiz-progress">Отвечено: 0 из ${quiz.questions.length}</div>
  `;

  quiz.questions.forEach((q, qIdx) => {
    html += `
      <div class="quiz-card" id="quiz-q-${qIdx}">
        <div class="quiz-question">${qIdx + 1}. ${q.q}</div>
        <ul class="quiz-options">
          ${q.options.map((opt, optIdx) => `
            <li><button data-q="${qIdx}" data-opt="${optIdx}" onclick="answerQuiz(${phaseId}, ${qIdx}, ${optIdx})">${opt}</button></li>
          `).join('')}
        </ul>
        <div id="quiz-explain-${qIdx}"></div>
      </div>
    `;
  });

  html += `
    <div id="quiz-final" style="display: none;"></div>
  `;

  document.getElementById('lesson-content').innerHTML = html;

  // восстановим уже отвеченные
  Object.entries(answers).forEach(([qIdx, optIdx]) => {
    applyQuizAnswer(phaseId, parseInt(qIdx), parseInt(optIdx), false);
  });
  updateQuizProgress(phaseId);
}

function answerQuiz(phaseId, qIdx, optIdx) {
  const stateKey = `quiz_phase_${phaseId}_state`;
  let answers = JSON.parse(localStorage.getItem(stateKey) || '{}');
  if (qIdx in answers) return; // уже ответил
  answers[qIdx] = optIdx;
  localStorage.setItem(stateKey, JSON.stringify(answers));
  applyQuizAnswer(phaseId, qIdx, optIdx, true);
  updateQuizProgress(phaseId);
}

function applyQuizAnswer(phaseId, qIdx, optIdx, animate) {
  const quiz = QUIZZES[phaseId];
  const q = quiz.questions[qIdx];
  const card = document.getElementById(`quiz-q-${qIdx}`);
  if (!card) return;
  const buttons = card.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  buttons[optIdx].classList.add(optIdx === q.correct ? 'correct' : 'wrong');
  if (optIdx !== q.correct) {
    buttons[q.correct].classList.add('correct');
  }
  document.getElementById(`quiz-explain-${qIdx}`).innerHTML = `
    <div class="quiz-result">
      ${optIdx === q.correct ? '✓ Верно!' : '✗ Неверно.'} ${q.explain}
    </div>
  `;
}

function updateQuizProgress(phaseId) {
  const stateKey = `quiz_phase_${phaseId}_state`;
  const answers = JSON.parse(localStorage.getItem(stateKey) || '{}');
  const quiz = QUIZZES[phaseId];
  const total = quiz.questions.length;
  const done = Object.keys(answers).length;
  const correct = Object.entries(answers).filter(([qIdx, optIdx]) =>
    parseInt(optIdx) === quiz.questions[parseInt(qIdx)].correct
  ).length;

  document.getElementById('quiz-progress').textContent =
    `Отвечено: ${done} из ${total}` + (done === total ? ` · Правильно: ${correct} из ${total}` : '');

  if (done === total) {
    progress[`quiz_phase_${phaseId}`] = correct;
    saveProgress();

    let msg;
    if (correct === total) msg = `🏆 Идеально! ${correct}/${total}. Готов к следующей фазе.`;
    else if (correct >= total * 0.7) msg = `✅ Отлично! ${correct}/${total}. Можно идти дальше.`;
    else if (correct >= total * 0.5) msg = `🟡 Неплохо: ${correct}/${total}. Стоит перечитать уроки, где ошибся.`;
    else msg = `🔄 ${correct}/${total}. Рекомендую перечитать фазу — в этом нет ничего страшного.`;

    document.getElementById('quiz-final').style.display = 'block';
    document.getElementById('quiz-final').innerHTML = `
      <div class="callout callout-success" style="margin-top: 2rem;">
        <h3>${msg}</h3>
        <p>Хочешь сбросить результат и пройти заново? <button onclick="resetQuiz(${phaseId})" class="nav-btn" style="margin-top: 0.5rem;">Сбросить</button></p>
      </div>
    `;
  }
}

function resetQuiz(phaseId) {
  if (!confirm('Сбросить ответы и пройти заново?')) return;
  localStorage.removeItem(`quiz_phase_${phaseId}_state`);
  delete progress[`quiz_phase_${phaseId}`];
  saveProgress();
  renderQuiz(phaseId);
}

// Форматирование даты для отображения: "2026-05-11" → "11.05.2026"
function fmtDate(isoDate) {
  if (!isoDate || typeof isoDate !== 'string') return '';
  const parts = isoDate.split('-');
  if (parts.length !== 3) return isoDate;
  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

function subscribeEmail(event) {
  event.preventDefault();
  const email = event.target.querySelector('input[name="email"]').value;
  const subs = JSON.parse(localStorage.getItem('email_subscribers') || '[]');
  if (!subs.includes(email)) subs.push(email);
  localStorage.setItem('email_subscribers', JSON.stringify(subs));
  event.target.innerHTML = '<div class="callout callout-success" style="margin: 0;">✓ Спасибо! Я свяжусь с тобой когда выйдет первая рассылка.</div>';
}

    <p>Если застрял на уроке — не пытайся понять всё сразу. Пройди его на 70%, иди дальше. Через 5–10 уроков вернёшься, и многое станет очевидным — потому что в голове появятся другие концепции, которые помогут.</p>

    <p><strong>...я хочу пропустить теорию и сразу к коду?</strong> — Тогда тебе пригодятся сразу Уроки 6, 7, 8 (API, чат, semantic search). Но через 1–2 недели вернись и прочитай теоретические — пригодятся.</p>

function filterLessons(query) {
  const q = query.toLowerCase().trim();

  // 1. Фильтруем уроки по data-title; статичные ссылки оставляем как есть
  document.querySelectorAll('.lesson-link').forEach(link => {
    if (link.classList.contains('static-link')) {
      link.style.display = '';     // "Главная", "О курсе", "FAQ" и т.п.
      return;
    }
    const title = (link.dataset.title || '').toLowerCase();
    const matches = !q || title.includes(q);
    link.style.display = matches ? '' : 'none';
  });

  // 2. Скрываем заголовки фаз/треков без видимых уроков
  document.querySelectorAll('#lesson-nav .phase, #track-nav .phase').forEach(phase => {
    const lessons = phase.querySelectorAll('.lesson-link:not(.static-link)');
    if (lessons.length === 0) return;
    const anyVisible = Array.from(lessons).some(l => l.style.display !== 'none');
    phase.style.display = (q && !anyVisible) ? 'none' : '';
  });
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('theme-icon').textContent = next === 'dark' ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = next === 'dark' ? 'Светлая тема' : 'Тёмная тема';
  localStorage.setItem(THEME_KEY, next);
}

// Init
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme) {
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('theme-icon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = savedTheme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
}

buildNav();
updateProgressUI();

// Open from hash if present
const hashMatch = window.location.hash.match(/lesson-(\d+)/);
const trackHash = window.location.hash.match(/lesson-([cpi]\d+)/);
const quizHash = window.location.hash.match(/quiz-(\d+)/);
const sectionHash = window.location.hash.match(/section-(main|claude|projects|industry)/);
const glossaryTermHash = window.location.hash.match(/^#glossary-(.+)$/);
const staticHash = window.location.hash.replace('#', '');
if (hashMatch) {
  openLesson(parseInt(hashMatch[1]));
} else if (trackHash) {
  openLesson(trackHash[1]);
} else if (quizHash) {
  openQuiz(parseInt(quizHash[1]));
} else if (sectionHash) {
  openSection(sectionHash[1]);
} else if (glossaryTermHash) {
  openGlossary(glossaryTermHash[1]);
} else if (staticHash === 'glossary') {
  openGlossary();
} else if (['home', 'about', 'howto', 'faq', 'changelog', 'resources', 'admin'].includes(staticHash)) {
  openStaticPage(staticHash);
} else {
  // По умолчанию — Home
  openStaticPage('home');
}

// Трекинг первого посещения (welcome event)
if (!localStorage.getItem('first_visit')) {
  localStorage.setItem('first_visit', new Date().toISOString());
  trackEvent('first-visit', 'First visit');
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  // Cmd/Ctrl+K — focus search (works from anywhere)
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    const search = document.querySelector('.search-box');
    if (search) {
      if (window.innerWidth < 769 && !document.body.classList.contains('sidebar-open')) {
        document.body.classList.add('sidebar-open');
      }
      search.focus();
      search.select();
    }
    return;
  }
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape' && document.body.classList.contains('sidebar-open')) {
    closeSidebar();
    return;
  }
  if (e.key === 'ArrowLeft' && currentLessonId) {
    const prev = LESSONS.find(l => l.id === currentLessonId - 1);
    if (prev) openLesson(prev.id);
  }
  if (e.key === 'ArrowRight' && currentLessonId) {
    const next = LESSONS.find(l => l.id === currentLessonId + 1);
    if (next) openLesson(next.id);
  }
});
