<p>Главные технические заботы при деплое AI-приложения:</p>
<ul>
<li><strong>Секреты:</strong> API ключи в env vars, не в коде</li>
<li><strong>Rate limits:</strong> на пользователя и на endpoint</li>
<li><strong>Таймауты:</strong> LLM-вызов может занять 30+ секунд, обычные web-фреймворки этого не любят</li>
<li><strong>Стриминг:</strong> ответ возвращается по частям, нужно настроить SSE</li>
<li><strong>Cost limits:</strong> hard cap на день/месяц, чтобы не разорить тебя</li>
</ul>

<h2>6. Этап 5: Monitoring — что мерить</h2>

<p>Метрики делятся на 4 группы:</p>

<h3>Технические</h3>
<ul>
<li>Latency: <strong>p50, p95, p99</strong> — половина запросов быстрее p50, 5% медленнее p95</li>
<li>Error rate: % запросов с ошибкой</li>
<li>Throughput: запросов в секунду</li>
<li>Stream interruption rate: сколько ответов прервалось на полпути</li>
</ul>

<h3>Финансовые</h3>
<ul>
<li>Cost per request: средняя стоимость одного запроса</li>
<li>Cost per user per day: сколько на тебе зарабатывает / стоит каждый пользователь</li>
<li>Token usage breakdown: input vs output, по моделям</li>
</ul>

<h3>Качественные (AI-специфичные)</h3>
<ul>
<li>Hallucination rate: % ответов с фактическими ошибками (через автоматические или ручные проверки)</li>
<li>Refusal rate: % отказов модели отвечать</li>
<li>User feedback score: thumbs up/down</li>
<li>Retry rate: сколько пользователей переспрашивают</li>
</ul>

<h3>Продуктовые</h3>
<ul>
<li>Активность: DAU, WAU, retention</li>
<li>Engagement: сколько сообщений в сессии</li>
<li>Конверсия: дошли ли до целевого действия</li>
</ul>

<h2>7. Этап 6: Improvement — закрываем цикл</h2>

<p>После запуска поступает реальный фидбек — логи, оценки, жалобы. Что с этим делать:</p>

<ol>
<li><strong>Анализ топ-10 проблемных кейсов</strong> в неделю. Не пытайся починить всё — найди 10 худших и разберись.</li>
<li><strong>Добавляй их в test-set</strong>. Каждая жалоба становится регрессионным тестом.</li>
<li><strong>Итерируй промпт</strong> или add knowledge через RAG. Не fine-tune сразу — это последний ресурс.</li>
<li><strong>A/B-тестируй</strong> новую версию: 10% пользователей на новой, 90% на старой. Через неделю — смотри метрики.</li>
<li><strong>Rollback план</strong> — если новое плохо, моментально вернись.</li>
</ol>

<h2>8. Pitfalls — частые грабли</h2>

<h3>Slack-driven development</h3>
<p>«Менеджер написал в Slack — модель отвечает плохо на X» → разработчик молниеносно правит промпт → завтра новая жалоба про Y → правка → Z → ...</p>
<p>Без eval-сета вы реактивно носитесь за каждой жалобой, ломая то, что работало.</p>

<h3>Версии моделей</h3>
<p>OpenAI обновляет <code>gpt-4o</code> без предупреждения. Ваш протестированный промпт может начать вести себя иначе. <strong>Используйте версии:</strong> <code>gpt-4o-2024-11-20</code> вместо просто <code>gpt-4o</code>.</p>

<h3>Стоимость без лимитов</h3>
<p>Одного бага достаточно: пользователь зацикливается на «попробуй ещё раз», вы платите $500 за день. <strong>Хард-лимиты на пользователя обязательны.</strong></p>

<h3>Логирование PII</h3>
<p>Если в промптах от пользователей паспортные данные и т.п. — это всё попадает в ваши логи Langfuse / Sentry. Юридический риск. <strong>Маскируйте перед логированием.</strong></p>

<h3>Упражнение 1. Eval-сет для своего проекта (20 минут)</h3>
<p>Возьми один из своих pet-проектов (бот из урока 7 или RAG из урока 8).</p>
<ol>
<li>Запиши 20 реальных запросов, которые ты задавал ему</li>

</ol>

<h2>11. Проверь себя</h2>

<p><strong>1. Чем отличается тестирование AI-приложения от обычного?</strong><br>
LLM недетерминирован — на одинаковый промпт может давать разные ответы. Поэтому используют eval-сеты (наборы кейсов с ожиданиями) и LLM-as-judge вместо unit-тестов.</p>

<p><strong>2. Что такое golden dataset?</strong><br>
Эталонный набор тестовых случаев (20–500 штук), на котором проверяешь приложение после каждого изменения. Защищает от регрессий.</p>

<p><strong>3. Когда использовать LLM-as-judge?</strong><br>
Когда автоматические проверки (регулярки, точные совпадения) не подходят — например, оценить тон, креативность, корректность пересказа. Минус: дорого и сама LLM-судья может ошибаться.</p>

<p><strong>4. Что такое drift модели?</strong><br>
Изменение поведения модели со временем. OpenAI / Anthropic обновляют свои модели, и старые промпты могут вести себя иначе. Фикс: пиннить версии моделей и тестировать перед апгрейдом.</p>

<p><strong>5. Назови 3 финансовых KPI для AI-приложения.</strong><br>
Cost per request, cost per user per day, token usage breakdown (input vs output).</p>

<p><strong>6. Что значит p95 latency?</strong><br>
95% запросов обработаны быстрее этого значения. Если p95 = 3 сек — значит каждый 20-й пользователь ждёт дольше 3 секунд.</p>

<p><strong>7. Почему важны hard cost limits?</strong><br>
Один баг или зацикливание = $500–5000 за день. Хард-лимиты на пользователя и приложение в OpenAI/Anthropic settings спасают от разорения.</p>

<p><strong>8. Что такое slack-driven development?</strong><br>
Антипаттерн: реактивно правишь промпты по каждой жалобе из Slack без eval-сета. Ломает то, что работало.</p>

<p><strong>9. Когда A/B-тестировать?</strong><br>
Перед мажорным изменением промпта или сменой модели. Маленький процент пользователей (5–10%) на новой, остальные на старой. Сравнить метрики через 3–7 дней.</p>

<p><strong>10. Какой инструмент я бы выбрал для observability с нуля?</strong><br>
Langfuse — open source, бесплатный self-hosted или generous free tier, покрывает логирование + eval + analytics в одном.</p>

<h2>12. Что должно остаться в голове</h2>
<ol>
<li><strong>Жизненный цикл AI-приложения цикличен:</strong> use case → prototype → eval → deploy → monitor → improve → eval...</li>
<li><strong>Eval — главное отличие от обычной разработки.</strong> Без него ты «носишь воду» в реакции на жалобы.</li>
<li><strong>Golden dataset</strong> важнее красивого кода.</li>
<li><strong>Пиннить версии моделей</strong> — модели дрейфуют без предупреждения.</li>
<li><strong>Hard cost limits обязательны</strong> — один баг разорит.</li>
<li><strong>Метрики:</strong> технические + финансовые + качественные + продуктовые. Все четыре.</li>
<li><strong>Langfuse + Promptfoo</strong> — стартовый stack для серьёзного приложения.</li>
</ol>

</div>

<h1>Урок 16. Что такое ИИ-агенты</h1>

<div class="lesson-meta">
  <span><strong>Цель:</strong> понять, что такое агент, чем он отличается от чат-бота и когда он нужен</span>
  <span><strong>Время:</strong> ~45 минут</span>
  <span><strong>Источник:</strong> ai-agents-for-beginners/01, anthropic.com/news, lilianweng.github.io</span>
</div>

<h2>Зачем тебе этот урок</h2>
<p>2024–2026 — это годы агентов. Slack-боты, code-агенты типа Cursor и Cline, browser-агенты типа Operator, корпоративные copilots — везде агенты. Если ты строишь AI-приложения, ты неизбежно перейдёшь от «один промпт — один ответ» к «много шагов, инструменты, цикл».</p>
<p>Но между «модным словом» и реально полезным агентом — пропасть. Большинство сегодняшних «агентов» — это просто чат-боты с громким названием. Этот урок — про то, что такое настоящий агент и когда он действительно даёт ценность.</p>

<h2>1. Определение и анатомия</h2>

<p>В простейшей форме:</p>

<blockquote><strong>Агент — это LLM, которая в цикле решает задачу, используя инструменты, пока не достигнет цели.</strong></blockquote>

<p>Четыре ключевых компонента:</p>

<ol>
<li><strong>«Мозг»</strong> — LLM, которая принимает решения</li>
<li><strong>Цель</strong> — что нужно сделать (от пользователя)</li>
<li><strong>Инструменты</strong> — действия в мире (search, send_email, run_code, ...)</li>
<li><strong>Цикл</strong> — повторяющиеся итерации до достижения цели</li>
</ol>

<p>Часто добавляют пятый компонент:</p>

<ol start="5">
<li><strong>Память</strong> — что агент знает о пользователе и о ходе выполнения задачи</li>
</ol>

<h2>2. Агент vs чат-бот vs RAG vs function calling</h2>

<p>Эти термины часто смешивают. Разберём.</p>

<table>
<tr><th>Концепт</th><th>Что делает</th><th>Однократно или в цикле?</th></tr>
<tr><td><strong>Чат-бот</strong></td><td>Отвечает на сообщение текстом, держит контекст диалога</td><td>Один цикл «запрос → ответ»</td></tr>
<tr><td><strong>RAG</strong></td><td>Перед ответом достаёт релевантные документы и подмешивает в промпт</td><td>Один цикл, но с предварительным retrieval</td></tr>
<tr><td><strong>Function calling</strong></td><td>В рамках одного ответа модель может вызвать функцию и получить результат</td><td>1-2 цикла «решить → вызвать → ответить»</td></tr>
<tr><td><strong>Агент</strong></td><td>Многошаговое решение задачи с инструментами и стратегией</td><td>5–100 циклов в одной задаче</td></tr>
</table>

<p>Главная разница — <strong>автономность и количество шагов</strong>. Function calling — это «один-два инструмента, в одном ответе». Агент — «десятки решений, несколько инструментов, стратегия, проверка результата».</p>

<h2>3. Цикл ReAct — каркас почти всех современных агентов</h2>

<p>Мы коротко касались ReAct в уроке 5. Здесь разберём подробнее как операционный паттерн.</p>

<p>На каждом шаге агент делает три вещи:</p>

<ol>
<li><strong>Thought</strong> — рассуждает: «что мне нужно?», «какой шаг следующий?»</li>
<li><strong>Action</strong> — вызывает инструмент: <code>search("погода в Москве")</code></li>
<li><strong>Observation</strong> — получает результат от инструмента и добавляет в контекст</li>
</ol>

<p>Дальше — следующий Thought, и так до тех пор, пока не Thought = «всё, у меня есть ответ для пользователя».</p>

<p>Пример сессии агента, который должен ответить «Какая средняя температура в столицах G7?»:</p>

<pre><code>Thought: Мне нужны столицы G7 и температура в каждой
Action: search("G7 страны и столицы")
Observation: США (Вашингтон), Япония (Токио), Германия (Берлин)...

Thought: Теперь нужна погода в каждой
Action: weather("Вашингтон")
Observation: +12°C

Thought: Следующая...
Action: weather("Токио")
Observation: +18°C
... (повторяется для всех)

Thought: У меня все данные. Считаю среднее.
Action: calculate(mean of [12, 18, 8, 11, 14, 9, 13])
Observation: 12.14

Final Answer: Средняя температура в столицах G7 — около 12°C.</code></pre>

<p>Этот же паттерн крутится внутри Claude Desktop с MCP-серверами, внутри Cursor с инструментами, внутри Browser-Use агентов.</p>

<h2>5. Фреймворки — обзор экосистемы</h2>

<table>
<tr><th>Фреймворк</th><th>Сильные стороны</th><th>Для кого</th></tr>

<h2>6. Когда нужен агент, а когда нет</h2>

<h3>Не нужен агент</h3>
<ul>
<li>Задача в один шаг — «переведи текст», «сделай summary». Используй просто LLM.</li>
<li>Задача с одним действием — «зарегистрируй пользователя». Используй function calling.</li>
<li>Задача поиска в документах — используй RAG.</li>
<li>Задача с известным алгоритмом — пиши обычный код.</li>
</ul>

<h3>Нужен агент</h3>
<ul>
<li>Задача требует нескольких шагов, и порядок шагов зависит от промежуточных результатов</li>
<li>Нужно гибко комбинировать инструменты</li>
<li>Нет жёсткого алгоритма — нужна стратегия</li>
<li>Готов мириться с тем, что задача может занять 1–10 минут вместо секунд</li>
</ul>

<p>Простой тест: <strong>можешь ли ты заранее описать в коде последовательность шагов? Если да — пиши код, а не агент.</strong></p>

<h2>7. Тёмные стороны</h2>

<h3>Стоимость</h3>
<p>10 шагов агента ≈ 10 LLM-вызовов ≈ в 10 раз дороже одного запроса. На сложных задачах — $1–5 за выполнение. Считай экономику.</p>

<h3>Latency</h3>
<p>30 секунд — 5 минут на типичную задачу. Не подходит для интерактива «спросил — получил».</p>

<h3>Надёжность</h3>
<p>Каждый шаг = потенциальная ошибка. Если каждый шаг работает в 95% случаев, после 10 шагов точность падает до 60%.</p>
<p>Поэтому: <strong>чем меньше шагов в одной сессии — тем надёжнее</strong>. Декомпозируй большие задачи.</p>

<h3>Безопасность</h3>
<p>Агент с инструментами может удалить файлы, отправить деньги, опубликовать что-то. Sandbox + human-in-the-loop для критичного. Подробно в уроке 21.</p>

<li><strong>Урок 23:</strong> Мульти-агентные системы</li>
<li><strong>Урок 24:</strong> Метакогниция и саморефлексия</li>
<li><strong>Урок 25:</strong> Контекст-инжиниринг и память</li>
<li>...и далее</li>
</ul>

<h2>9. Глоссарий</h2>
<ul>
<li><strong>Агент</strong> — LLM в цикле с инструментами для достижения цели</li>
<li><strong>Tool / Инструмент</strong> — функция, которую агент может вызывать (search, send_email, run_code)</li>
<li><strong>ReAct</strong> — паттерн «Thought → Action → Observation» в цикле</li>
<li><strong>Plan-and-Execute</strong> — сначала составить план, потом выполнять шаги</li>
<li><strong>Reflection</strong> — агент проверяет и улучшает свой ответ перед финалом</li>
<li><strong>Multi-agent</strong> — несколько агентов в команде с разными ролями</li>
<li><strong>Orchestrator</strong> — главный агент, координирующий остальных</li>
<li><strong>Memory</strong> — что агент помнит между шагами и между задачами</li>
<li><strong>Sandbox</strong> — изолированная среда исполнения для безопасности</li>
<li><strong>Human-in-the-loop (HITL)</strong> — обязательное участие человека в критичных решениях</li>
</ul>

<h2>10. Практика (45 минут)</h2>

<h3>Упражнение 1. Анализ задач из жизни (15 минут)</h3>
<p>Возьми 5 задач из своей работы. Для каждой реши:</p>
<ul>
<li>Можно сделать одним LLM-вызовом? → не агент</li>
<li>Нужен один tool? → function calling</li>
<li>Нужно несколько шагов с условной логикой? → агент</li>
</ul>

<h3>Упражнение 2. Простой агент на 30 строк (30 минут)</h3>
<p>Базовый ReAct-агент с одним инструментом — калькулятором:</p>

<pre><code>from anthropic import Anthropic

client = Anthropic()

tools = [{
    "name": "calculator",
    "description": "Вычисляет математическое выражение",
    "input_schema": {
        "type": "object",
        "properties": {"expression": {"type": "string"}},
        "required": ["expression"]
    }
}]

def run_tool(name, args):
    if name == "calculator":
        try:
            return str(eval(args["expression"]))
        except Exception as e:
            return f"Ошибка: {e}"

def agent(task):
    messages = [{"role": "user", "content": task}]
    while True:
        response = client.messages.create(
            model="claude-sonnet-4-5",
            max_tokens=1024,
            tools=tools,
            messages=messages
        )
        if response.stop_reason == "end_turn":
            for block in response.content:
                if block.type == "text":
                    return block.text
        if response.stop_reason == "tool_use":
            messages.append({"role": "assistant", "content": response.content})
            tool_results = []
            for block in response.content:
                if block.type == "tool_use":
                    result = run_tool(block.name, block.input)
                    tool_results.append({
                        "type": "tool_result",
                        "tool_use_id": block.id,
                        "content": result
                    })
            messages.append({"role": "user", "content": tool_results})

print(agent("Если книгу из 480 страниц читать по 30 страниц в день, а в субботу и воскресенье по 50, за сколько дней прочитаю?"))</code></pre>

<p>Этот агент будет вызывать калькулятор несколько раз, рассуждая вслух, пока не получит ответ.</p>

<h2>11. Проверь себя</h2>

<p><strong>1. Какие 4 ключевых компонента у агента?</strong><br>
Мозг (LLM), цель, инструменты, цикл выполнения. Плюс память — необязательный, но часто пятый.</p>

<p><strong>2. Чем агент отличается от function calling?</strong><br>
Function calling — один-два инструмента в одном ответе. Агент — десятки шагов в цикле, со стратегией.</p>

<p><strong>3. Что такое цикл ReAct?</strong><br>
Thought → Action → Observation, повторяется до достижения цели.</p>

<p><strong>4. Когда не нужен агент?</strong><br>
Когда задача одношаговая, либо когда у тебя есть жёсткий алгоритм — лучше написать обычный код.</p>

<p><strong>5. Что такое сложность ошибки в агенте?</strong><br>
Точность падает экспоненциально с числом шагов. 95% × 10 шагов ≈ 60% общей точности.</p>

<p><strong>6. Назови 3 фреймворка для агентов.</strong><br>
LangChain/LangGraph, AutoGen, Pydantic AI, CrewAI, LlamaIndex — любые из них.</p>

<p><strong>7. Что значит «sandbox» в контексте агентов?</strong><br>
Изолированная среда (Docker, VM), где агент может ошибаться без последствий для системы пользователя.</p>

<p><strong>8. Когда нужен HITL?</strong><br>
На критичных шагах: трата денег, удаление, отправка во внешние системы, изменения с большим радиусом действия.</p>

<p><strong>9. Сколько шагов идеально в одной агентской сессии?</strong><br>
Чем меньше, тем надёжнее. Если задача требует много шагов — лучше декомпозировать на несколько отдельных сессий с явной координацией.</p>

<p><strong>10. Какой фреймворк я выберу для своего первого агента?</strong><br>
Прямой Anthropic SDK + Pydantic AI или LangChain (на выбор). Начинай простым — добавляй сложность по необходимости.</p>

<h2>12. Что должно остаться в голове</h2>
<ol>
<li><strong>Агент = LLM + tools + цикл + цель.</strong> Запомни эту формулу.</li>
<li><strong>ReAct (Thought → Action → Observation)</strong> — основа почти всех агентов.</li>
<li><strong>Не каждая задача требует агента.</strong> Часто хватает RAG или function calling.</li>
<li><strong>Агенты дороже, медленнее, менее надёжны</strong> чем простые вызовы.</li>
<li><strong>Sandbox + HITL</strong> для production-агентов.</li>
<li><strong>Чем меньше шагов в сессии, тем выше надёжность.</strong></li>

<h1>Claude Artifacts — генерация кода и UI прямо в чате</h1>

<p>Это меняет UX работы с моделью: вместо «получил текст → скопировал → вставил в редактор → запустил» — ты видишь работающий результат прямо в чате и итерируешь по нему. Для не-программистов это часто <strong>единственный способ</strong> получить рабочий код, не имея среды разработки.</p>

<h2>1. Что такое Artifacts</h2>

<p>Artifact — это любой <strong>самодостаточный кусок контента</strong>, который удобнее показать в отдельной панели, а не в потоке чата:</p>
<ul>
<li>Код длиннее ~15 строк (Python, JS, TS, любой язык).</li>
<li>HTML/CSS/JS, который можно сразу запустить в превью.</li>
<li>React-компоненты — рендерятся вживую.</li>
<li>SVG-графики и диаграммы.</li>
<li>Markdown-документы.</li>
<li>Mermaid-схемы.</li>
</ul>

<p>Когда Claude видит, что ответ подходит под Artifact — он автоматически выносит его в правую панель. У тебя появляется:</p>
<ul>
<li>Текст ответа в чате слева.</li>
<li>Артефакт справа с превью + кодом.</li>
<li>Кнопки: Copy, Download, Publish, Remix.</li>
</ul>

<h2>2. Как включить Artifacts</h2>

<p>В claude.ai:</p>
<ol>
<li>Profile (нижний левый угол) → Settings.</li>
<li>Feature Preview → включи <strong>Artifacts</strong>.</li>
</ol>

<p>В Claude Projects (доступно на Pro/Team) — включается автоматически.</p>

<p>В API: ничего отдельного не нужно. Claude сам решает в зависимости от ответа. Но в API артефакты возвращаются как обычный текст — UI рендеринг есть только в claude.ai.</p>

<h2>3. Триггеры — когда Claude создаёт Artifact</h2>

<p>Claude автоматически создаёт артефакт когда:</p>
<ul>
<li>Просишь написать код длиннее ~15 строк.</li>
<li>Просишь HTML-страницу или React-компонент.</li>

<li>Просишь схему, диаграмму, SVG.</li>
<li>Контент будут переиспользовать или модифицировать.</li>

<p>Не создаёт когда:</p>

<li>Объяснения, ответы на вопросы.</li>

</ul>

<p>Можно явно попросить: «Сделай это как Artifact» или «Не делай Artifact, ответь в чате».</p>

<h3>HTML — работает прямо в превью</h3>
<p>Запрос: «Сделай интерактивный калькулятор ипотеки на чистом HTML/JS. Показывает график погашения. Один файл».</p>
<p>В правой панели появится <strong>живой рабочий калькулятор</strong>, в который можно вводить значения. Внизу — кнопка View Code, чтобы посмотреть исходник.</p>

<h3>React-компонент</h3>
<p>Запрос: «React-компонент: список задач с приоритетами, drag-and-drop, сохранение в localStorage».</p>
<p>Получаешь работающий компонент с Tailwind-стилями. Можно использовать в своём проекте — Claude использует компоненты из shadcn/ui, lucide-react, recharts.</p>

<h3>Mermaid-диаграмма</h3>
<p>Запрос: «Нарисуй mermaid-схему процесса от заявки клиента до оплаты в нашей CRM».</p>
<p>Получаешь рендеренную диаграмму + исходник.</p>

<h3>Markdown-документ</h3>
<p>Запрос: «Напиши спецификацию API для сервиса бронирования в формате OpenAPI».</p>
<p>Получаешь полный markdown-документ с разделами, который можно скачать.</p>

<h3>SVG</h3>
<p>Запрос: «SVG-логотип для кофейни. Минималистичный, чашка с паром, моно-цвет».</p>
<p>Получаешь готовый SVG, который рендерится в превью.</p>

<h2>5. Итерация по Artifact</h2>

<p>Главная сила — Claude помнит текущий артефакт и может его <strong>итеративно дорабатывать</strong>. Вместо переписывания целиком, он применяет частичные изменения.</p>

<p><strong>Пример сессии:</strong></p>
<pre><code>Ты: «Сделай React-компонент карточки товара с фото, ценой, кнопкой Купить»
Claude: [создаёт Artifact с базовым компонентом]

Ты: «Добавь скидку — показывать старую цену зачёркнутой и процент скидки»
Claude: [обновляет тот же Artifact, не создавая нового]

Claude: [снова обновляет]

Ты: «А теперь добавь анимацию при наведении»
Claude: [снова обновляет]</code></pre>

<p>В правой панели появляется <strong>версионирование</strong> — можешь переключаться между версиями стрелками.</p>

<h2>6. Publish и Remix</h2>

<p><strong>Publish</strong> — превратить артефакт в публичную ссылку. Любой может открыть и использовать. Полезно для:</p>

<li>Опубликовать live-демо мини-инструмента.</li>
<li>Создать публичную страничку с инфографикой.</li>

<p>Ссылка вида <code>claude.site/artifacts/xxx</code>.</p>

<p><strong>Remix</strong> — взять чужой опубликованный артефакт и продолжить итерации в своём чате. Это относительно новая возможность: фактически появляется экосистема «AI-приложений в один клик».</p>

<h2>7. Лимиты и подводные камни</h2>

<h3>Что Artifacts не умеет</h3>
<ul>
<li><strong>Backend.</strong> Только клиентский код — HTML, JS, React. Нельзя поднять Express-сервер.</li>
<li><strong>Внешние API.</strong> Из артефакта нельзя дёргать сторонние API (CORS, безопасность). Можно только статичные данные.</li>

<li><strong>Большие зависимости.</strong> Доступны: Tailwind, shadcn/ui, lucide-react, recharts, mathjs, lodash, d3, plotly, three.js, papaparse, sheetjs, mammoth, tone, tensorflow. Но не любые npm-пакеты.</li>

<h2>9. Почему именно Claude, а не ChatGPT</h2>

<p>У ChatGPT есть Canvas — концептуально похоже, но:</p>
<ul>
<li>Artifacts появились раньше и более зрелые.</li>

<li>Publish/Remix — уникальная фича Claude.</li>

<h1>Claude Projects — память и контекст для задач</h1>

<div class="lesson-meta">
  <span><strong>Цель:</strong> понять, когда Projects лучше обычного чата и как их грамотно использовать</span>
  <span><strong>Время:</strong> ~35 минут</span>

<p>Если ты замечал, что объясняешь Claude одно и то же в каждом новом чате, делишься одним и тем же фоном — Projects решают эту боль. Это <strong>контейнеры</strong> для связанных диалогов с общим контекстом, инструкциями и файлами.</p>
<p>Простой пример: у тебя есть pet-проект. Каждый раз когда обращаешься к Claude по нему — приходится напоминать про стек, бизнес-логику, текущий этап. С Project всё это лежит в общей «памяти», и любой новый чат начинается с уже актуальным контекстом.</p>

<h2>1. Что такое Project</h2>

<p>Project в Claude — это:</p>
<ul>
<li><strong>Папка для чатов</strong> по одной теме / задаче / клиенту.</li>
<li><strong>Project knowledge</strong> — файлы и тексты, которые Claude видит во всех чатах внутри.</li>
<li><strong>Custom instructions</strong> — постоянный system prompt для всех чатов.</li>
<li><strong>Активность</strong> — все диалоги и артефакты в одном месте.</li>

<h2>2. Когда стоит использовать Project</h2>

<h3>✅ Хорошо</h3>
<ul>
<li><strong>Долгосрочные проекты</strong> — pet-project, рабочая инициатива, диссертация.</li>
<li><strong>Работа с клиентом / компанией</strong> — где есть постоянная фоновая инфа.</li>
<li><strong>Изучение темы</strong> — например, «Изучаю Rust» — складываешь туда заметки, ссылки.</li>
<li><strong>Творческие проекты</strong> — роман, сериал, дизайн-система.</li>
<li><strong>Регулярные операции</strong> — еженедельные отчёты, планирование, ретро.</li>

<ul>
<li>Разовые вопросы.</li>
<li>«Объясни что такое X» — обычный чат справится.</li>
<li>Кодинг-задачи без общего контекста.</li>

<h2>3. Создание Project — пошагово</h2>

<ol>
<li>В claude.ai нажми <strong>Projects</strong> в левой панели.</li>
<li><strong>Create Project.</strong></li>
<li>Имя — конкретное и понятное: «Курс по ИИ — контент» лучше чем «Учёба».</li>
<li>Description — необязательно, но помогает.</li>

<h2>4. Custom Instructions — главный инструмент</h2>

<p>Это system prompt уровня всего проекта. Сюда кладём:</p>

<li><strong>Что в knowledge:</strong> явно опиши, какие файлы загружены и зачем.</li>
</ul>

<h3>Пример сильного Custom Instructions</h3>
<pre><code>Контекст: Я Руслан, делаю курс по ИИ на русском, цель — стать
"тем, к кому ходят за объяснением ИИ для русскоязычных".

Роль: Ты мой соавтор и редактор курса. Думай как опытный
методист и продакт-менеджер.

Стиль:
- Прямо, без воды.
- Когда сомневаешься — задавай уточняющие вопросы.
- Не льсти, не соглашайся ради согласия.
- Если у меня плохая идея — скажи прямо и предложи лучше.

В knowledge:
- progress.md — мой журнал и планы по курсу.
- structure.md — структура 95 уроков.
- lesson-template.md — шаблон формата урока.
- audience.md — описание целевой аудитории.

Не используй: маркетинговые клише, "решение", "инновационный",
"уникальный", эмодзи в формальных текстах.</code></pre>

<h2>5. Project Knowledge — что и как загружать</h2>

<h3>Форматы</h3>
<ul>
<li>PDF, DOCX, TXT, MD — естественно.</li>
<li>CSV, JSON — данные.</li>
<li>Код любых языков.</li>
<li>Изображения с текстом (Claude умеет OCR).</li>
</ul>

<h3>Лимиты</h3>
<ul>
<li>До 200 KB на один файл текста (для PDF — больше).</li>
<li>Общий объём всех файлов в проекте — порядка 200k токенов.</li>
<li>Внутри одного чата — обычное контекстное окно (200k токенов).</li>
</ul>

<h3>Что класть, что не класть</h3>
<p><strong>Класть:</strong></p>
<ul>
<li>Стабильные референсы — то что не меняется (структуры, спецификации, гайды стиля).</li>
<li>Документы, на которые часто ссылаешься.</li>
<li>Свои промпт-шаблоны.</li>
<li>Примеры твоего стиля — Claude по ним подстроится.</li>
</ul>
<p><strong>Не класть:</strong></p>
<ul>
<li>Огромные папки кода — лучше точечно нужные файлы.</li>
<li>Часто меняющиеся данные — устареют.</li>
<li>Конфиденциальные данные, если Pro а не Enterprise (см. секцию 8).</li>
</ul>

<h2>6. Workflow: как работать в Project</h2>

<p>Лучшая практика — <strong>один Project = один долгосрочный контекст</strong>. Внутри:</p>
<ul>
<li>Каждый отдельный thread — конкретная задача.</li>
<li>Не пихай 50 разных задач в один thread — лучше создать новые.</li>
<li>Пользуйся поиском по чатам внутри проекта (Cmd+K).</li>
</ul>

<h3>Пример моего Workflow</h3>
<p>Я (Claude в роли соавтора курса) могу описать так:</p>
<ol>
<li>Project «Курс по ИИ» с custom instructions из секции 4 и файлами курса в knowledge.</li>
<li>Thread «Урок 9: генерация картинок» — пишу его.</li>
<li>Thread «Структура Фазы 2» — обсуждаю порядок.</li>
<li>Thread «Идеи для Фазы 4» — складываю.</li>
<li>Thread «Планирование на неделю» — каждый понедельник новый.</li>
</ol>
<p>Через месяц у меня история всех решений по курсу. Возвращаюсь — и не нужно объяснять контекст.</p>

<h2>7. Топ-3 неправильных применения</h2>

<h3>❌ «Один Project на всё»</h3>
<p>Создал «AI Helper» и пихаешь туда всё подряд. Knowledge превращается в свалку. Custom instructions расплывчатые. Не работает.</p>

<h3>❌ Дамп всей кодовой базы в Knowledge</h3>
<p>Зарузил 5 МБ кода → токены закончились на каждом запросе → ответы поверхностные. Лучше: точечно нужные файлы под текущую задачу через chat-attach.</p>

<h3>❌ Custom instructions из 5 строк</h3>
<p>«Будь полезным помощником» — это не custom instructions, это шум. Сильные instructions — 30+ строк со специфичной информацией.</p>

<h2>8. Приватность — важно</h2>

<h3>Pro</h3>
<p>Knowledge файлы хранятся у Anthropic. По умолчанию <strong>НЕ используются для обучения модели</strong> (это политика Anthropic с 2024). Удалить файл — он удалится из их хранилища тоже (но логи могут жить ещё месяц).</p>

<h3>Team / Enterprise</h3>
<p>Дополнительно — DPA, BAA для медицины, SOC 2, контроль над регионом хранения.</p>

<h3>Что не клади даже на Pro</h3>
<ul>
<li>Полные персональные данные клиентов с реальными именами.</li>
<li>Закрытые контракты с реальными условиями.</li>
<li>Финансовые данные до публикации.</li>
<li>Не-анонсированные продуктовые планы.</li>
</ul>
<p>Решение: anonymize. Замени имена на роли, цифры на формулы.</p>

<h2>9. Прокачка через примеры</h2>

<h3>Пример A: Project для разработчика</h3>
<ul>
<li>Имя: «my-saas-backend».</li>
<li>Knowledge: README, архитектурный документ, OpenAPI spec, ключевые модели данных.</li>
<li>Custom instructions: технический стек, naming conventions, что не использовать (старые паттерны).</li>
</ul>

<h3>Пример B: Project для писателя</h3>
<ul>
<li>Имя: «Роман — Падение империи».</li>
<li>Knowledge: персонажи (имена, бэкграунд), мир (география, история), стиль (примеры предыдущих глав).</li>
<li>Custom instructions: жанр, тон, что не уместно.</li>
</ul>

<h3>Пример C: Project для маркетолога</h3>
<ul>
<li>Имя: «B2B SaaS — лидген».</li>
<li>Knowledge: бренд-гайд, ICP, кейсы, прошлые рассылки.</li>
<li>Custom instructions: тон бренда, запрещённые слова, формат.</li>
</ul>

<h2>10. Практика (30 минут)</h2>

<h3>Упражнение 1. Создай Project</h3>
<ol>
<li>Реши: какой у тебя долгосрочный проект сейчас (работа над сайтом, обучение языку, ведение блога).</li>
<li>Создай Project в claude.ai.</li>
<li>Загрузи в Knowledge: 2–3 базовых файла (можно создать прямо в Markdown за 10 минут).</li>
<li>Напиши Custom Instructions хотя бы на 20 строк по структуре из секции 4.</li>
</ol>

<h3>Упражнение 2. Сравни</h3>
<p>Задай <strong>один и тот же</strong> сложный вопрос:</p>
<ul>
<li>В обычном чате (нужно объяснять контекст).</li>
<li>В созданном Project.</li>
</ul>
<p>Сравни качество и время ответа.</p>

<h2>11. Проверь себя</h2>

<p><strong>1. Чем Project отличается от обычного чата?</strong><br>
Project — контейнер для связанных чатов с общим Knowledge (файлы) и Custom Instructions (system prompt). Обычный чат — изолированная сессия.</p>

<p><strong>2. На каком тарифе доступны Projects?</strong><br>
Pro ($20/мес), Team, Enterprise. На бесплатном — нет.</p>

<p><strong>3. Что класть в Custom Instructions?</strong><br>
Контекст (кто я, цель), роль Claude, стиль общения, что в Knowledge, что не использовать. Минимум 20+ строк для эффекта.</p>

<p><strong>4. Сколько занимают файлы Knowledge?</strong><br>
До 200 КБ на файл текста, общий объём в районе 200к токенов.</p>

<p><strong>5. Главный антипаттерн использования Projects?</strong><br>
Один Project на всё — превращается в свалку. Лучше много специализированных.</p>

<h1>MCP — Model Context Protocol</h1>

<div class="lesson-meta">
  <span><strong>Цель:</strong> понять, что такое MCP и зачем он меняет правила игры с агентами</span>
  <span><strong>Время:</strong> ~50 минут</span>
  <span><strong>Источник:</strong> modelcontextprotocol.io, anthropic.com/news</span>
</div>

<h2>Зачем тебе этот урок</h2>
<p>В ноябре 2024 Anthropic анонсировал <strong>MCP — Model Context Protocol</strong>, и за полгода он стал чем-то вроде «USB-C для ИИ». Ты подключил MCP-сервер один раз — и любой ИИ-клиент с поддержкой MCP получает к нему доступ. Никаких отдельных интеграций для каждого агента.</p>
<p>Если раньше каждое ИИ-приложение строило свои конкреткные коннекторы (агент к Slack, агент к Notion, агент к БД — разные коды), то с MCP интеграция пишется один раз. Это резко снижает порог входа и создаёт экосистему.</p>
<p>Сегодня MCP поддерживают: Claude Desktop, Cursor, Windsurf, Cline, Zed, Continue, и десятки других. Ты сейчас на 100% точно столкнёшься с MCP в работе с агентами в ближайший год.</p>

<h2>1. Что такое MCP в одном предложении</h2>

<blockquote><strong>MCP — это открытый протокол, который стандартизирует, как ИИ-приложения подключаются к внешним источникам данных и инструментам.</strong></blockquote>

<p>Аналогия:</p>
<ul>
<li><strong>До USB:</strong> у каждого устройства свой разъём. Принтер ↔ компьютер — свой кабель. Клавиатура — свой. Хочешь новое устройство — новый адаптер.</li>
<li><strong>После USB:</strong> один разъём. Любое устройство, любой компьютер.</li>
</ul>
<p>В мире ИИ-агентов:</p>
<ul>
<li><strong>До MCP:</strong> каждый агент имел свои самописные интеграции. Для Slack — одни. Для Postgres — другие. Для GitHub — третьи.</li>
<li><strong>После MCP:</strong> один протокол. Любой клиент (Claude Desktop, Cursor, ваше приложение) → любой сервер (Slack, Postgres, GitHub).</li>
</ul>

<h2>2. Архитектура: серверы и клиенты</h2>

<p>В MCP две роли.</p>

<h3>MCP-сервер</h3>
<p>Программа, которая <strong>что-то умеет делать</strong> и предоставляет это через MCP. Например:</p>
<ul>
<li>Сервер файловой системы — позволяет читать/писать файлы.</li>
<li>Сервер GitHub — даёт доступ к репозиториям, issue, PR.</li>
<li>Сервер Postgres — выполняет SQL запросы.</li>
<li>Сервер Slack — отправляет сообщения, читает каналы.</li>
<li>Сервер Brave Search — веб-поиск.</li>
<li>Свой кастомный сервер — что угодно.</li>
</ul>
<p>Серверы запускаются как отдельные процессы (или как HTTP-сервисы) и говорят с клиентом через JSON-RPC.</p>

<h3>MCP-клиент</h3>
<p>Это ИИ-приложение, которое подключает серверы и даёт их LLM как доступные инструменты. Примеры клиентов:</p>
<ul>
<li><strong>Claude Desktop</strong> — приложение Anthropic, поддерживает MCP из коробки.</li>
<li><strong>Cursor / Windsurf</strong> — IDE с ИИ.</li>
<li><strong>Continue, Cline, Zed</strong> — другие IDE-плагины.</li>
<li><strong>Своё приложение</strong> на Anthropic SDK с MCP-библиотекой.</li>
</ul>

<h3>Как они общаются</h3>
<pre><code>┌─────────────┐  JSON-RPC   ┌─────────────┐
│   Клиент    │ ←─────────→ │   Сервер    │
│  (Claude    │             │  (filesystem│
│   Desktop)  │             │  / GitHub / │
│             │             │   etc)      │
└─────────────┘             └─────────────┘
       ↑
       │ запросы пользователя
       │
┌─────────────┐
│ Пользователь│
└─────────────┘</code></pre>

<p>Транспорты:</p>
<ul>
<li><strong>stdio</strong> — сервер запускается как локальный процесс, общение через stdin/stdout. Самый частый вариант.</li>
<li><strong>HTTP+SSE</strong> — для удалённых серверов.</li>
</ul>

<h2>3. Что MCP-сервер может предоставлять</h2>

<p>Три вида «способностей»:</p>

<h3>Tools (инструменты)</h3>
<p>Похоже на function calling в обычной LLM API. Сервер объявляет: «у меня есть функция <code>create_issue(repo, title, body)</code>». Клиент даёт LLM возможность её вызвать. Когда LLM решает — вызов идёт к серверу, тот выполняет, возвращает результат.</p>
<p>Примеры:</p>
<ul>
<li><code>read_file(path)</code> — читает файл.</li>
<li><code>execute_sql(query)</code> — выполняет SQL.</li>
<li><code>send_slack_message(channel, text)</code> — пишет в Slack.</li>
</ul>

<h3>Resources (ресурсы)</h3>
<p>Read-only данные, на которые LLM может ссылаться. Например:</p>
<ul>
<li>Содержимое файла как ресурс.</li>
<li>Snapshot базы данных.</li>
<li>Лог недавних событий.</li>
</ul>
<p>Отличие от tools: tools — это <em>действия</em>, resources — <em>данные</em>.</p>

<h3>Prompts (промпты-шаблоны)</h3>
<p>Сервер может предоставлять готовые шаблоны промптов, которые пользователь явно вызывает. Пример: GitHub-сервер даёт промпт «summarize_pr» — прокручивает весь PR и просит модель сделать summary.</p>
<p>На практике prompts используются меньше, чем tools и resources.</p>

<h2>7. Свой MCP-сервер за 30 минут</h2>

<p>Anthropic предоставляет SDK для TypeScript и Python. Соберём минимальный сервер, который возвращает погоду (можно подменить на любую другую логику).</p>

<p>Файл <code>weather-server.ts</code>:</p>

<pre><code>import { Server } from "@modelcontextprotocol/sdk/server/index.js";
import { StdioServerTransport } from "@modelcontextprotocol/sdk/server/stdio.js";
import {
  CallToolRequestSchema,
  ListToolsRequestSchema,
} from "@modelcontextprotocol/sdk/types.js";

const server = new Server(
  { name: "weather-server", version: "1.0.0" },
  { capabilities: { tools: {} } }
);

// Описание доступных tools
server.setRequestHandler(ListToolsRequestSchema, async () => ({
  tools: [{
    name: "get_weather",
    description: "Получить текущую погоду в городе",
    inputSchema: {
      type: "object",
      properties: {
        city: { type: "string", description: "Название города" }
      },
      required: ["city"]
    }
  }]
}));

// Обработка вызовов
server.setRequestHandler(CallToolRequestSchema, async (request) => {
  if (request.params.name === "get_weather") {
    const city = request.params.arguments?.city as string;
    // тут была бы реальная API-погода
    const fakeData = { city, temp: 18, condition: "облачно" };
    return {
      content: [{
        type: "text",
        text: \`В городе \${city}: \${fakeData.temp}°C, \${fakeData.condition}\`
      }]
    };
  }
  throw new Error("Unknown tool");
});

const transport = new StdioServerTransport();
await server.connect(transport);
console.error("Weather server running on stdio");</code></pre>

        "description": "Получить погоду",
        "inputSchema": {
            "type": "object",
            "properties": {"city": {"type": "string"}},
            "required": ["city"]
        }
    }]

@server.call_tool()
async def call_tool(name, arguments):
    if name == "get_weather":
        return [{"type": "text", "text": f"В {arguments['city']}: +18°C, облачно"}]

async def main():
    async with stdio_server() as (read, write):
        await server.run(read, write, server.create_initialization_options())

asyncio.run(main())</code></pre>

<h2>8. MCP vs Function Calling — в чём разница</h2>

<p>На первый взгляд MCP похож на function calling из Урока 13. Но есть существенные отличия.</p>

<table>
<tr><th>Аспект</th><th>Function Calling</th><th>MCP</th></tr>
<tr><td>Где определены функции</td><td>В коде твоего приложения</td><td>В отдельном MCP-сервере</td></tr>
<tr><td>Переиспользование</td><td>Нужно копировать код в каждое приложение</td><td>Один сервер — много клиентов</td></tr>
<tr><td>Стандартизация</td><td>Каждый делает по-своему</td><td>Единый протокол</td></tr>
<tr><td>Изоляция</td><td>Функции в том же процессе что и LLM-логика</td><td>Сервер — отдельный процесс с правами</td></tr>
<tr><td>Динамическая загрузка</td><td>Нужно перезапускать приложение</td><td>Можно подключать/отключать без рестарта</td></tr>
<tr><td>Безопасность</td><td>Полагается на код приложения</td><td>Sandbox-исполнение в отдельном процессе</td></tr>
</table>

<p>Function calling — для случаев «у меня одно приложение, я контролирую всё». MCP — когда «я хочу подключить много инструментов многим клиентам».</p>

<h2>9. Тонкости и подводные камни</h2>

<h3>Безопасность</h3>
<p>MCP-серверы могут читать твой диск, дёргать API, отправлять сообщения. Все они работают <strong>с правами твоего пользователя</strong> и видят твои секреты в env. Подключай только серверы, которым доверяешь.</p>
<p>Для filesystem-сервера — указывай конкретные папки, не корень. Для github — давай токен с минимальными правами.</p>

<h3>Производительность</h3>
<p>Каждый MCP-сервер запускается в отдельном процессе (для stdio). При старте Claude Desktop запускает их все. Если у тебя 10 серверов — 10 процессов в фоне.</p>

<h3>Дебаггинг</h3>
<p>Если сервер падает — Claude Desktop напишет в логе «Failed to connect to <name>». Логи на Mac:</p>
<pre><code>~/Library/Logs/Claude/mcp.log
~/Library/Logs/Claude/mcp-server-XXX.log</code></pre>

<h3>Версионирование</h3>
<p>Серверы развиваются. Если обновился MCP-протокол, старый сервер может не работать. Пинай версию: <code>@modelcontextprotocol/server-filesystem@latest</code>.</p>

<h3>Не все клиенты одинаково умеют</h3>
<ul>
<li>Claude Desktop — полная поддержка tools, resources, prompts.</li>
<li>Cursor — поддерживает tools, resources частично.</li>
<li>Continue — постепенно догоняет.</li>
</ul>

<h2>10. Глоссарий</h2>
<ul>
<li><strong>MCP (Model Context Protocol)</strong> — открытый протокол Anthropic для подключения LLM к данным/инструментам.</li>
<li><strong>MCP-сервер</strong> — программа, предоставляющая tools/resources через MCP.</li>
<li><strong>MCP-клиент</strong> — приложение, использующее MCP-серверы.</li>
<li><strong>Tools</strong> — функции, которые LLM может вызывать через сервер.</li>
<li><strong>Resources</strong> — read-only данные с сервера.</li>
<li><strong>Prompts</strong> — шаблоны промптов от сервера.</li>
<li><strong>JSON-RPC</strong> — формат сообщений между клиентом и сервером.</li>
<li><strong>stdio transport</strong> — сервер как локальный процесс, общение через stdin/stdout.</li>
<li><strong>SSE transport</strong> — Server-Sent Events для удалённых серверов.</li>
<li><strong>Capabilities</strong> — что сервер умеет (tools / resources / prompts).</li>
</ul>

<h2>11. Практика (60 минут)</h2>

<h3>Упражнение 1. Filesystem-сервер (15 минут)</h3>
<ol>
<li>Установи Claude Desktop.</li>
<li>Открой <code>claude_desktop_config.json</code>, добавь filesystem-сервер с путём к одной из своих папок.</li>
<li>Перезапусти Claude Desktop.</li>
<li>Кликни на иконку 🔨 в чате — увидишь список tools (read_file, list_files, write_file и др.).</li>

</ol>

<h3>Упражнение 2. GitHub-сервер (15 минут)</h3>
<ol>
<li>На GitHub: Settings → Developer Settings → Personal Access Tokens → создай токен с правом <code>repo</code>.</li>
<li>Добавь github-сервер в конфиг с этим токеном.</li>
<li>Перезапусти Claude Desktop.</li>
<li>Попроси: «покажи мои последние 5 issue в репо <code>X</code>», «создай issue про баг Y».</li>
</ol>

<h3>Упражнение 3. Memory-сервер (15 минут)</h3>
<ol>
<li>Добавь memory-сервер в конфиг.</li>

</ol>

<h3>Упражнение 4. Свой сервер (30 минут — для разработчиков)</h3>
<ol>

<li>Подключи к Claude Desktop.</li>
<li>Используй в чате.</li>
</ol>

<h2>12. Проверь себя</h2>

<p><strong>1. MCP в одном предложении?</strong><br>
Открытый протокол для подключения ИИ-приложений к внешним данным и инструментам стандартным способом.</p>

<p><strong>2. Кто такие сервер и клиент в MCP?</strong><br>
Сервер — программа, предоставляющая tools/resources. Клиент — ИИ-приложение, использующее их (Claude Desktop, Cursor).</p>

<p><strong>3. Tools vs resources?</strong><br>
Tools — действия (функции, которые LLM может вызвать). Resources — read-only данные.</p>

<p><strong>4. Как добавить сервер в Claude Desktop?</strong><br>
Отредактировать <code>claude_desktop_config.json</code>, добавить запись в <code>mcpServers</code>, перезапустить Claude Desktop.</p>

<p><strong>5. Чем MCP лучше function calling?</strong><br>
Один сервер — много клиентов. Стандартизация. Изоляция в отдельном процессе. Безопасность через sandbox.</p>

<p><strong>6. Главные риски безопасности?</strong><br>
Серверы работают с правами пользователя. Подключай только доверенные. Минимизируй scope (конкретные папки, токены с минимальными правами).</p>

<p><strong>7. Какой transport использовать?</strong><br>
stdio — для локальных серверов (90% случаев). SSE — для удалённых.</p>

<p><strong>8. Где смотреть логи если сервер упал?</strong><br>
Mac: <code>~/Library/Logs/Claude/mcp.log</code> и <code>mcp-server-XXX.log</code>.</p>

<p><strong>9. Как написать свой сервер?</strong><br>
TypeScript SDK <code>@modelcontextprotocol/sdk</code> или Python <code>mcp</code>. Объявить tools через <code>ListToolsRequestSchema</code>, обрабатывать вызовы через <code>CallToolRequestSchema</code>.</p>

<p><strong>10. Где найти готовые серверы?</strong><br>
<a href="https://github.com/modelcontextprotocol/servers" target="_blank">github.com/modelcontextprotocol/servers</a> (официальные) и <a href="https://www.pulsemcp.com" target="_blank">pulsemcp.com</a> (community-каталог 1000+ серверов).</p>

<h2>13. Что должно остаться в голове</h2>
<ol>
<li><strong>MCP — это «USB-C для ИИ»</strong>: один протокол → много клиентов и серверов.</li>
<li><strong>Сервер</strong> = программа с tools/resources. <strong>Клиент</strong> = ИИ-приложение.</li>
<li><strong>Claude Desktop</strong> поддерживает MCP из коробки — самый простой вход.</li>
<li><strong>Каталог серверов</strong>: filesystem, github, postgres, slack, memory, brave-search и сотни других.</li>
<li><strong>Свой сервер пишется за 30 минут</strong> на TS/Python.</li>
<li><strong>Безопасность критична</strong>: серверы работают с правами пользователя.</li>
<li><strong>MCP — это будущее</strong> агентских инструментов; в 2026 это станет стандартом для ИИ-IDE и десктоп-агентов.</li>
</ol>

<div class="callout callout-info">
<strong>📌 Закрепление:</strong> подключи Claude Desktop хотя бы к filesystem-серверу до перехода к следующему уроку. Без этого механика MCP останется абстрактной.
</div>

<pre><code># Псевдокод

<li><strong>Human-in-the-loop</strong> для критичных шагов: «прежде чем нажать "Отправить" — спроси меня».</li>

registerLesson("c6", `
<h1>Prompt Caching — экономим 90% на длинных контекстах</h1>

<div class="lesson-meta">
  <span><strong>Цель:</strong> освоить prompt caching Anthropic для серьёзной экономии денег</span>
  <span><strong>Время:</strong> ~35 минут</span>
  <span><strong>Источник:</strong> docs.claude.com/build-with-claude/prompt-caching</span>
</div>

<h2>Зачем тебе этот урок</h2>
<p>У тебя приложение, где в каждом запросе один и тот же system prompt на 5000 токенов с инструкциями? Каждый вызов ты платишь за эти 5000 токенов заново. На сотне вызовов в день — это уже заметные деньги. На тысячах — критично.</p>
<p><strong>Prompt caching</strong> — фича Anthropic, которая позволяет закэшировать стабильную часть промпта и при следующих вызовах платить за неё <strong>в 10 раз меньше</strong>. Это самая недооценённая оптимизация в работе с LLM.</p>

<h2>1. Как работает</h2>

<p>Без кэширования (обычный поток):</p>
<pre><code>Запрос 1: [system prompt 5000т] + [user "вопрос 1" 50т]
  → input: 5050 × $3/M = $0.0152

Запрос 2: [system prompt 5000т] + [user "вопрос 2" 50т]
  → input: 5050 × $3/M = $0.0152
  (платим за system prompt снова и снова)</code></pre>

<p>С кэшированием:</p>
<pre><code>Запрос 1: [system prompt CACHED 5000т] + [user 50т]
  → cache write: 5000 × $3.75/M = $0.01875 (+25%)
  → input: 50 × $3/M = $0.00015
  = $0.019 (чуть дороже)

Запрос 2: [system prompt CACHED 5000т] + [user 50т]
  → cache read: 5000 × $0.30/M = $0.0015 (10% от обычной цены!)
  → input: 50 × $3/M = $0.00015
  = $0.00165 (в 9 раз дешевле)</code></pre>

<p>Чем больше повторов — тем больше экономия. После 10 запросов экономия ~85%. После 100 — ~89%.</p>

<h2>2. Когда выгодно использовать</h2>

<h3>Выгодно</h3>
<ul>
<li>Длинный <strong>system prompt</strong> с инструкциями — повторяется в каждом запросе</li>
<li>Большой <strong>контекст документов</strong> (например, в RAG над одной книгой) — много вопросов к одной книге</li>
<li>Few-shot примеры — много, на каждый запрос подмешиваются</li>
<li>Длинный диалог — закэшировать всю историю до текущего хода</li>
</ul>

<h3>Невыгодно</h3>
<ul>
<li>Очень короткие промпты — кэш не покрывает overhead</li>
<li>Каждый запрос с новыми данными — нечего кэшировать</li>
<li>Один запрос — не повторишь, не сэкономишь</li>
</ul>

<p>Минимальный размер для кэширования: <strong>1024 токена</strong> (для Sonnet/Opus) или <strong>2048</strong> (для Haiku).</p>

<h2>3. Цены: запись vs чтение</h2>

<table>
<tr><th>Операция</th><th>Sonnet 4.5</th><th>Opus 4</th><th>Haiku</th></tr>
<tr><td>Обычный input</td><td>$3.00/M</td><td>$15.00/M</td><td>$0.80/M</td></tr>
<tr><td>Cache <strong>write</strong> (+25%)</td><td>$3.75/M</td><td>$18.75/M</td><td>$1.00/M</td></tr>
<tr><td>Cache <strong>read</strong> (-90%)</td><td>$0.30/M</td><td>$1.50/M</td><td>$0.08/M</td></tr>
</table>

<p><strong>Cache write</strong> чуть дороже обычного input (+25%). <strong>Cache read</strong> — в 10 раз дешевле. Поэтому кэш окупается уже на 2-м запросе.</p>

<h2>4. Время жизни кэша</h2>

<p>Два режима:</p>
<ul>
<li><strong>5 минут</strong> (по умолчанию) — без доплаты</li>
<li><strong>1 час</strong> (extended cache, beta) — двойная цена за cache write, но всё ещё дешевле обычной</li>
</ul>

<p>5 минут — для интерактивных сессий (чат, диалог). 1 час — для batch-обработки, когда несколько запросов с большой паузой.</p>

<p>Кэш можно «дёргать» — каждый раз когда читаешь из него, таймер обнуляется на новые 5 минут (или 1 час).</p>

<h2>5. Как использовать в API</h2>

<p>Простой пример с Python SDK:</p>

<pre><code>from anthropic import Anthropic

client = Anthropic()

system_prompt = "..." * 5000  # длинный, стабильный

response = client.messages.create(
    model="claude-sonnet-4-5",
    max_tokens=1024,
    system=[
        {
            "type": "text",
            "text": system_prompt,
            "cache_control": {"type": "ephemeral"}  # ← вот так
        }
    ],
    messages=[
        {"role": "user", "content": "Вопрос пользователя"}
    ]
)

# Проверим использование кэша
print(response.usage)
# CacheCreationInputTokens: 5000 (на первом запросе)
# CacheReadInputTokens: 0
# InputTokens: 8 (всё остальное)</code></pre>

<p>На втором вызове <strong>с тем же system prompt</strong>:</p>

<pre><code>print(response.usage)
# CacheCreationInputTokens: 0
# CacheReadInputTokens: 5000  ← из кэша
# InputTokens: 8</code></pre>

<h2>6. Multi-level caching</h2>

<p>Можно кэшировать сразу несколько частей промпта. Anthropic поддерживает <strong>до 4 cache breakpoint'ов</strong> в одном запросе.</p>

<p>Пример с тремя уровнями:</p>

<pre><code>messages.create(
    system=[
        {"type": "text", "text": "Базовые инструкции",
         "cache_control": {"type": "ephemeral"}}     # уровень 1: стабильный
    ],
    messages=[
        {"role": "user", "content": [
            {"type": "text", "text": "Большой документ X...",
             "cache_control": {"type": "ephemeral"}}  # уровень 2: документ
        ]},
        {"role": "assistant", "content": "..."},
        {"role": "user", "content": [
            {"type": "text", "text": "История разговора...",
             "cache_control": {"type": "ephemeral"}}  # уровень 3: история
        ]},
        {"role": "user", "content": "Новый вопрос пользователя"}  # без кэша
    ]
)</code></pre>

<p>Каждый уровень кэшируется независимо. Если документ изменился, кэш на нём сбросится, но базовые инструкции — нет.</p>

<h2>7. Реальные кейсы экономии</h2>

<h3>Чат-бот поддержки</h3>
<p>System prompt 3000 токенов + few-shot 4000 токенов. Каждый ответ ~500 токенов output.</p>
<ul>
<li>Без кэша: 7500 × $3 + 500 × $15 = $0.030 за ответ</li>
<li>С кэшем (после первого): 7500 × $0.30 + 500 × $15 = $0.010 за ответ</li>
<li>Экономия: <strong>~67% на input части</strong></li>
</ul>

<h3>RAG-бот над книгой</h3>
<p>Книга 80 000 токенов. Юзер задаёт 10 вопросов в сессии.</p>
<ul>
<li>Без кэша: 10 × 80 000 × $3 = <strong>$2.40 за сессию</strong></li>
<li>С кэшем: $0.30 (cache write) + 9 × 80 000 × $0.30 = <strong>$0.52 за сессию</strong></li>
<li>Экономия: <strong>78%</strong></li>
</ul>

<h3>Code agent</h3>
<p>Контекст 50 000 токенов кода. 20 итераций агента в задаче.</p>
<ul>
<li>Без кэша: 20 × 50 000 × $3 = $3.00 на задачу</li>
<li>С кэшем: 1 × $0.19 + 19 × $0.015 = $0.47</li>
<li>Экономия: <strong>84%</strong></li>
</ul>

<h2>8. Подводные камни</h2>

<h3>Cache не сработает если</h3>
<ul>
<li>Минимальный размер не достигнут (1024 токена для Sonnet)</li>
<li>Кэш истёк (более 5 минут / 1 часа простоя)</li>
<li>В кэшируемой части хоть один символ изменился</li>
<li>Модель сменилась — у каждой модели свой кэш</li>
</ul>

<h3>Цена кэширования</h3>
<p>Cache write дороже обычного на 25%. Если ты делаешь только 1 запрос — не экономишь. Окупается со 2-го.</p>

<h3>Безопасность контекста</h3>
<p>Каждый клиент API имеет свой кэш — между разными аккаунтами он не пересекается. Но внутри своего проекта будь осторожен: если в кэше есть пользовательские данные клиента А, другой клиент Б к ним доступа не получит, но в логах твоего бэкенда они есть.</p>

<h3>Не путать с PromptShield</h3>
<p>В разных провайдерах разные системы. У OpenAI есть свой prompt caching (с 2024), но цена и поведение отличаются. Урок про Anthropic — для OpenAI смотри их доки.</p>

<h2>9. Глоссарий</h2>
<ul>
<li><strong>Prompt caching</strong> — кэширование стабильной части промпта</li>
<li><strong>Cache write</strong> — первый запрос, формирующий кэш (+25% к цене)</li>
<li><strong>Cache read</strong> — последующие запросы, читающие из кэша (-90%)</li>
<li><strong>Cache breakpoint</strong> — место в промпте, где заканчивается кэшируемая часть</li>
<li><strong>Ephemeral cache</strong> — стандартный 5-минутный кэш</li>
<li><strong>Extended cache</strong> — 1-часовой кэш (beta, дороже)</li>
<li><strong>cache_control</strong> — параметр в API для указания кэша</li>
</ul>

<h2>11. Проверь себя</h2>

В 10 раз дешевле обычного input (например, $0.30/M для Sonnet вместо $3.00/M).</p>

На 25% дороже обычного input ($3.75/M для Sonnet). Окупается со второго запроса.</p>

<p><strong>3. Минимальный размер для кэширования?</strong><br>
1024 токена для Sonnet/Opus, 2048 для Haiku.</p>

<pre><code>import os
import asyncio
from dotenv import load_dotenv
from aiogram import Bot, Dispatcher, F
from aiogram.types import Message
from aiogram.filters import Command
from openai import OpenAI

load_dotenv()
bot = Bot(token=os.getenv("TG_TOKEN"))
dp = Dispatcher()
client = OpenAI()

SUMMARY_PROMPT = """Ты пресс-секретарь. Перед тобой переписка из мессенджера.

Сделай краткое summary в формате:

📌 ТЕМЫ (что обсуждали, 1-3 пункта)

✅ РЕШЕНИЯ (что решили, что-то конкретное)

⚠️ ВОПРОСЫ К НАМ (что ждут от меня лично — если упоминается)

📅 ДАТЫ И ДЕДЛАЙНЫ (если есть)

Будь краток. Не воды, только факты. Если переписка пустая или
бессмысленная — скажи прямо."""


@dp.message(Command("start"))
async def cmd_start(message: Message):
    await message.answer(
        "Привет! Перешли мне или вставь любую длинную переписку — "
        "я сделаю выжимку. Работает с пересылкой нескольких сообщений подряд."
    )


@dp.message(F.text)
async def summarize(message: Message):
    text = message.text
    if len(text) < 100:
        await message.answer("Слишком короткое для саммари. Минимум 100 символов.")
        return

    await message.answer("⏳ Делаю саммари...")

    response = client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[
            {"role": "system", "content": SUMMARY_PROMPT},
            {"role": "user", "content": text}
        ],
        temperature=0.3,
        max_tokens=600
    )

    summary = response.choices[0].message.content
    await message.answer(summary, parse_mode="Markdown")


async def main():
    await dp.start_polling(bot)


if __name__ == "__main__":
    asyncio.run(main())</code></pre>

<h2>Шаг 4. Улучшения (по желанию)</h2>

<h3>Поддержка пересылки нескольких сообщений</h3>

<p>Если переслать 5 сообщений — каждое прилетит отдельно. Лучше склеить:</p>

<pre><code>from collections import defaultdict
from datetime import datetime

# буфер: user_id → список (время, текст)
forward_buffer = defaultdict(list)

@dp.message(F.text)
async def collect(message: Message):
    user_id = message.from_user.id
    forward_buffer[user_id].append((datetime.now(), message.text))

    # ждём 2 секунды без новых сообщений
    await asyncio.sleep(2)

    # если за это время пришли ещё — выходим (тот вызов отработает)
    last_time = forward_buffer[user_id][-1][0]
    if (datetime.now() - last_time).total_seconds() < 1.5:
        return

    # склеиваем и обрабатываем
    full_text = "\\n\\n".join([t for _, t in forward_buffer[user_id]])
    forward_buffer[user_id] = []

    if len(full_text) < 100:
        await message.answer("Слишком короткое.")
        return

    # ... тот же код саммари ...</code></pre>

<pre><code>if len(text) > 200_000:
    await message.answer("Текст слишком длинный (>200к знаков). Раздели на части.")
    return</code></pre>

<h2>Шаг 2. Скрипт индексации</h2>

<p>Файл <code>indexer.py</code>:</p>

<pre><code>import os
import glob
from pathlib import Path
from dotenv import load_dotenv
from openai import OpenAI
import chromadb

load_dotenv()
client = OpenAI()

# путь к твоим заметкам — поменяй
NOTES_DIR = os.path.expanduser("~/Documents/Obsidian/MyVault")

# инициализация Chroma (создаст папку chroma_db рядом)
chroma = chromadb.PersistentClient(path="./chroma_db")

# если коллекция была — пересоздаём
try:
    chroma.delete_collection("notes")
except:
    pass
collection = chroma.create_collection("notes")


def chunk_markdown(text: str, max_size: int = 800) -> list[str]:
    """Режем по параграфам, склеивая мелкие."""
    paragraphs = [p.strip() for p in text.split("\\n\\n") if p.strip()]
    chunks = []
    current = ""
    for p in paragraphs:
        if len(current) + len(p) <= max_size:
            current += "\\n\\n" + p if current else p
        else:
            if current:
                chunks.append(current)
            current = p if len(p) <= max_size else p[:max_size]
    if current:
        chunks.append(current)
    return chunks


def embed(texts: list[str]) -> list[list[float]]:
    """Эмбеддинг батчем — быстрее и дешевле."""
    response = client.embeddings.create(
        model="text-embedding-3-small",
        input=texts
    )
    return [item.embedding for item in response.data]


def index_notes():
    files = glob.glob(f"{NOTES_DIR}/**/*.md", recursive=True)
    print(f"Найдено {len(files)} файлов")

    all_chunks = []
    all_metadata = []
    all_ids = []

    for filepath in files:
        with open(filepath, "r", encoding="utf-8") as f:
            content = f.read()

        # простая очистка: убираем YAML frontmatter
        if content.startswith("---"):
            parts = content.split("---", 2)
            if len(parts) >= 3:
                content = parts[2].strip()

        chunks = chunk_markdown(content)
        rel_path = os.path.relpath(filepath, NOTES_DIR)

        for i, chunk in enumerate(chunks):
            all_chunks.append(chunk)
            all_metadata.append({"file": rel_path, "chunk": i})
            all_ids.append(f"{rel_path}:{i}")

    print(f"Всего chunks: {len(all_chunks)}")

    # эмбеддим батчами по 100
    batch_size = 100
    for i in range(0, len(all_chunks), batch_size):
        batch = all_chunks[i:i+batch_size]
        embs = embed(batch)
        collection.add(
            ids=all_ids[i:i+batch_size],
            embeddings=embs,
            documents=batch,
            metadatas=all_metadata[i:i+batch_size]
        )
        print(f"Проиндексировано: {min(i+batch_size, len(all_chunks))}/{len(all_chunks)}")

    print("✓ Индексация завершена")


if __name__ == "__main__":
    index_notes()</code></pre>

<h2>Шаг 3. Скрипт поиска и генерации ответа</h2>

<p>Файл <code>ask.py</code>:</p>

<pre><code>import os
import sys
from dotenv import load_dotenv
from openai import OpenAI
import chromadb

load_dotenv()
client = OpenAI()
chroma = chromadb.PersistentClient(path="./chroma_db")
collection = chroma.get_collection("notes")


SYSTEM_PROMPT = """Ты ассистент по личным заметкам пользователя.

ПРАВИЛА:
- Отвечай ТОЛЬКО на основе предоставленных фрагментов заметок.
- Если в заметках нет информации — честно скажи "В заметках это не нашёл".
- НЕ придумывай. НЕ дополняй из общих знаний.
- В ответе ссылайся на конкретные файлы: "[в заметке X]".
- Если в заметках есть противоречие — укажи на него.
- Будь краток. По делу."""


def ask(question: str, k: int = 5) -> str:
    # эмбеддим вопрос
    q_emb = client.embeddings.create(
        model="text-embedding-3-small",
        input=question
    ).data[0].embedding

    # ищем
    results = collection.query(
        query_embeddings=[q_emb],
        n_results=k
    )

    # форматируем найденные chunks
    chunks_text = ""
    for doc, meta in zip(results["documents"][0], results["metadatas"][0]):
        chunks_text += f"\\n\\n--- из файла {meta['file']} ---\\n{doc}"

    # просим LLM ответить
    response = client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[
            {"role": "system", "content": SYSTEM_PROMPT},
            {"role": "user", "content": f"ВОПРОС: {question}\\n\\nФРАГМЕНТЫ ЗАМЕТОК:{chunks_text}"}
        ],
        temperature=0.2,
        max_tokens=600
    )
    return response.choices[0].message.content


if __name__ == "__main__":
    if len(sys.argv) > 1:
        question = " ".join(sys.argv[1:])
    else:
        question = input("Вопрос: ")
    print("\\n", ask(question))</code></pre>

      link.className = 'lesson-link' + (completed ? ' completed' : '') + (lesson.draft ? ' draft' : '') + (lesson.id === currentLessonId ? ' active' : '');

function openLesson(id) {
  currentLessonId = id;
  setActiveStaticLink(null);
  closeSidebar();
  // подсветка top-nav по типу урока
  const lesson = findLesson(id);
  if (lesson) {
    if (typeof id === 'number') setActiveTopNav('main');
    else if (lesson.track === 'claude') setActiveTopNav('claude');
    else if (lesson.track === 'projects') setActiveTopNav('projects');
    else if (lesson.track === 'industry') setActiveTopNav('industry');
  }
  renderLesson(id);
  history.replaceState(null, '', `#lesson-${id}`);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  trackEvent(`lesson-open-${id}`, `Lesson opened: ${id}`);
  buildNav();
}

function renderLesson(id) {
  const lesson = findLesson(id);
  const container = document.getElementById('lesson-content');
  if (!lesson) {
    renderWelcome();
    return;
  }

  const completed = isCompleted(id);
  // Навигация: для главного пути — по номерам, для треков — по списку трека
  let prevLesson, nextLesson;
  if (typeof id === 'number') {
    prevLesson = LESSONS.find(l => l.id === id - 1);
    nextLesson = LESSONS.find(l => l.id === id + 1);
  } else {
    const trackList = TRACK_LESSONS.filter(l => l.track === lesson.track);
    const idx = trackList.findIndex(l => l.id === id);
    prevLesson = idx > 0 ? trackList[idx - 1] : null;
    nextLesson = idx < trackList.length - 1 ? trackList[idx + 1] : null;
  }

  const writtenIds = LESSONS.filter(l => l.content).map(l => l.id).filter(x => typeof x === 'number').sort((a,b) => a-b);
  const availableRange = writtenIds.length
    ? (writtenIds.length === 1 ? `Урок ${writtenIds[0]}` : `Уроки ${writtenIds[0]}–${writtenIds[writtenIds.length-1]}`)
    : '';

  const courseUpdated = (typeof CHANGELOG !== 'undefined' && CHANGELOG[0]) ? fmtDate(CHANGELOG[0].date) : '';
  const timeMeta = `
    <div class="lesson-time-meta">
      <span>⏱ <strong>~${lesson.duration} мин</strong> чтения</span>
      <span class="dot"></span>
      <span>📝 <strong>30–60 мин</strong> практики</span>
      ${courseUpdated ? `<span class="dot"></span><span>🔄 обновлено: <strong>${courseUpdated}</strong></span>` : ''}
    </div>
  `;

  let body;
  if (lesson.content) {
    // Inject time meta after the first H1 of lesson content
    body = lesson.content.replace(/(<h1[^>]*>[\s\S]*?<\/h1>)/, `$1${timeMeta}`);
  } else {
    body = `
      <h1>Урок ${lesson.id}. ${lesson.title}</h1>
      ${timeMeta}
      <div class="lesson-meta">
        <span><strong>Фаза:</strong> ${lesson.phase}</span>
        <span><strong>Статус:</strong> черновик</span>
      </div>
      <div class="draft-notice">
        <h3>✏️ Этот урок ещё пишется</h3>
        <p>Подробное содержание появится в одной из следующих итераций. Темп: ~2 урока в день, в порядке очереди.</p>
        ${availableRange ? `<p>Сейчас доступно из главного пути: <strong>${availableRange}</strong>. Спецветки тоже частично готовы — смотри <a href="#changelog" onclick="openStaticPage('changelog'); return false;">«Что нового»</a>.</p>` : ''}
      </div>
    `;
  }

  const actions = `
    <div class="lesson-actions">
      <label class="complete-checkbox">
        <input type="checkbox" ${completed ? 'checked' : ''} onchange="toggleCompleted(${id})">
        <span>${completed ? 'Урок пройден' : 'Отметить как пройденный'}</span>
      </label>
      <div class="nav-buttons">
        <button class="nav-btn" ${!prevLesson ? 'disabled' : ''} onclick="${prevLesson ? `openLesson(${prevLesson.id})` : ''}">← Предыдущий</button>
        <button class="nav-btn" ${!nextLesson ? 'disabled' : ''} onclick="${nextLesson ? `openLesson(${nextLesson.id})` : ''}">Следующий →</button>
      </div>
    </div>
  `;

  container.innerHTML = body + actions;
}

// Маппинг урок → категория и иконка-эмодзи
function lessonTheme(lesson) {
  if (!lesson) return { theme: "fundamentals", icon: "📚", catKey: "fundamentals", catName: "ОСНОВЫ" };

  // Спецветки
  if (lesson.track === 'claude') return { theme: "claude", icon: "🟣", catKey: "claude", catName: "CLAUDE" };
  if (lesson.track === 'projects') return { theme: "projects", icon: "🛠", catKey: "projects", catName: "ПРОЕКТ" };
  if (lesson.track === 'industry') return { theme: "industry", icon: "💼", catKey: "industry", catName: "ИНДУСТРИЯ" };

  // Главный путь — по номеру урока
  const id = lesson.id;
  if (id <= 3) return { theme: "fundamentals", icon: "🌱", catKey: "fundamentals", catName: "ОСНОВЫ" };
  if (id <= 5) return { theme: "prompts", icon: "✍️", catKey: "prompts", catName: "ПРОМПТЫ" };
  if (id <= 8) return { theme: "api", icon: "💻", catKey: "api", catName: "API" };
  if (id <= 12) return { theme: "safety", icon: "🛡", catKey: "safety", catName: "БЕЗОПАСНОСТЬ" };
  if (id <= 15) return { theme: "rag", icon: "🔍", catKey: "rag", catName: "RAG" };
  if (id <= 30) return { theme: "agents", icon: "🤖", catKey: "agents", catName: "АГЕНТЫ" };
  if (id <= 42) return { theme: "ml", icon: "🧠", catKey: "ml", catName: "НЕЙРОСЕТИ" };
  if (id <= 50) return { theme: "nlp", icon: "💬", catKey: "nlp", catName: "NLP" };
  return { theme: "ml", icon: "⚙️", catKey: "ml", catName: "ML" };
}

function lessonStatus(lesson) {
  if (lesson.draft) return '<span class="badge badge-draft">Черновик</span>';
  if (isCompleted(lesson.id)) return '<span class="badge badge-complete">Пройдено</span>';
  return '<span class="badge badge-ongoing">Доступно</span>';
}

function lessonCard(lesson) {

// SVG donut chart
function donutChart(segments, centerNum, centerLabel) {
  // segments: [{label, value, color}]
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const radius = 70, strokeWidth = 22;
  const circumference = 2 * Math.PI * radius;

  let offset = 0;
  const paths = segments.map(s => {
    const dash = (s.value / total) * circumference;
    const result = `<circle cx="90" cy="90" r="${radius}" fill="none" stroke="${s.color}" stroke-width="${strokeWidth}" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" />`;
    offset += dash;
    return result;
  }).join('');

  const legend = segments.map(s => `
    <div class="donut-legend-item">
      <span class="donut-legend-dot" style="background: ${s.color}"></span>
      <span>${s.label}</span>
      <span style="margin-left: auto; color: var(--text-muted);">${total ? Math.round(s.value / total * 100) : 0}%</span>
    </div>
  `).join('');

  return `
    <div class="donut-container">
      <div class="donut-svg">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="${radius}" fill="none" stroke="var(--border-soft)" stroke-width="${strokeWidth}" />
          ${paths}
        </svg>
        <div class="donut-center">
          <div class="num">${centerNum}</div>
          <div class="label">${centerLabel}</div>
        </div>
      </div>
      <div class="donut-legend">${legend}</div>
    </div>
  `;
}

// Маленькая SVG-кольцо прогресса для Continue Learning
function circleProgress(percent) {
  const radius = 18, sw = 4;
  const circ = 2 * Math.PI * radius;
  const filled = (percent / 100) * circ;
  return `
    <div class="circle-progress">
      <svg width="44" height="44" viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="${radius}" fill="none" stroke="var(--border-soft)" stroke-width="${sw}" />
        <circle cx="22" cy="22" r="${radius}" fill="none" stroke="var(--accent)" stroke-width="${sw}"
                stroke-dasharray="${filled} ${circ}" stroke-linecap="round" />
      </svg>
      <div class="circle-progress-text">${percent}%</div>
    </div>
  `;
}

function continueCard(lesson, percent) {
  const theme = lessonTheme(lesson);
  const idStr = typeof lesson.id === 'string' ? `'${lesson.id}'` : lesson.id;
  return `

function toggleSidebar() {

}
function closeSidebar() {
  document.body.classList.remove('sidebar-open');
}

function trackEvent(eventName, eventTitle = null) {
  // GoatCounter custom event (если подключен)
  try {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({
        path: eventName,
        title: eventTitle || eventName,
        event: true
      });
    }
  } catch (e) { /* silent */ }

  // Локальный fallback — в localStorage для админки
  try {
    const events = JSON.parse(localStorage.getItem('events') || '[]');
    events.push({ name: eventName, ts: Date.now() });
    if (events.length > 500) events.splice(0, events.length - 500);
    localStorage.setItem('events', JSON.stringify(events));
  } catch (e) { /* silent */ }
}

  events.forEach(e => {
    const openMatch = e.name.match(/^lesson-open-(.+)$/);
    const completeMatch = e.name.match(/^lesson-complete-(.+)$/);
    if (openMatch) lessonOpens[openMatch[1]] = (lessonOpens[openMatch[1]] || 0) + 1;
    if (completeMatch) lessonCompletes[completeMatch[1]] = (lessonCompletes[completeMatch[1]] || 0) + 1;
  });

  // топ-5 открытых
  const topOpens = Object.entries(lessonOpens)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);

  // прогресс по фазам
  let phaseStats = '';
  PHASES.forEach(phase => {
    const phaseLessons = LESSONS.filter(l => l.phase === phase.id);
    const phaseDone = phaseLessons.filter(l => isCompleted(l.id)).length;
    const pct = phaseLessons.length ? (phaseDone / phaseLessons.length * 100).toFixed(0) : 0;
    phaseStats += `
      <div class="admin-stat">
        <span class="label">${phase.title}</span>
        <span class="value">${phaseDone}/${phaseLessons.length} · ${pct}%</span>
      </div>
    `;
  });

  // прогресс по трекам
  let trackStats = '';
  TRACKS.forEach(track => {
    const trackLessons = TRACK_LESSONS.filter(l => l.track === track.id);
    const trackDone = trackLessons.filter(l => isCompleted(l.id)).length;
    const trackWritten = trackLessons.filter(l => l.content).length;
    trackStats += `
      <div class="admin-stat">
        <span class="label">${track.title}</span>
        <span class="value">${trackDone}/${trackLessons.length} · ${trackWritten} готово</span>
      </div>
    `;
  });

  // квизы
  let quizStats = '';
  PHASES.forEach(phase => {
    const score = progress[`quiz_phase_${phase.id}`];
    if (score !== undefined) {
      quizStats += `
        <div class="admin-stat">
          <span class="label">Квиз Фазы ${phase.id}</span>
          <span class="value">${score} правильных</span>
        </div>
      `;
    }
  });
  if (!quizStats) quizStats = '<p style="color: var(--text-muted);">Ещё не проходил квизы.</p>';

  // топ открытых уроков
  let topOpenedHTML = '';
  if (topOpens.length === 0) {
    topOpenedHTML = '<p style="color: var(--text-muted);">События ещё не накопились — открывай уроки, считается локально.</p>';

      `;
    });
    topOpenedHTML += '</ul>';
  }

  document.getElementById('lesson-content').innerHTML = `

function exportData() {
  const data = {
    progress,
    events: JSON.parse(localStorage.getItem('events') || '[]'),
    subscribers: JSON.parse(localStorage.getItem('email_subscribers') || '[]'),
    quiz_states: {},
    exported_at: new Date().toISOString()
  };
  // соберём состояния квизов
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('quiz_phase_')) {
      data.quiz_states[key] = JSON.parse(localStorage.getItem(key));
    }
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ai-course-data-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function resetAllData() {
  if (!confirm('Точно сбросить весь прогресс? Это нельзя отменить.')) return;
  Object.keys(localStorage).forEach(k => {
    if (k.startsWith('quiz_phase_') || ['ai-course-progress', 'events', 'email_subscribers'].includes(k)) {
      localStorage.removeItem(k);
    }
  });
  progress = {};
  location.reload();
}

function openStaticPage(name) {
  currentLessonId = null;
  setActiveStaticLink(name);
  setActiveTopNav(null);
  closeSidebar();
  buildNav();
  setActiveStaticLink(name);
  history.replaceState(null, '', `#${name}`);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  trackEvent(`page-${name}`, `Static page: ${name}`);

  if (name === 'home') renderHome();
  else if (name === 'about') renderAbout();
  else if (name === 'howto') renderHowTo();
  else if (name === 'faq') renderFAQ();
  else if (name === 'changelog') renderChangelog();
  else if (name === 'resources') renderResources();
  else if (name === 'admin') renderAdmin();
}

function renderGlossary(highlightId = null) {
  const total = GLOSSARY.length;

  let html = `
    <h1>📖 Глоссарий</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
      ${total} терминов и аббревиатур из всех уроков. На каждый термин можно дать прямую ссылку — например, <code>${location.origin}${location.pathname}#glossary-cot</code>.
    </p>

    <input type="text" class="search-box" id="glossary-search" placeholder="Найти термин..." style="width: 100%; padding: 0.75rem 1rem; font-size: 1rem; margin-bottom: 1.5rem;" oninput="filterGlossary(this.value)">

    <div id="glossary-content">
  `;

  GLOSSARY_CATEGORIES.forEach(cat => {
    const terms = GLOSSARY.filter(t => t.category === cat.id);
    if (terms.length === 0) return;

    html += `<h2 style="margin-top: 2rem;" data-cat="${cat.id}">${cat.title}</h2>`;
    html += '<div class="glossary-terms">';

    terms.forEach(t => {
      const lessonsLinks = (t.lessons || []).map(lid => {
        const l = findLesson(lid);
        if (!l) return '';
        return `<a href="#lesson-${lid}" onclick="openLesson(${typeof lid === 'string' ? `'${lid}'` : lid}); return false;" style="font-size: 0.85rem;">Урок ${lid}</a>`;
      }).filter(Boolean).join(' · ');

      const allText = `${t.term} ${(t.aliases || []).join(' ')} ${t.short}`.toLowerCase();
      const isHighlighted = t.id === highlightId;

      html += `
        <div class="glossary-term" id="glossary-${t.id}" data-search="${allText}" data-cat="${cat.id}" style="${isHighlighted ? 'background: var(--accent-soft); border-left-color: var(--accent);' : ''}">
          <div class="glossary-term-header">
            <h3>${t.term}</h3>
            <a href="#glossary-${t.id}" class="glossary-anchor" onclick="copyAnchor('${t.id}'); return false;" title="Скопировать ссылку">🔗</a>
          </div>
          <p>${t.short}</p>
          ${lessonsLinks ? `<div class="glossary-lessons">${lessonsLinks}</div>` : ''}
        </div>
      `;
    });

    html += '</div>';
  });

  html += '</div>';

  document.getElementById('lesson-content').innerHTML = html;

  // Прокрутить к выделенному термину
  if (highlightId) {
    setTimeout(() => {
      const el = document.getElementById(`glossary-${highlightId}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }
}

function filterGlossary(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.glossary-term').forEach(el => {
    const text = el.dataset.search;
    el.style.display = !q || text.includes(q) ? '' : 'none';
  });
  // скрываем заголовки пустых категорий
  document.querySelectorAll('h2[data-cat]').forEach(h => {
    const cat = h.dataset.cat;
    const hasVisible = Array.from(document.querySelectorAll(`.glossary-term[data-cat="${cat}"]`)).some(el => el.style.display !== 'none');
    h.style.display = hasVisible ? '' : 'none';
  });
}

function openGlossary(termId = null) {
  currentLessonId = null;
  setActiveStaticLink('glossary');
  setActiveTopNav(null);
  closeSidebar();
  buildNav();
  setActiveStaticLink('glossary');
  history.replaceState(null, '', termId ? `#glossary-${termId}` : '#glossary');
  trackEvent(termId ? `glossary-${termId}` : 'glossary', `Glossary: ${termId || 'all'}`);
  renderGlossary(termId);
}

function copyAnchor(termId) {
  const url = `${location.origin}${location.pathname}#glossary-${termId}`;
  navigator.clipboard.writeText(url).then(() => {
    const note = document.createElement('div');
    note.textContent = '✓ Ссылка скопирована';
    note.style.cssText = 'position: fixed; bottom: 2rem; right: 2rem; background: var(--success); color: white; padding: 0.5rem 1rem; border-radius: 6px; z-index: 1000; font-size: 0.9rem;';
    document.body.appendChild(note);
    setTimeout(() => note.remove(), 1500);
  });
}
