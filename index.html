<h2>Зачем тебе этот урок</h2>
<p>Базовые промпты из урока 4 покрывают 80% задач. Но есть 20%, где обычный промпт ломается:</p>
<ul>
<li>Многошаговые рассуждения (математика, логика).</li>
<li>Задачи, требующие плана и стратегии.</li>
<li>Случаи, когда нужно «передумать» при ошибке.</li>
<li>Цепочки обработки данных, где один промпт не справляется.</li>
<li>Задачи, требующие действий во внешнем мире.</li>
</ul>
<p>Этот урок — арсенал техник для этих сложных задач. Ты узнаешь:</p>
<ul>
<li><strong>Chain-of-Thought</strong> — пошаговое рассуждение, повышает точность на 20–60% на сложных задачах.</li>
<li><strong>Self-consistency</strong> — голосование между несколькими попытками.</li>
<li><strong>Tree-of-Thoughts</strong> — ветвление решений.</li>
<li><strong>ReAct</strong> — паттерн для агентов: рассуждай и действуй.</li>
<li><strong>Prompt chaining</strong> — цепочки промптов вместо одного длинного.</li>
</ul>

<h2>1. Chain-of-Thought (CoT) — пошаговое рассуждение</h2>

<h3>Магия в одной фразе</h3>
<p>В 2022 Google опубликовал статью «Chain-of-Thought Prompting Elicits Reasoning in Large Language Models». Открытие было странным: достаточно добавить в промпт фразу <strong>«Let's think step by step»</strong> — и точность модели на математических задачах вырастает на 20–60%.</p>

<h3>Почему это работает</h3>
<p>Когда модель сразу пишет финальный ответ, она по сути «угадывает» его за один токен. Если задача требует промежуточных вычислений, у неё нет места для них.</p>
<p>Когда ты просишь рассуждать пошагово, модель использует <strong>свой собственный текст как черновик мышления</strong>. Промежуточные шаги становятся частью контекста, и каждый следующий токен генерируется уже с учётом них.</p>
<p>Это эффект «внешней памяти». Модель не «думает» в человеческом смысле, но способность пошагово раскладывать ход рассуждения значительно повышает её точность.</p>

<h3>Пример</h3>
<p><strong>Задача:</strong> «У Маши было 5 яблок. Она съела 2 и купила ещё 3. Потом отдала половину Лене. Сколько у неё осталось?»</p>
<p><strong>Без CoT (GPT-3.5):</strong> часто отвечает «3» (неправильно).</p>
<p><strong>С CoT</strong> («Рассуждай пошагово»):</p>
<pre><code>Шаг 1: было 5 яблок.
Шаг 2: съела 2 → стало 5 - 2 = 3.
Шаг 3: купила 3 → стало 3 + 3 = 6.
Шаг 4: отдала половину = 6 / 2 = 3.
Шаг 5: осталось 6 - 3 = 3.

Ответ: 3.</code></pre>
<p>В этом примере получилось «3» в обоих случаях, но это совпадение — на более сложных задачах разница существенная.</p>

<h3>Когда применять CoT</h3>
<ul>
<li>✅ Математика и вычисления.</li>
<li>✅ Логические задачи.</li>
<li>✅ Многошаговая обработка (извлечь → проверить → классифицировать).</li>
<li>✅ Анализ кода и багов.</li>
<li>✅ Юридические и медицинские рассуждения (но не для финального решения!).</li>
<li>❌ Простые фактические запросы — лишний оверхед.</li>
<li>❌ Креативные задачи (поэзия, стиль) — может «убить» спонтанность.</li>
</ul>

<h3>Как включать CoT в промпт</h3>
<p><strong>Вариант 1. Прямая инструкция:</strong></p>
<pre><code>... Рассуждай пошагово, прежде чем дать финальный ответ.
В конце выдели итог фразой "Ответ:".</code></pre>

<p><strong>Вариант 2. Few-shot с примерами рассуждений:</strong></p>
<pre><code>Пример:
Вопрос: Если 3 рубашки сохнут 1 час...
Рассуждение: Сушка — параллельный процесс...
Ответ: 1 час.

Вопрос: [твой вопрос]
Рассуждение:</code></pre>

<p><strong>Вариант 3. Reasoning-модели (o1, o3, R1):</strong></p>
<p>У них CoT встроен в архитектуру — ты пишешь обычный промпт, а внутри они сами думают по шагам. Не нужно явно просить.</p>

<h2>2. Self-consistency — голосование между попытками</h2>

<h3>Идея</h3>
<p>Прогоняешь один и тот же промпт <strong>несколько раз с temperature&gt;0</strong> — получаешь несколько разных ответов. Если задача с однозначно правильным ответом, берёшь самый частый (мажорное голосование).</p>

<h3>Когда полезно</h3>
<ul>
<li>Сложные задачи, где модель ошибается в 30–40% случаев.</li>
<li>Можешь себе позволить запустить 5–20 раз (это в 5–20 раз дороже).</li>
<li>Есть «правильный ответ», который можно сравнить.</li>
</ul>

<h3>Псевдокод</h3>
<pre><code>answers = []
for i in range(10):
    response = llm(prompt, temperature=0.7)
    answers.append(extract_answer(response))

final_answer = most_common(answers)</code></pre>

<h3>Реальный кейс</h3>
<p>На задаче GSM8K (математика для младших классов) Self-consistency повышает точность GPT-3 с ~50% до ~70%. Дорогая, но иногда оправданная техника.</p>

<h2>3. Tree-of-Thoughts (ToT) — ветвление мышления</h2>

<h3>Идея</h3>
<p>Модель не идёт по одному пути решения, а генерирует <strong>несколько вариантов</strong> на каждом шаге, оценивает их и продолжает лучший. Получается дерево возможных решений.</p>

<h3>Структура</h3>
<pre><code>Шаг 1: Сгенерируй 3 варианта первого хода.
Шаг 2: Для каждого оцени, насколько он перспективен (1-10).
Шаг 3: Возьми лучший. Сгенерируй 3 варианта следующего хода.
... (повторить N раз)
Шаг финал: Выдай решение по лучшему пути.</code></pre>

<h3>Когда применять</h3>
<ul>
<li>Творческие задачи с большим пространством решений (стратегии, сценарии).</li>
<li>Игры, головоломки.</li>
<li>Программирование — пробовать несколько подходов к багу.</li>
<li>Принятие решений с трейд-оффами.</li>
</ul>
<p>В чистом виде ToT обычно реализуется в коде, а не одним промптом, потому что каждый «узел дерева» — отдельный вызов LLM.</p>

<h2>4. ReAct — Reasoning + Acting</h2>

<h3>Идея</h3>
<p>Базовый паттерн для <strong>агентов</strong>. Модель чередует:</p>
<ul>
<li><strong>Thought</strong> — рассуждение, что нужно сделать.</li>
<li><strong>Action</strong> — вызов инструмента (поиск, расчёт, API).</li>
<li><strong>Observation</strong> — результат вызова, добавленный в контекст.</li>
<li>...повторить пока не получен ответ.</li>
</ul>

<h3>Пример диалога с ReAct</h3>
<pre><code>Вопрос: Какая текущая температура в столице Уругвая?

Thought: Мне нужно узнать столицу Уругвая, потом погоду там.
Action: search("столица Уругвая")
Observation: Монтевидео.

Thought: Теперь нужна температура в Монтевидео.
Action: weather("Монтевидео")
Observation: +18°C, облачно.

Thought: Достаточно информации для ответа.
Final Answer: Текущая температура в Монтевидео (столице
Уругвая) — +18°C, облачно.</code></pre>

<h3>Что важно</h3>
<ul>
<li>Каждое <code>Action</code> — это вызов реальной функции в коде. Модель не «делает» поиск сама — она просит твой код запустить поиск.</li>
<li>Результат функции возвращается в контекст как <code>Observation</code>.</li>
<li>Цикл продолжается, пока модель не выдаст <code>Final Answer</code>.</li>
</ul>

<p>Подробно ReAct и агенты будут в фазе 2 (уроки 16+). Здесь главное — понять механику.</p>

<h2>5. Prompt chaining — цепочки промптов</h2>

<h3>Идея</h3>
<p>Сложную задачу режем на этапы. На каждом этапе — отдельный промпт. Выход одного — вход следующего.</p>

<h3>Когда полезно</h3>
<ul>
<li>Задача требует разных инструкций на разных этапах.</li>
<li>Промежуточные результаты нужно проверять/фильтровать.</li>
<li>Результат одного шага влияет на стратегию следующего.</li>
<li>Хочется отлаживать каждый этап отдельно.</li>
</ul>

<h3>Пример: пайплайн анализа писем</h3>
<p><strong>Задача:</strong> «Из 100 писем составь сводку по приоритетным запросам клиентов».</p>

<p><strong>Плохо (одним промптом):</strong> «Прочитай эти 100 писем и сделай сводку приоритетных запросов» — модель размажется, ошибётся в классификации, упустит детали.</p>

<p><strong>Хорошо (chain):</strong></p>
<pre><code>Промпт 1 (для каждого письма): извлеки тип запроса и срочность.
→ JSON {request_type, urgency}

Промпт 2 (агрегация): сгруппируй извлечённые JSON по типам.
→ Список групп с count и примерами.

Промпт 3 (саммари): по группам с urgency&gt;7 напиши сводку
для руководителя. Структура: тип, количество, пример,
рекомендация.
→ Готовый отчёт.</code></pre>

<p>Каждый промпт делает <strong>одно</strong>. Проще отлаживать, легче масштабировать, выше итоговое качество.</p>

<h3>Структура «map-reduce» в LLM</h3>
<p>Частный случай chaining, очень популярный:</p>
<ul>
<li><strong>Map</strong> — обрабатываем каждый кусок данных независимо одним промптом.</li>
<li><strong>Reduce</strong> — агрегируем результаты вторым промптом.</li>
</ul>
<p>Например, суммаризация книги: суммаризируем каждую главу (map), потом суммаризируем все саммари (reduce).</p>

<h2>6. Какой паттерн когда</h2>
<table>
<tr><th>Задача</th><th>Паттерн</th></tr>
<tr><td>Математика, логика</td><td>CoT</td></tr>
<tr><td>Критическая точность, можно платить</td><td>Self-consistency</td></tr>
<tr><td>Творчество, стратегия</td><td>Tree-of-Thoughts</td></tr>
<tr><td>Нужны действия (поиск, API)</td><td>ReAct</td></tr>
<tr><td>Сложный pipeline данных</td><td>Prompt chaining</td></tr>
<tr><td>Обработка большого корпуса</td><td>Map-reduce</td></tr>
<tr><td>Простой запрос</td><td>Обычный промпт без оверхеда</td></tr>
</table>

<h2>7. Тонкости и подводные камни</h2>

<h3>CoT не всегда лучше</h3>
<p>На простых задачах CoT добавляет шум: модель «рассуждает» там, где надо просто ответить. Это:</p>
<ul>
<li>Удлиняет ответ → дороже.</li>
<li>Может внести ошибки в простой ответ.</li>
<li>Замедляет real-time приложения.</li>
</ul>
<p>Применяй CoT <strong>селективно</strong>, не везде по умолчанию.</p>

<h3>Reasoning-модели (o1, o3) vs CoT</h3>
<p>У o1/o3 chain-of-thought зашит в архитектуру — они тратят время на «thinking» перед ответом. Если ты используешь их:</p>
<ul>
<li>НЕ нужно явно просить «think step by step» — это уже происходит.</li>
<li>Промпт должен быть кратким — лишние инструкции мешают.</li>
<li>Стоят дороже обычных моделей и медленнее.</li>
<li>Подходят для задач, где обычные модели не справляются.</li>
</ul>

<h3>Hidden chain в reasoning-моделях</h3>
<p>OpenAI <strong>не показывает</strong> внутренний CoT моделей o1 — только финальный ответ. Это сделано против reverse-engineering. Anthropic в Claude показывает «extended thinking», DeepSeek-R1 тоже открыто пишет рассуждения.</p>

<h3>Стоимость chaining vs длинного промпта</h3>
<p>3 промпта по 500 токенов != 1 промпт на 1500 токенов. У chaining дороже:</p>
<ul>
<li>Каждый запрос — отдельные накладные расходы (latency, network, system prompt).</li>
<li>Промежуточный output становится новым input — токены считаются дважды.</li>
</ul>
<p>Но качество обычно выше, и отладка проще. Считай экономику для своей задачи.</p>

<h3>Структурированный CoT</h3>
<p>Полезный приём: попроси модель использовать конкретные тэги в рассуждениях, тогда легче парсить.</p>
<pre><code>Используй формат:
&lt;analysis&gt;[твой анализ]&lt;/analysis&gt;
&lt;answer&gt;[финальный ответ]&lt;/answer&gt;</code></pre>
<p>В коде потом извлекаешь только <code>&lt;answer&gt;</code> для пользователя, а <code>&lt;analysis&gt;</code> сохраняешь в логах.</p>

<h2>8. Глоссарий</h2>
<ul>
<li><strong>CoT (Chain-of-Thought)</strong> — пошаговое рассуждение в промпте.</li>
<li><strong>Self-consistency</strong> — несколько прогонов + голосование.</li>
<li><strong>ToT (Tree-of-Thoughts)</strong> — ветвление путей решения.</li>
<li><strong>ReAct</strong> — Reasoning + Acting, паттерн агентов.</li>
<li><strong>Prompt chaining</strong> — цепочка из нескольких промптов.</li>
<li><strong>Map-reduce</strong> — обработать каждый элемент → агрегировать.</li>
<li><strong>Reasoning model</strong> — LLM со встроенным CoT (o1, o3, R1).</li>
<li><strong>Decomposition</strong> — разбиение задачи на подзадачи.</li>
<li><strong>Tool use / function calling</strong> — вызов внешних функций моделью.</li>
<li><strong>Thought / Action / Observation</strong> — компоненты ReAct-цикла.</li>
</ul>

<h2>9. Практика (60 минут)</h2>

<h3>Упражнение 1. CoT vs обычный промпт (15 минут)</h3>
<p>Возьми 3 сложные задачи. Например:</p>
<ul>
<li>«Если кран наполняет ванну за 6 минут, а слив опустошает за 9 минут, за сколько ванна наполнится при открытом сливе?»</li>
<li>«Команда из 5 человек должна закрыть 12 задач за 3 дня. Один уходит в отпуск на день. Хватит ли времени, если каждый делает 1 задачу в день?»</li>
<li>«У меня бюджет 500 000 на год. Подписки 8000/мес, налоги 25%. Сколько остаётся на жизнь в месяц?»</li>
</ul>
<ol>
<li>Прогони каждую без CoT. Запиши ответы.</li>
<li>Прогони с «Рассуждай пошагово, потом дай ответ». Сравни.</li>
<li>Оцени, в каких случаях CoT помог.</li>
</ol>

<h3>Упражнение 2. Структурированный CoT (10 минут)</h3>
<p>Возьми задачу «оцени резюме на соответствие позиции». Напиши промпт со структурой:</p>
<pre><code>&lt;evaluation&gt;
[пошаговая оценка по критериям]
&lt;/evaluation&gt;
&lt;score&gt;[1-10]&lt;/score&gt;
&lt;recommendation&gt;[hire / no-hire / interview]&lt;/recommendation&gt;</code></pre>
<p>Прогони на 3 разных «резюме». Заметь, как структура помогает консистентности.</p>

<h3>Упражнение 3. Prompt chain (20 минут)</h3>
<p>Реализуй пайплайн «вытащи из 10 коротких писем все запросы на встречу → сгруппируй по приоритету → составь календарь предложений»:</p>
<ol>
<li>Промпт 1: для каждого письма извлеки <code>{has_meeting_request, suggested_date, urgency}</code>.</li>
<li>Промпт 2: возьми результаты, сгруппируй по urgency.</li>
<li>Промпт 3: сделай красивый календарь с рекомендациями.</li>
</ol>
<p>Сравни с попыткой сделать всё одним длинным промптом.</p>

<h3>Упражнение 4. Эксперимент с reasoning-моделью (15 минут)</h3>
<p>Если есть доступ к o1, o3, R1 (DeepSeek), Gemini 2.0 Thinking:</p>
<ol>
<li>Возьми задачу, на которой обычная модель плавала.</li>
<li>Напиши <strong>краткий</strong> промпт без «think step by step».</li>
<li>Прогони. Заметь, сколько модель «думала» (если показывает).</li>
<li>Сравни ответ с обычной моделью + CoT.</li>
</ol>

<h2>10. Проверь себя</h2>

<p><strong>1. Что значит «think step by step»?</strong><br>
Инструкция модели рассуждать пошагово, прежде чем дать ответ. Это позволяет ей использовать собственный текст как «черновик мышления». Резко повышает точность на сложных задачах.</p>

<p><strong>2. Self-consistency: что и зачем?</strong><br>
Прогоняем один промпт N раз с temperature&gt;0, выбираем самый частый ответ. Полезно на задачах с однозначно правильным ответом, где модель часто ошибается.</p>

<p><strong>3. ReAct — что за паттерн?</strong><br>
Цикл Thought → Action → Observation для агентов. Модель чередует рассуждение и вызов внешних функций (поиск, API), пока не получит достаточно информации для финального ответа.</p>

<p><strong>4. Зачем разбивать сложный промпт на цепочку?</strong><br>
Каждый промпт делает одно — проще отлаживать, выше итоговое качество, можно проверять промежуточные результаты, легче масштабировать.</p>

<p><strong>5. Что общего у reasoning-моделей с CoT?</strong><br>
У них CoT встроен в архитектуру: они сами генерируют длинный «черновик мышления» перед ответом. Не нужно явно просить.</p>

<p><strong>6. Когда CoT — лишний?</strong><br>
На простых задачах: фактические вопросы, перевод, простая классификация. Там CoT добавляет шум, удлиняет ответ и удорожает запрос.</p>

<p><strong>7. Что такое map-reduce в контексте LLM?</strong><br>
Частный случай chaining: одним промптом обрабатываем каждый элемент данных независимо (map), вторым агрегируем результаты (reduce). Классика для суммаризации больших корпусов.</p>

<p><strong>8. У меня задача требует поиска в интернете в процессе. Какой паттерн?</strong><br>
ReAct + tool use. Модель рассуждает, вызывает поиск как инструмент, обрабатывает результат и продолжает.</p>

<p><strong>9. У моей задачи 5 этапов обработки. Один промпт или chain?</strong><br>
Почти всегда chain. Один промпт на 5 разных задач даст хуже качество, чем 5 фокусированных. Исключение — если этапы тривиальны и модели легко.</p>

<p><strong>10. Что такое hidden chain в reasoning-моделях?</strong><br>
Внутренние рассуждения модели, которые она генерирует, но не показывает пользователю. У OpenAI o1 — скрыты, у DeepSeek R1 — открыты, у Claude — частично («extended thinking»).</p>

<h2>11. Что должно остаться в голове</h2>
<ol>
<li><strong>CoT</strong> — самая полезная техника. Знай, когда добавлять «рассуждай пошагово».</li>
<li><strong>Reasoning-модели</strong> — отдельный класс. Используй на сложных задачах, не «приклеивай» к ним CoT.</li>
<li><strong>Self-consistency</strong> — когда точность важнее цены.</li>
<li><strong>ReAct</strong> — основа всех агентов. Будем углубляться в фазе 2.</li>
<li><strong>Chaining</strong> — спасает на сложных пайплайнах. Структура «map-reduce» — самая частая.</li>
<li><strong>Не лей CoT везде</strong> — на простых задачах он мешает.</li>
<li><strong>Структурируй ответы</strong> через теги, чтобы парсить программно.</li>
</ol>

</div>

<h1>Урок 6. Первое приложение — генерация текста через API</h1>

<div class="lesson-meta">

<h2>Зачем тебе этот урок</h2>
<p>До сих пор ты работал с LLM через ChatGPT/Claude.ai — браузерные интерфейсы. Это нормально для разовых задач. Но как только ты хочешь:</p>
<ul>
<li>Автоматизировать что-то (обработать 1000 писем, не открывая чат каждый раз).</li>
<li>Встроить ИИ в свой продукт (приложение, бот, скрипт).</li>
<li>Контролировать temperature, формат, retries программно.</li>
<li>Логировать запросы и ответы.</li>
<li>Платить только за то, что используешь — без подписки на $20/мес.</li>
</ul>
<p>...тебе нужен <strong>API</strong>. Это база всего, что мы будем делать дальше — чат-боты, поиск, RAG, агенты. К концу урока у тебя будет рабочий Python-скрипт, который вызывает GPT и возвращает ответ. Это последний барьер между «юзером ИИ» и «тем, кто строит на ИИ».</p>

<h2>1. Что такое API и зачем он</h2>

<h3>API в одном предложении</h3>
<p><strong>API (Application Programming Interface)</strong> — это интерфейс для общения программ между собой. Веб-API — это URL, на который ты шлёшь HTTP-запрос с данными, и получаешь ответ.</p>
<p>В случае LLM-провайдеров: ты отправляешь POST-запрос на endpoint вида <code>https://api.openai.com/v1/chat/completions</code> с JSON-телом, описывающим что ты хочешь. В ответ получаешь JSON с сгенерированным текстом.</p>

<h3>API ключ</h3>
<p>Чтобы провайдер знал, кто ты и кому списывать деньги, к каждому запросу прикладывается <strong>API ключ</strong> — длинная строка вида <code>sk-...XYZ</code>. Это твой пароль и счётчик в одном.</p>

<div class="callout callout-danger">
<strong>⚠️ Правила безопасности с ключом:</strong>
<ul>
<li><strong>Никогда</strong> не пиши ключ прямо в коде.</li>
<li><strong>Никогда</strong> не коммить в git (даже в private репо).</li>
<li><strong>Никогда</strong> не показывай в скринах, видео, демо.</li>
<li><strong>Никогда</strong> не используй в JavaScript-коде на фронтенде (любой пользователь увидит в DevTools).</li>
<li><strong>Всегда</strong> храни в переменных окружения (<code>.env</code> файл) или в secret manager.</li>
<li><strong>Сразу отзови ключ</strong>, если случайно засветил.</li>
</ul>
</div>

<p>Реальный кейс 2023: разработчики случайно закоммитили ключи на GitHub, боты-сканеры тут же нашли их и начали гонять GPT-4 на полную, у людей утром были счета на $5000–$50000. OpenAI стал автоматически отзывать такие ключи, но не всегда успевает.</p>

<h2>4. Первый запрос</h2>

<h3>Минимальный пример</h3>
<pre><code>import os
from dotenv import load_dotenv
from openai import OpenAI

# Загружаем .env в переменные окружения
load_dotenv()

# Создаём клиента (он сам найдёт OPENAI_API_KEY в env)
client = OpenAI()

# Делаем запрос
response = client.chat.completions.create(
    model="gpt-4o-mini",
    messages=[
        {"role": "system", "content": "Ты помощник по русскому языку."},
        {"role": "user", "content": "Объясни, что такое деепричастие, в одном абзаце."}
    ],
    temperature=0.3,
    max_tokens=300
)

# Извлекаем текст
print(response.choices[0].message.content)</code></pre>

<p>Сохрани как <code>hello_ai.py</code>, запусти:</p>
<pre><code>python hello_ai.py</code></pre>
<p>Получишь сгенерированный ответ в терминале. Поздравляю — ты только что вызвал LLM из своего кода.</p>

<h2>5. Анатомия запроса</h2>

<p>Разберём каждое поле:</p>

<h3>model</h3>
<p>Имя модели. Точные строки:</p>
<ul>
<li><code>gpt-4o</code>, <code>gpt-4o-mini</code> — флагман и эконом.</li>
<li><code>gpt-4-turbo</code>, <code>gpt-3.5-turbo</code> — старые но дешёвые.</li>
<li><code>o1-preview</code>, <code>o1-mini</code> — reasoning.</li>
</ul>
<p>Anthropic: <code>claude-3-5-sonnet-20241022</code>, <code>claude-3-haiku-20240307</code> и т.д. (точные имена меняются — смотри документацию).</p>

<h3>messages</h3>
<p>Массив сообщений диалога. Поддерживаемые роли:</p>
<ul>
<li><code>system</code> — инструкция модели на весь диалог.</li>
<li><code>user</code> — сообщение пользователя.</li>
<li><code>assistant</code> — предыдущий ответ модели (для контекста).</li>
<li><code>tool</code> — результат вызова инструмента (для function calling — урок 13).</li>
</ul>

<h3>temperature</h3>
<p>0–2. См. урок 4. Для фактических задач — 0–0.3, для креатива — 0.7–1.</p>

<h3>max_tokens</h3>
<p>Максимум токенов в ответе. Жёсткий лимит, остановит даже на полуслове. Считай чуть больше, чем нужно.</p>

<h3>Другие полезные параметры</h3>
<pre><code>response = client.chat.completions.create(
    model="gpt-4o-mini",
    messages=[...],
    temperature=0.3,
    max_tokens=300,
    top_p=1.0,
    frequency_penalty=0.0,   # -2 до 2, штраф за повторы
    presence_penalty=0.0,    # -2 до 2, штраф за упоминание темы
    stop=["\\n\\n"],         # остановиться при появлении строки
    response_format={"type": "json_object"},  # только валидный JSON
    seed=42,                 # для воспроизводимости
    n=1                      # сколько вариантов сгенерировать
)</code></pre>

<h2>6. Анатомия ответа</h2>

<p>Объект <code>response</code> содержит много данных:</p>
<pre><code>{
  "id": "chatcmpl-abc123",
  "object": "chat.completion",
  "created": 1715000000,
  "model": "gpt-4o-mini-2024-07-18",
  "choices": [
    {
      "index": 0,
      "message": {
        "role": "assistant",
        "content": "Деепричастие — это особая форма глагола..."
      },
      "finish_reason": "stop"
    }
  ],
  "usage": {
    "prompt_tokens": 42,
    "completion_tokens": 187,
    "total_tokens": 229
  }
}</code></pre>

<h3>Что брать в работу</h3>
<ul>
<li><code>response.choices[0].message.content</code> — сам сгенерированный текст.</li>
<li><code>response.choices[0].finish_reason</code>:
  <ul>
    <li><code>stop</code> — модель закончила нормально.</li>
    <li><code>length</code> — упёрлась в <code>max_tokens</code>, ответ обрезан.</li>
    <li><code>content_filter</code> — заблокировано фильтром.</li>
    <li><code>tool_calls</code> — попросила вызвать инструмент.</li>
  </ul>
</li>
<li><code>response.usage</code> — твой счётчик стоимости.</li>
</ul>

<h2>7. Подсчёт стоимости</h2>

<p>Цена считается отдельно для input и output по таблице из урока 2.</p>

<h3>Расчёт на лету</h3>
<pre><code>def calculate_cost(usage, model="gpt-4o-mini"):
    prices = {
        "gpt-4o-mini":   {"input": 0.15, "output": 0.60},
        "gpt-4o":        {"input": 2.50, "output": 10.00},
        "o1-mini":       {"input": 3.00, "output": 12.00},
    }
    p = prices.get(model, prices["gpt-4o-mini"])
    cost = (
        usage.prompt_tokens * p["input"] +
        usage.completion_tokens * p["output"]
    ) / 1_000_000
    return cost

response = client.chat.completions.create(...)
print(f"Стоимость: \${calculate_cost(response.usage):.6f}")</code></pre>

<h3>Реальные цифры</h3>
<p>Запрос с промптом 100 токенов и ответом 200 токенов на gpt-4o-mini:</p>
<ul>
<li>Input: 100 × $0.15 / 1M = $0.000015</li>
<li>Output: 200 × $0.60 / 1M = $0.00012</li>
<li>Итого: ~$0.000135 = ~0.013 цента</li>
</ul>
<p>1000 таких запросов = ~$0.14. Очень дёшево.</p>

<h2>8. Streaming — печать ответа по словам</h2>

<p>По умолчанию ответ возвращается целиком в конце генерации. Для чат-интерфейса это плохо — ждёшь 5 секунд белого экрана. Решение — <strong>streaming</strong>:</p>

<pre><code>stream = client.chat.completions.create(
    model="gpt-4o-mini",
    messages=[{"role": "user", "content": "Напиши хайку про код"}],
    stream=True  # ← включаем streaming
)

for chunk in stream:
    delta = chunk.choices[0].delta.content
    if delta:
        print(delta, end="", flush=True)
print()  # перенос строки в конце</code></pre>

<p>Текст печатается по мере генерации — пользователь видит, что что-то происходит.</p>

<h2>9. Обработка ошибок</h2>

<p>В реальной жизни запросы падают. Сети нет, лимит исчерпан, модель перегружена, ключ невалидный. Обрабатывай:</p>

<pre><code>from openai import OpenAI, OpenAIError, RateLimitError, APIConnectionError
import time

def safe_chat(messages, max_retries=3):
    for attempt in range(max_retries):
        try:
            return client.chat.completions.create(
                model="gpt-4o-mini",
                messages=messages,
                timeout=30
            )
        except RateLimitError:
            wait = 2 ** attempt  # exponential backoff: 1, 2, 4 сек
            print(f"Rate limit, ждём {wait} сек...")
            time.sleep(wait)
        except APIConnectionError:
            print("Сеть упала, retry...")
            time.sleep(1)
        except OpenAIError as e:
            print(f"Ошибка OpenAI: {e}")
            return None
    return None</code></pre>

<p>Принципы:</p>
<ul>
<li><strong>Retry на временные ошибки</strong> (rate limit, network) с экспоненциальной задержкой.</li>
<li><strong>Не retry на logical ошибки</strong> (невалидный запрос, кончились деньги).</li>
<li><strong>Timeout</strong> на каждый запрос — иначе один зависший вызов положит весь скрипт.</li>
<li><strong>Логирование</strong> — пиши в файл, что и когда вызывалось.</li>
</ul>

<h2>10. Полный пример: генератор постов</h2>

<pre><code>import os
from dotenv import load_dotenv
from openai import OpenAI

load_dotenv()
client = OpenAI()

def generate_post(topic: str, tone: str = "neutral", count: int = 3) -> list[str]:
    """Генерирует N вариантов поста на заданную тему."""

    system = f"""Ты автор LinkedIn-постов в B2B-сегменте.
Тон: {tone}.
Длина: 500-700 знаков.
Формат: одна фраза-крючок, основная мысль, вывод.
Без хэштегов и эмодзи."""

    posts = []
    for i in range(count):
        response = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=[
                {"role": "system", "content": system},
                {"role": "user", "content": f"Напиши пост на тему: {topic}"}
            ],
            temperature=0.9,  # высокая для разнообразия
            max_tokens=400
        )
        posts.append(response.choices[0].message.content.strip())

    return posts

if __name__ == "__main__":
    topic = input("Тема поста: ")
    tone = input("Тон (нейтральный / прямой / провокационный): ") or "нейтральный"

    posts = generate_post(topic, tone, count=3)

    for i, post in enumerate(posts, 1):
        print(f"\\n--- Вариант {i} ---")
        print(post)</code></pre>

<h2>11. Тонкости и подводные камни</h2>

<h3>Кеширование запросов</h3>
<p>Если ты делаешь много одинаковых запросов в разработке — кешируй ответы локально:</p>
<pre><code>import hashlib, json, os

CACHE_DIR = ".llm_cache"
os.makedirs(CACHE_DIR, exist_ok=True)

def cached_chat(messages, model="gpt-4o-mini", **kwargs):
    key_str = json.dumps({"m": model, "msg": messages, **kwargs}, sort_keys=True)
    key = hashlib.md5(key_str.encode()).hexdigest()
    path = f"{CACHE_DIR}/{key}.json"

    if os.path.exists(path):
        with open(path) as f:
            return json.load(f)["content"]

    response = client.chat.completions.create(model=model, messages=messages, **kwargs)
    content = response.choices[0].message.content

    with open(path, "w") as f:
        json.dump({"content": content}, f)
    return content</code></pre>
<p>Сэкономит и время, и деньги при разработке.</p>

<h3>Логирование</h3>
<p>Сохраняй все запросы и ответы — пригодится для дебага и анализа.</p>
<pre><code>import logging
logging.basicConfig(filename="llm.log", level=logging.INFO)

logging.info(f"Request: {messages}")
logging.info(f"Response: {response.choices[0].message.content}")
logging.info(f"Tokens: {response.usage}")</code></pre>

<h3>Параллельные запросы</h3>
<p>Если нужно обработать 100 промптов — не делай их последовательно. Используй <code>asyncio</code> или <code>concurrent.futures</code>:</p>
<pre><code>from concurrent.futures import ThreadPoolExecutor

def process_one(text):
    return client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[{"role": "user", "content": text}]
    ).choices[0].message.content

with ThreadPoolExecutor(max_workers=10) as ex:
    results = list(ex.map(process_one, texts))</code></pre>
<p>10x ускорение. Но осторожно с rate limits — у OpenAI обычно 5000 req/min.</p>

<h2>12. Глоссарий</h2>
<ul>
<li><strong>API</strong> — Application Programming Interface, способ программного вызова сервиса.</li>
<li><strong>API key</strong> — секретный токен для авторизации запросов.</li>
<li><strong>Endpoint</strong> — конкретный URL API.</li>
<li><strong>SDK</strong> — Software Development Kit, библиотека-обёртка над API.</li>
<li><strong>.env</strong> — файл для секретов, не идёт в git.</li>
<li><strong>Rate limit</strong> — лимит запросов в единицу времени.</li>
<li><strong>Streaming</strong> — постепенный вывод ответа по мере генерации.</li>
<li><strong>finish_reason</strong> — причина остановки генерации (stop / length / etc).</li>
<li><strong>usage</strong> — статистика токенов в ответе.</li>
<li><strong>Exponential backoff</strong> — растущая задержка между retries.</li>
<li><strong>JSON mode</strong> — гарантированно валидный JSON в ответе.</li>
</ul>

<li>Сломай намеренно: подстави неверный ключ → увидишь <code>AuthenticationError</code>.</li>
<li>Попробуй очень большой <code>max_tokens</code> — увидишь, что произойдёт.</li>
<li>Добавь <code>safe_chat</code> с retry. Протестируй.</li>
<li>Добавь логирование в файл.</li>
</ol>

<h2>14. Проверь себя</h2>

<p><strong>1. Где хранить API ключ?</strong><br>
В файле <code>.env</code>, который добавлен в <code>.gitignore</code>. Никогда не в коде, никогда в git, никогда на фронтенде.</p>

<p><strong>2. Что в JSON-ответе содержит сам сгенерированный текст?</strong><br>
<code>response.choices[0].message.content</code></p>

<p><strong>3. <code>finish_reason: "length"</code> — что значит?</strong><br>
Модель упёрлась в <code>max_tokens</code> и ответ обрезан. Нужно увеличить лимит или сделать новый запрос с продолжением.</p>

<p><strong>4. Как посчитать стоимость одного запроса?</strong><br>
Берём из <code>response.usage</code> поля <code>prompt_tokens</code> и <code>completion_tokens</code>, умножаем на цены модели за миллион токенов и делим на миллион.</p>

<p><strong>5. Что такое rate limit?</strong><br>
Лимит запросов в единицу времени (обычно в минуту). У OpenAI бывает 5000 RPM для платных аккаунтов. При превышении — <code>RateLimitError</code>, нужно подождать.</p>

<p><strong>6. Зачем streaming?</strong><br>
Чтобы пользователь видел текст по мере генерации, а не белый экран 5 секунд. Резко улучшает воспринимаемую скорость.</p>

<p><strong>7. Что добавить в .gitignore при работе с API?</strong><br>
Минимум: <code>.env</code>, <code>venv/</code>, <code>__pycache__/</code>, <code>*.pyc</code>, <code>.llm_cache/</code> (если используешь кеш).</p>

<p><strong>8. Как сделать гарантированно валидный JSON в ответе?</strong><br>
<code>response_format={"type": "json_object"}</code> + явная инструкция в system prompt + temperature=0 + try/except json.loads на стороне кода.</p>

<p><strong>9. Когда retry, а когда нет?</strong><br>
Retry на временные ошибки: rate limit, network timeout, 5xx. Не retry на логические: невалидный запрос (400), кончились деньги (402), неверный ключ (401).</p>

<p><strong>10. Чем отличаются <code>frequency_penalty</code> и <code>presence_penalty</code>?</strong><br>
<code>frequency_penalty</code> штрафует за частоту повторений конкретного токена. <code>presence_penalty</code> — за сам факт упоминания темы. Оба от -2 до 2, по умолчанию 0.</p>

<h2>15. Что должно остаться в голове</h2>
<ol>
<li><strong>API + ключ + .env</strong> — фундамент любого ИИ-приложения.</li>
<li><strong>Структура запроса:</strong> model + messages + параметры.</li>
<li><strong>Структура ответа:</strong> <code>choices[0].message.content</code> + <code>usage</code>.</li>
<li><strong>Считай стоимость</strong> в каждом скрипте — поможет не сжечь деньги случайно.</li>
<li><strong>Streaming</strong> для интерактивных интерфейсов.</li>
<li><strong>Retry с backoff</strong> на временные ошибки.</li>
<li><strong>JSON mode</strong> для парсинга ответов программно.</li>
<li><strong>Никогда не клади ключ в код / git / фронтенд.</strong></li>
</ol>

<h1>Урок 7. Чат-приложение с памятью</h1>

<div class="lesson-meta">
  <span><strong>Цель:</strong> сделать чат-бот, который помнит контекст разговора</span>
  <span><strong>Время:</strong> ~60 минут</span>
  <span><strong>Источник:</strong> generative-ai-for-beginners/07</span>
</div>

<h2>Зачем тебе этот урок</h2>
<p>Скрипт из урока 6 — однократный вызов: «введи промпт → получи ответ → конец». Реальные ИИ-продукты — почти все чат-формата: бот помнит контекст, продолжает беседу, держит роль. ChatGPT, Claude.ai, корпоративные ассистенты — все построены на одной механике, которую ты освоишь сегодня.</p>
<p>Отдельная сложность — <strong>память</strong>. LLM stateless: ничего не помнит между вызовами. «Память» — это то, что ты сам подсовываешь в контекст. Этот урок — про разные стратегии, как это делать правильно.</p>

<h2>1. Stateless API и иллюзия памяти</h2>

<p>Вспомни урок 1: каждый запрос к LLM API независим. Модель не «помнит» прошлые сообщения. Если ты хочешь, чтобы она знала контекст — <strong>ты должен отправить весь контекст</strong> в массиве <code>messages</code>:</p>

<pre><code># Запрос 1
client.chat.completions.create(
    model="gpt-4o-mini",
    messages=[{"role": "user", "content": "Меня зовут Иван"}]
)
# → "Приятно познакомиться, Иван!"

# Запрос 2 — модель ничего не помнит
client.chat.completions.create(
    model="gpt-4o-mini",
    messages=[{"role": "user", "content": "Как меня зовут?"}]
)
# → "Я не знаю, как вас зовут"

# Запрос 2 правильный — передаём всю историю
client.chat.completions.create(
    model="gpt-4o-mini",
    messages=[
        {"role": "user", "content": "Меня зовут Иван"},
        {"role": "assistant", "content": "Приятно познакомиться, Иван!"},
        {"role": "user", "content": "Как меня зовут?"}
    ]
)
# → "Вас зовут Иван."</code></pre>

<p>Вся «память» чат-бота — это твой массив сообщений, который ты ведёшь на стороне приложения и каждый раз отправляешь целиком.</p>

<h2>2. Простейший чат-бот</h2>

<pre><code>import os
from dotenv import load_dotenv
from openai import OpenAI

load_dotenv()
client = OpenAI()

class ChatBot:
    def __init__(self, system_prompt: str, model: str = "gpt-4o-mini"):
        self.model = model
        self.history = [{"role": "system", "content": system_prompt}]

    def chat(self, user_msg: str) -> str:
        self.history.append({"role": "user", "content": user_msg})

        response = client.chat.completions.create(
            model=self.model,
            messages=self.history,
            temperature=0.7
        )
        reply = response.choices[0].message.content

        # сохраняем ответ в историю — он понадобится в следующих запросах
        self.history.append({"role": "assistant", "content": reply})
        return reply


# Используем
bot = ChatBot("Ты помощник по фитнесу. Кратко, по делу. Спрашивай уточняющие вопросы.")

while True:
    msg = input("Ты: ")
    if msg.lower() in ("exit", "quit", "выход"):
        break
    print("Бот:", bot.chat(msg))</code></pre>

<p>Запускаешь — получаешь рабочий чат с ботом, который помнит весь разговор.</p>

<h2>3. Проблема: контекст растёт</h2>

<p>На 5-м сообщении массив <code>history</code> содержит 11 элементов (1 system + 10 messages), на 50-м — уже 101. Что в этом плохого:</p>

<ol>
<li><strong>Цена.</strong> Каждый запрос отправляет всю историю. На 50-м сообщении ты платишь за токены 50 предыдущих + новый.</li>
<li><strong>Лимит.</strong> Контекстное окно ограничено (128k у GPT-4o). На очень длинных диалогах упрёшься.</li>
<li><strong>Качество.</strong> «Lost in the middle» — модель хуже помнит середину длинного контекста.</li>
<li><strong>Latency.</strong> Большой контекст обрабатывается дольше.</li>
</ol>

<p>Решение — <strong>стратегии управления историей</strong>.</p>

<h2>4. Стратегия 1: Sliding Window (скользящее окно)</h2>

<h3>Идея</h3>
<p>Хранить только последние N сообщений. Старое — забывать.</p>

<pre><code>class ChatBot:
    def __init__(self, system_prompt: str, max_history: int = 10):
        self.system_prompt = system_prompt
        self.max_history = max_history
        self.history = []

    def chat(self, user_msg: str) -> str:
        self.history.append({"role": "user", "content": user_msg})

        # отрезаем sliding window
        recent = self.history[-self.max_history:]
        messages = [{"role": "system", "content": self.system_prompt}] + recent

        response = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=messages,
            temperature=0.7
        )
        reply = response.choices[0].message.content
        self.history.append({"role": "assistant", "content": reply})
        return reply</code></pre>

<h3>Когда подходит</h3>
<ul>
<li>Короткие фокусные диалоги (helpdesk, FAQ).</li>
<li>Не нужно помнить детали из начала.</li>
</ul>

<h3>Минусы</h3>
<ul>
<li>Бот «забывает» имя, контекст, ранние решения.</li>
<li>Резкая граница: 10 сообщений помнит, 11-е — забыл начисто.</li>
</ul>

<h2>5. Стратегия 2: Summary (саммари)</h2>

<h3>Идея</h3>
<p>Когда история становится длинной, просим модель <strong>суммировать</strong> старую часть и заменяем её на summary.</p>

<pre><code>class ChatBot:
    def __init__(self, system_prompt: str, summarize_every: int = 20):
        self.system_prompt = system_prompt
        self.summarize_every = summarize_every
        self.summary = ""
        self.recent = []  # последние сообщения, не сжатые

    def _summarize_old(self, old_messages):
        text = "\\n".join([f"{m['role']}: {m['content']}" for m in old_messages])
        response = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=[
                {"role": "system", "content": "Сожми диалог в краткое саммари ключевых фактов и решений (1 абзац)."},
                {"role": "user", "content": text}
            ]
        )
        return response.choices[0].message.content

    def chat(self, user_msg: str) -> str:
        self.recent.append({"role": "user", "content": user_msg})

        # компонуем системный промпт с актуальным саммари
        sys = self.system_prompt
        if self.summary:
            sys += f"\\n\\nКонтекст из предыдущей части диалога: {self.summary}"

        messages = [{"role": "system", "content": sys}] + self.recent

        response = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=messages,
            temperature=0.7
        )
        reply = response.choices[0].message.content
        self.recent.append({"role": "assistant", "content": reply})

        # если накопилось много — сжимаем старое
        if len(self.recent) >= self.summarize_every:
            old = self.recent[:-10]   # сжимаем всё кроме последних 10
            self.recent = self.recent[-10:]
            new_summary = self._summarize_old(old)
            self.summary = (
                f"{self.summary}\\n{new_summary}" if self.summary else new_summary
            )

        return reply</code></pre>

<h3>Когда подходит</h3>
<ul>
<li>Длинные обучающие диалоги (репетитор, ментор).</li>
<li>Долгое сопровождение клиента.</li>
<li>Когда важны ранние решения и факты.</li>
</ul>

<h3>Минусы</h3>
<ul>
<li>Дополнительные вызовы LLM (1 саммари = 1 запрос).</li>
<li>Информация теряется при сжатии.</li>
<li>Качество саммари влияет на всё дальнейшее.</li>
</ul>

<h2>6. Стратегия 3: Hierarchical (иерархическая)</h2>

<p>Гибрид:</p>
<ul>
<li>Последние 5–10 сообщений — целиком.</li>
<li>Чуть более старые — суммаризированы по 5 в одну запись.</li>
<li>Древние — глобальное саммари «о чём вообще шёл разговор».</li>
</ul>

<p>Сложнее в реализации, но даёт хороший баланс «точность недавнего» + «общее понимание».</p>

<h2>7. Стратегия 4: Vector memory (векторная память)</h2>

<p>Самая мощная: храним все сообщения в <strong>векторной БД</strong>, при каждом запросе достаём релевантные текущему вопросу. Это уже <strong>RAG</strong> — будем разбирать в уроке 14. Тут просто упомянем для полноты.</p>

<h2>8. Подсчёт токенов и обрезка</h2>

<p>Чтобы понять, когда применять стратегию — нужно считать токены. Есть библиотека <code>tiktoken</code> (для OpenAI):</p>

<pre><code>pip install tiktoken</code></pre>

<pre><code>import tiktoken

def count_tokens(messages, model="gpt-4o-mini"):
    enc = tiktoken.encoding_for_model(model)
    total = 0
    for m in messages:
        # в реальности OpenAI добавляет ~4 токена на сообщение для метаданных
        total += len(enc.encode(m["content"])) + 4
    return total + 2  # +2 для приоритета</code></pre>

<p>Перед запросом проверяй и обрезай:</p>

<pre><code>MAX_CONTEXT = 100_000  # с запасом

while count_tokens(messages) > MAX_CONTEXT:
    # удаляем второе сообщение (после system)
    messages.pop(1)</code></pre>

<h2>9. System prompt — главный инструмент устойчивости</h2>

<p>System prompt задаётся один раз и держит характер бота на весь диалог. Сюда кладём:</p>

<ul>
<li><strong>Роль и сфера.</strong></li>
<li><strong>Стиль общения</strong> (тон, длина ответов).</li>
<li><strong>Правила поведения.</strong></li>
<li><strong>Что делать в граничных случаях.</strong></li>
<li><strong>Что НЕ делать.</strong></li>
</ul>

<h3>Пример хорошего system prompt</h3>
<pre><code>SYSTEM = """Ты — Никита, виртуальный помощник студии веб-разработки.
Твоя задача — помочь клиенту понять, подойдём ли мы под его проект.

Стиль:
- Прямо и по делу, без воды.
- Короткие ответы (2-4 предложения).
- На "ты", дружелюбно, но профессионально.

Что ты делаешь:
- Спрашиваешь про проект клиента: цели, бюджет, сроки.
- Объясняешь наши услуги (разработка сайтов, мобильные приложения).
- Если клиент готов — предлагаешь созвон с менеджером.

Что ты НЕ делаешь:
- Не называешь конкретные цены — это решает менеджер на созвоне.
- Не обещаешь сроков.
- Не отвечаешь на вопросы вне темы (политика, погода и т.п.) —
  вежливо возвращаешь к теме проекта.

Если не знаешь ответа на технический вопрос — скажи прямо
"уточню у команды и вернусь" и предложи оставить контакты."""</code></pre>

<h2>10. Persistence — сохранение между сессиями</h2>

<p>Если бот должен помнить тебя между запусками — сохраняй историю в файл:</p>

<pre><code>import json
from pathlib import Path

class ChatBot:
    def __init__(self, system_prompt, history_file="chat_history.json"):
        self.system_prompt = system_prompt
        self.history_file = Path(history_file)
        self.history = self._load()

    def _load(self):
        if self.history_file.exists():
            with open(self.history_file) as f:
                return json.load(f)
        return []

    def _save(self):
        with open(self.history_file, "w") as f:
            json.dump(self.history, f, ensure_ascii=False, indent=2)

    def chat(self, user_msg):
        self.history.append({"role": "user", "content": user_msg})
        response = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=[{"role": "system", "content": self.system_prompt}] + self.history[-20:],
            temperature=0.7
        )
        reply = response.choices[0].message.content
        self.history.append({"role": "assistant", "content": reply})
        self._save()
        return reply</code></pre>

<p>Для production — лучше БД (SQLite, Postgres), не JSON-файл.</p>

<h2>12. Тонкости</h2>

<h3>Не клади всё в system prompt</h3>
<p>Если у тебя 50-страничный мануал, и ты пихаешь его в system prompt каждого запроса — ты платишь за него каждый раз. Лучше — RAG (урок 14): подгружать релевантные куски только когда нужно.</p>

<h3>System prompt и role-confusion</h3>
<p>Иногда модель «забывает» о своей роли в долгих диалогах, если пользователь активно её сбивает. Лекарство: <strong>повторять ключевые правила</strong> либо в начале, либо в конце контекста (помним про lost in the middle).</p>

<h3>Идентификация пользователя</h3>
<p>В мульти-пользовательском боте нельзя смешивать историю разных людей. Каждому юзеру — отдельный <code>history</code>, ключуй по user_id.</p>

<h3>Цензура и фильтры</h3>
<p>Если бот публичный — добавь Moderation API:</p>
<pre><code>moderation = client.moderations.create(input=user_msg)
if moderation.results[0].flagged:
    return "Я не могу ответить на это."</code></pre>

<h3>Streaming + не блокирующий UI</h3>
<p>В Streamlit это делается одной строкой <code>st.write_stream(stream)</code>. В голом Flask/FastAPI — через Server-Sent Events.</p>

<h2>14. Практика (60 минут)</h2>

<h3>Упражнение 1. Базовый бот (15 минут)</h3>

<h3>Упражнение 2. Sliding window (10 минут)</h3>

<h3>Упражнение 3. Persistence (15 минут)</h3>
<p>Добавь сохранение/загрузку истории из JSON-файла. Перезапусти скрипт между сообщениями. Бот должен помнить всё.</p>

<h3>Упражнение 4. Streamlit-UI (20 минут)</h3>

<h2>15. Проверь себя</h2>

<p><strong>1. Почему чат «помнит» если LLM stateless?</strong><br>
Приложение хранит историю на своей стороне и подставляет её в каждый запрос. Сама LLM ничего не помнит.</p>

<p><strong>2. Что такое sliding window?</strong><br>
Стратегия памяти: храним только последние N сообщений, остальное выбрасываем.</p>

<p><strong>3. Зачем считать токены?</strong><br>
Чтобы не упереться в лимит контекста и не платить за лишнее. Также — чтобы заранее обрезать историю.</p>

<p><strong>4. Когда нужен summary вместо sliding window?</strong><br>
Когда важно помнить ранние решения/факты, но не каждое слово. Жертвуем точностью ради покрытия.</p>

<p><strong>5. Что обязательно в system prompt?</strong><br>
Роль, стиль общения, что делать, чего не делать, что в граничных случаях.</p>

<p><strong>6. У меня 100 пользователей бота. Что важно?</strong><br>
Хранить историю отдельно для каждого user_id, никогда не смешивать. Идентифицировать по сессии или auth.</p>

<p><strong>7. Бот теряет роль на 30-м сообщении. Что делать?</strong><br>
(а) Проверить, не выпал ли system prompt из окна. (б) Дублировать ключевые правила в начале или конце контекста. (в) Использовать summary-стратегию, оставляя главное в саммари.</p>

<p><strong>8. Streamlit vs голый Flask — что выбрать?</strong><br>
Streamlit — для быстрых прототипов и внутренних инструментов. 30 строк = рабочий чат. Flask/FastAPI — для production: контроль над HTTP, мульти-юзер, аутентификация.</p>

<p><strong>9. Как сохранить историю на 1000 пользователей?</strong><br>
SQLite или Postgres, таблица <code>(user_id, role, content, timestamp)</code>. JSON-файл подойдёт только для одного пользователя.</p>

<p><strong>10. Как защитить чат от вредных запросов?</strong><br>
Moderation API на входе и/или выходе. Чёткий system prompt с явным «что не делать». Логирование и алерты на странные паттерны.</p>

<h1>Урок 8. Поиск с эмбеддингами (semantic search)</h1>

<div class="lesson-meta">
  <span><strong>Цель:</strong> понять как ИИ ищет «по смыслу» и сделать свой semantic-поисковик</span>
  <span><strong>Время:</strong> ~60 минут</span>
  <span><strong>Источник:</strong> generative-ai-for-beginners/08</span>
</div>

<h2>Зачем тебе этот урок</h2>
<p>Обычный поиск ищет <strong>совпадения слов</strong>. Если у тебя в заметках есть запись «как корректно расстаться с компанией», а ты ищешь «как уволиться без скандала» — обычный grep ничего не найдёт. Semantic search найдёт, потому что понимает смысл.</p>
<p>Это <strong>фундаментальная техника</strong>:</p>
<ul>
<li>Под капотом RAG (урок 14) — самой популярной паттерны для работы с документами.</li>
<li>Поиск по своим заметкам, тикетам, документам.</li>
<li>Дедупликация (найти похожие вопросы в FAQ).</li>
<li>Кластеризация (группировка отзывов по темам).</li>
<li>Рекомендации.</li>
</ul>
<p>К концу урока у тебя будет рабочий поисковик по твоим собственным заметкам, понимающий запросы на естественном языке.</p>

<h2>1. Что такое embedding</h2>

<h3>Идея</h3>
<p><strong>Embedding</strong> (эмбеддинг, векторное представление) — это превращение текста в <strong>массив чисел фиксированной длины</strong>, отражающий смысл этого текста. Тексты с близким смыслом имеют близкие векторы; разные — далёкие.</p>

<p>Длина вектора зависит от модели:</p>
<ul>
<li><code>text-embedding-3-small</code> — 1536 чисел.</li>
<li><code>text-embedding-3-large</code> — 3072 числа.</li>
<li>BGE-M3 — 1024.</li>
<li>Старая <code>text-embedding-ada-002</code> — 1536.</li>
</ul>

<h3>Упрощённое представление</h3>
<p>Представь, что ты строишь координатную систему смыслов. Каждый текст — точка в этом пространстве. Похожие смыслы — рядом.</p>

<pre><code>"Я хочу есть"        → [0.21, -0.45, 0.12, ...]   (1536 чисел)
"Хочу пиццу"         → [0.20, -0.43, 0.15, ...]   (близко)
"Голоден"            → [0.22, -0.44, 0.10, ...]   (близко)
"Где Эйфелева башня" → [-0.50, 0.31, -0.20, ...]  (далеко)
"Париж — столица"    → [-0.48, 0.30, -0.22, ...]  (далеко от еды, близко к башне)</code></pre>

<p>Конечно реальные числа намного сложнее и не интерпретируемы напрямую — каждое из 1536 «измерений» отвечает за какой-то смысловой аспект, выученный моделью на огромном корпусе.</p>

<h3>Откуда берутся эмбеддинги</h3>
<p>Тренируются специальные модели (отдельные от chat-моделей):</p>
<ul>
<li><strong>OpenAI:</strong> text-embedding-3-small/large.</li>
<li><strong>Open-source:</strong> BGE, E5, Sentence Transformers, BERT.</li>
<li><strong>Cohere:</strong> embed-multilingual-v3.</li>
<li><strong>Google:</strong> text-embedding-005.</li>
</ul>

<p>Под капотом это нейросеть-трансформер, которая пропускает текст через свои слои и выдаёт вектор. Принцип: текст подаётся на вход, выход последнего слоя усредняется и нормализуется.</p>

<h2>2. Косинусное сходство — как мерить «близость» векторов</h2>

<p>Когда у нас есть векторы — нам нужна метрика близости. Стандарт — <strong>cosine similarity</strong>.</p>

<h3>Формула на пальцах</h3>
<p>Косинус угла между двумя векторами. Значения от -1 до 1:</p>
<ul>
<li><code>1.0</code> — векторы совпадают (одинаковый смысл).</li>
<li><code>0.7–0.9</code> — близкий смысл.</li>
<li><code>0.3–0.6</code> — связанные темы.</li>
<li><code>0.0</code> — не связаны.</li>
<li><code>-1.0</code> — противоположны (редко на эмбеддингах текста).</li>
</ul>

<h3>Реализация на Python</h3>
<pre><code>import numpy as np

def cosine_similarity(a, b):
    a, b = np.array(a), np.array(b)
    return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))

# или, если векторы уже нормализованы (как у OpenAI):
# просто скалярное произведение
def dot(a, b):
    return sum(x*y for x, y in zip(a, b))</code></pre>

<h3>Альтернативные метрики</h3>
<ul>
<li><strong>Euclidean distance</strong> — евклидово расстояние. Работает, но cosine обычно лучше для текста.</li>
<li><strong>Dot product</strong> — для нормализованных векторов = cosine. Быстрее.</li>
<li><strong>Manhattan</strong> — почти не используется для текста.</li>
</ul>

<h2>3. Pipeline semantic search</h2>

<p>Стандартная схема (для всех векторных систем):</p>

<pre><code>┌─────────────────┐    ┌──────────┐    ┌──────────────┐    ┌──────────┐
│ Документы (.md, │ -> │ Chunking │ -> │ Embedding    │ -> │ Vector   │
│ pdf, txt, ...)  │    │          │    │ model        │    │ DB       │
└─────────────────┘    └──────────┘    └──────────────┘    └──────────┘

                                                                │
                            запрос пользователя                  │
                                    │                            │
                                    ▼                            │
                            ┌──────────────┐                     │
                            │ Embedding    │                     │
                            │ model        │                     │
                            └──────────────┘                     │
                                    │                            │
                                    ▼                            │
                            ┌──────────────────────────────────┐ │
                            │ Поиск ближайших по cosine sim    │◄┘
                            └──────────────────────────────────┘
                                    │
                                    ▼
                            топ-K результатов</code></pre>

<h3>Этапы</h3>

<p><strong>1. Chunking — нарезка документов.</strong></p>
<p>Документ редко влезает целиком в эмбеддинг. Нарезаем на куски по 200–800 токенов с небольшим перекрытием (50 токенов overlap), чтобы не разрывать важные связи.</p>

<p><strong>2. Embedding — превращение в векторы.</strong></p>
<p>Каждый chunk прогоняем через embedding-модель.</p>

<p><strong>3. Storage — хранение в векторной БД.</strong></p>
<p>Сохраняем (id, embedding, original_text, metadata).</p>

<p><strong>4. Query — поиск.</strong></p>
<p>Эмбеддим запрос, ищем top-K ближайших chunks по cosine.</p>

<p><strong>5. Return — отдаём пользователю.</strong></p>
<p>Возвращаем найденные тексты + score близости.</p>

<h2>4. Векторные базы — что выбрать</h2>

<h2>5. Полный пример с Chroma</h2>

<pre><code>pip install chromadb openai</code></pre>

<pre><code>from openai import OpenAI
import chromadb

client = OpenAI()
chroma = chromadb.PersistentClient(path="./chroma_db")
collection = chroma.get_or_create_collection("notes")

def embed(text: str) -> list[float]:
    """Получить эмбеддинг текста через OpenAI."""
    response = client.embeddings.create(
        model="text-embedding-3-small",
        input=text
    )
    return response.data[0].embedding

# 1. Индексация заметок
notes = [
    "Сегодня встретился с Иваном, обсудили сроки запуска MVP.",
    "Купить корм коту, заехать в зоомагазин в среду.",
    "Идея: сервис для автоматической генерации тестов из ТЗ.",
    "Дед-лайн по статье — пятница.",
    "Почитать про векторные базы данных.",
    "В четверг забрать ребёнка из садика в 17:00.",
    "TODO: написать ответ HR в Лаборатории Касперского."
]

# Эмбеддим и кладём в Chroma
embeddings = [embed(note) for note in notes]
collection.add(
    ids=[f"note_{i}" for i in range(len(notes))],
    embeddings=embeddings,
    documents=notes
)

# 2. Поиск
def search(query: str, k: int = 3):
    query_emb = embed(query)
    results = collection.query(
        query_embeddings=[query_emb],
        n_results=k
    )
    return list(zip(results["documents"][0], results["distances"][0]))

# Пробуем

<p>Заметь — в каждом случае модель находит правильный chunk, хотя <strong>прямых совпадений слов</strong> нет.</p>

<h2>6. Стратегии чанкинга</h2>

<h3>Простая нарезка</h3>
<pre><code>def chunk_text(text: str, chunk_size: int = 500, overlap: int = 50):
    chunks = []
    start = 0
    while start < len(text):
        end = start + chunk_size
        chunks.append(text[start:end])
        start = end - overlap
    return chunks</code></pre>
<p>Минус — режет посередине предложения.</p>

<h3>По параграфам</h3>
<pre><code>chunks = text.split("\\n\\n")</code></pre>
<p>Натуральные границы, но размеры разные.</p>

<h3>По смыслу (рекомендуется)</h3>
<p>Используй <code>RecursiveCharacterTextSplitter</code> из LangChain или его аналог:</p>
<pre><code>def smart_chunk(text, max_size=500):
    # сначала по параграфам, потом по предложениям, потом по словам
    paragraphs = text.split("\\n\\n")
    chunks = []
    current = ""
    for p in paragraphs:
        if len(current) + len(p) <= max_size:
            current += "\\n\\n" + p
        else:
            if current: chunks.append(current.strip())
            if len(p) > max_size:
                # длинный параграф — режем по предложениям
                sentences = p.split(". ")
                ...
            else:
                current = p
    if current: chunks.append(current.strip())
    return chunks</code></pre>

<h3>Размер chunk — компромисс</h3>
<ul>
<li><strong>Маленькие (~100 токенов)</strong> — точный поиск, но теряется контекст.</li>
<li><strong>Средние (~500)</strong> — стандарт.</li>
<li><strong>Большие (~2000)</strong> — широкий контекст, но смешивает темы.</li>
</ul>
<p>Для большинства задач 500 + overlap 50 — рабочая точка.</p>

<h2>7. Hybrid search — комбо semantic + keyword</h2>

<p>Иногда semantic пропускает запросы, где важно <strong>точное слово</strong> (имя продукта, артикул, аббревиатура). Hybrid search комбинирует:</p>

<ul>
<li><strong>Semantic</strong> (эмбеддинги) — для смысла.</li>
<li><strong>BM25 / keyword</strong> — для точных совпадений.</li>
<li><strong>Reranking</strong> — пересортировка финальных результатов второй моделью (cross-encoder).</li>
</ul>

<p>Поддерживается в Weaviate, Qdrant, Elasticsearch + плагины. Для прода почти всегда выигрывает у чистого semantic.</p>

<h2>8. Стоимость эмбеддингов</h2>

<p>Цены OpenAI:</p>

<li>text-embedding-3-large: <strong>$0.13 / 1M</strong>.</li>
</ul>

<h2>9. Open-source эмбеддинги</h2>

<p>Если эмбеддил коллекцию моделью X, а ищешь моделью Y — результаты будут полным мусором. Векторные пространства разных моделей <strong>несовместимы</strong>. Запиши в metadata, какой моделью эмбеддил.</p>

<h3>Когда semantic проигрывает</h3>
<ul>
<li>Поиск по точным артикулам, ID, кодам.</li>
<li>Очень короткие запросы (1–2 слова).</li>
<li>Тексты на узком жаргоне, где модель не училась.</li>
</ul>
<p>Решение — hybrid search (см. секция 7).</p>

<h3>Скейл</h3>
<p>Cosine similarity между N векторами и одним запросом — O(N). При 1M документов это ~100ms на CPU. Для бо́льших объёмов — приближённый поиск (ANN — Approximate Nearest Neighbor): HNSW, IVF. Все нормальные векторные БД делают это автоматически.</p>

<h2>11. Глоссарий</h2>
<ul>
<li><strong>Embedding</strong> — числовой вектор, представляющий смысл текста.</li>
<li><strong>Cosine similarity</strong> — мера близости двух векторов (-1...1).</li>
<li><strong>Chunk</strong> — кусок исходного документа.</li>
<li><strong>Chunking</strong> — стратегия нарезки документов.</li>
<li><strong>Vector DB</strong> — хранилище векторов с быстрым поиском.</li>
<li><strong>k-NN</strong> — k-Nearest Neighbors, поиск k ближайших.</li>
<li><strong>ANN</strong> — Approximate Nearest Neighbor, быстрый приближённый поиск.</li>
<li><strong>HNSW</strong> — Hierarchical Navigable Small World, популярный ANN-алгоритм.</li>
<li><strong>BM25</strong> — классический keyword-алгоритм.</li>
<li><strong>Hybrid search</strong> — combo semantic + keyword.</li>
<li><strong>Reranking</strong> — пересортировка результатов второй моделью.</li>
<li><strong>Cross-encoder</strong> — модель для reranking, оценивает пару (query, doc).</li>
<li><strong>Sentence Transformers</strong> — Python-библиотека для embedding-моделей.</li>
</ul>

<h2>13. Проверь себя</h2>

<p><strong>1. Что такое embedding одним предложением?</strong><br>
Числовой вектор фиксированной длины, представляющий смысл текста. Близкие смыслы = близкие векторы.</p>

<p><strong>2. Почему semantic search умнее keyword?</strong><br>
Понимает синонимы, перефразировки, смысловые связи. Находит «купить корм коту» по запросу «что нужно купить».</p>

<p><strong>3. Зачем чанкать документы перед эмбеддингом?</strong><br>
(а) Документ не влезает целиком (лимит embedding-модели). (б) Маленькие куски дают точный поиск. (в) Гранулярность результатов — пользователь видит релевантный кусок, а не всю книгу.</p>

<p><strong>4. Какая мера близости используется?</strong><br>
Cosine similarity (косинус угла). Для нормализованных векторов эквивалентно скалярному произведению.</p>

<p><strong>5. Назови 3 векторные БД.</strong><br>
Chroma, Qdrant, Pinecone (или Weaviate, pgvector, Milvus, LanceDB, FAISS).</p>

<p><strong>6. Я эмбеддил коллекцию ada-002. Можно искать в ней с text-embedding-3-small?</strong><br>
Нет. Векторные пространства разных моделей несовместимы — поиск выдаст мусор. Нужно переэмбеддить всё одной моделью.</p>

<p><strong>7. Стандартный размер chunk?</strong><br>
500 токенов с overlap 50. Зависит от задачи: для точного поиска факта — меньше (~200), для широкого контекста — больше (~1000).</p>

<p><strong>8. Когда нужен hybrid search?</strong><br>
Когда важны точные совпадения (артикулы, имена, аббревиатуры) И смысл одновременно. Чистый semantic иногда пропускает важные точные совпадения.</p>

<p><strong>9. Что такое ANN и зачем?</strong><br>
Approximate Nearest Neighbor — приближённый поиск ближайших векторов. Жертвует точностью ради скорости. Нужен при объёме &gt;100k векторов, иначе линейный поиск медленный.</p>

<p><strong>10. Бесплатные embedding-модели для русского?</strong><br>
BGE-M3, multilingual-e5-large — обе через <code>sentence-transformers</code>, работают локально, качество как у OpenAI.</p>

<h1>Урок 13. Function Calling — ИИ вызывает твои функции</h1>

<div class="lesson-meta">
  <span><strong>Цель:</strong> понять как работает Function Calling и почему это строительный блок агентов</span>
  <span><strong>Время:</strong> ~45 минут</span>
  <span><strong>Источник:</strong> generative-ai-for-beginners/11</span>
</div>

<h2>Зачем тебе этот урок</h2>
<p>В Фазе 1 ты научился разговаривать с LLM: задавать вопросы, получать ответы, писать промпты. Но у такой модели есть потолок: LLM живёт в своём пузыре — она не знает текущую погоду, не умеет запросить твою базу данных, не может отправить email. И даже если ты просишь вернуть структурированный JSON, каждая модель форматирует его по-своему.</p>
<p><strong>Function Calling</strong> — механизм, который закрывает обе проблемы разом:</p>
<ol>
<li>LLM возвращает <strong>строго структурированные данные</strong> — никаких сюрпризов с форматом.</li>
<li>LLM может «попросить» выполнить реальное действие во внешнем мире — погода, поиск, база данных, отправка сообщения.</li>
</ol>
<p>Это <strong>архитектурный сдвиг</strong>: ты переходишь от чат-бота, который отвечает на вопросы, к агенту, который действует. Function Calling — фундамент всех агентных систем.</p>

<h2>1. Проблема, которую решает Function Calling</h2>
<p>Представь: ты хочешь сделать бота для HR-отдела. Бот принимает резюме и должен занести данные в CRM: имя, должность, опыт, зарплатные ожидания.</p>
<p>До Function Calling GPT-4 вернёт <code>{"name": "Алексей", "experience": 5}</code>, Claude вернёт <code>{"full_name": "Иванов Алексей", "years": "5 лет"}</code>, Mistral добавит пояснительный текст вокруг JSON. Три модели — три разных ключа, разные типы данных. Твой код упадёт с ошибкой.</p>
<p>После Function Calling ты один раз описываешь схему — и все модели возвращают строго её.</p>

<h2>2. Ментальная модель: LLM — диспетчер, а не исполнитель</h2>
<div class="callout callout-warning">
<strong>Ключевое заблуждение:</strong> «LLM вызывает функцию». Это неправда. LLM не умеет выполнять код. Она только производит текст.
</div>
<p>Что происходит на самом деле:</p>
<pre><code>[Ты] → описываешь функции + вопрос пользователя → [LLM]
[LLM] → возвращает: "вызови функцию X с аргументами Y" → [Ты]
[Ты] → вызываешь настоящую функцию X(Y) → получаешь результат
[Ты] → передаёшь результат обратно → [LLM]
[LLM] → формулирует ответ для пользователя → [Ты]</code></pre>
<p>LLM — умный <strong>диспетчер</strong>. Она не делает работу сама, но знает, кому передать задачу и с какими параметрами. Реальную работу делает твой код.</p>

<h2>3. Анатомия Function Calling: три шага</h2>
<h3>Шаг 1. Ты описываешь функции</h3>
<p>Перед запросом к LLM ты передаёшь список функций в виде JSON-схем. Схема — это описание: как называется функция, что делает, какие принимает параметры.</p>
<pre><code>{
  "name": "get_weather",
  "description": "Получить текущую погоду в городе",
  "parameters": {
    "type": "object",
    "properties": {
      "city": {
        "type": "string",
        "description": "Название города, например: Москва"
      }
    },
    "required": ["city"]
  }
}</code></pre>
<p>Это просто описание на языке JSON — <strong>инструкция для LLM</strong>, не настоящий код.</p>

<h3>Шаг 2. LLM решает, нужна ли функция</h3>
<p>Пользователь пишет «Какая сейчас погода в Казани?» — LLM смотрит на список функций и возвращает:</p>
<pre><code>{
  "function_call": {
    "name": "get_weather",
    "arguments": { "city": "Казань" }
  }
}</code></pre>
<p>Если пользователь пишет «Как дела?» — LLM просто ответит текстом, функция не нужна.</p>

<h3>Шаг 3. Ты выполняешь реальный вызов и возвращаешь результат</h3>
<p>Твой код (не LLM!) берёт имя функции и аргументы, вызывает настоящий API, получает данные и передаёт обратно в LLM. LLM формулирует финальный ответ для пользователя.</p>

<h2>4. Function Calling vs просто «верни JSON»</h2>
<table>
<tr><th></th><th>Промпт «верни JSON»</th><th>Function Calling</th></tr>
<tr><td>Формат</td><td>Может плавать</td><td>Строго по схеме</td></tr>
<tr><td>Тип данных</td><td>Строки везде</td><td>string, integer, boolean, array</td></tr>
<tr><td>required поля</td><td>Модель может пропустить</td><td>API гарантирует схему</td></tr>
<tr><td>Несколько инструментов</td><td>Нельзя</td><td>Можно передать список</td></tr>
<tr><td>Интеграция в агентный цикл</td><td>Сложно</td><td>Нативно</td></tr>
</table>

<h2>5. Важные нюансы</h2>
<h3>Function Calling ≠ Tool Use (но это одно и то же)</h3>
<p>OpenAI называет это <strong>Function Calling</strong> (старое API) и <strong>Tool Use</strong> (новое). Anthropic (Claude) называет это <strong>Tool Use</strong>. Принцип идентичный — просто разные названия в документации.</p>

<h3>Безопасность: не доверяй аргументам слепо</h3>
<p>LLM передаёт тебе аргументы для функции — но она может ошибиться или быть обманута через prompt injection. Всегда валидируй аргументы перед выполнением, особенно если функция делает что-то необратимое.</p>

<h3>Один запрос может потребовать несколько функций</h3>
<p>«Найди курсы по Python и запиши меня на лучший» — это два действия. Современные LLM умеют вызывать несколько функций подряд (parallel tool calls).</p>

            messages.append({"role": "tool", "tool_call_id": tc.id, "content": result})
        response = client.chat.completions.create(
            model="gpt-4o-mini", messages=messages, tools=tools, tool_choice="auto"
        )
        message = response.choices[0].message
    return message.content

<h1>Урок 14. RAG и векторные базы данных</h1>

<div class="lesson-meta">

<h2>Зачем тебе этот урок</h2>
<p>Проблема, которую решает RAG, возникает у каждого кто строит AI-продукты:</p>
<ul>
<li>Компания хочет чат-бота по своей документации — но документация закрытая, в LLM её нет.</li>
<li>Хочешь задавать вопросы своим заметкам — LLM их не видела при обучении.</li>
<li>Нужен помощник по актуальным ценам — у LLM данные устарели на год-два.</li>
<li>Бот даёт уверенные ответы но иногда явно врёт — нет способа проверить источник.</li>
</ul>
<p>RAG (<strong>Retrieval-Augmented Generation</strong>) решает это: вместо того чтобы запихнуть всё в промпт, ты <strong>ищешь только нужное</strong> и даёшь LLM именно те фрагменты, которые релевантны вопросу.</p>

<h2>1. Ментальная модель RAG</h2>
<p>Аналогия: студент на устном экзамене. Обычный LLM — студент с феноменальной памятью, но не знает ничего про твою компанию. RAG — тот же студент, но с правом принести <strong>шпаргалки</strong>: перед ответом он листает нужные карточки и использует их в ответе.</p>
<p>RAG — конвейер из двух частей:</p>
<pre><code>ЧАСТЬ 1: ИНДЕКСИРОВАНИЕ (один раз заранее)
Документы → Нарезка на чанки → Векторы → Сохранение в БД

ЧАСТЬ 2: РАБОТА С ПОЛЬЗОВАТЕЛЕМ (каждый запрос)
Вопрос → Вектор → Поиск похожих чанков → Отправка в LLM → Ответ</code></pre>

<h2>2. Embeddings — числовое представление смысла</h2>
<p><strong>Embedding</strong> — это способ превратить текст в список чисел так, чтобы <strong>похожие по смыслу тексты давали похожие числа</strong>.</p>
<p>Три фразы: «Кошка сидит на ковре», «Котёнок лежит на подстилке», «Процентная ставка ЦБ выросла». Первые две похожи по смыслу — их векторы будут <strong>близкими в пространстве</strong>, у третьей вектор далёкий.</p>
<p>Это лучше обычного поиска по ключевым словам: запрос «купить ноутбук» найдёт документ с фразой «приобрести лэптоп» — разные слова, но <strong>смысл близок</strong>. Можно спрашивать на русском, а находить документы на английском.</p>

<h2>3. Чанкинг — нарезка документов</h2>
<p>Почему нельзя один embedding для всего документа на 100 страниц?</p>
<ul>
<li><strong>Качество поиска падает.</strong> Один вектор — усреднение по всему содержимому. HR-раздел и финансовый смешаются.</li>
<li><strong>Контекстное окно ограничено.</strong> Нашёл документ — но передать его целиком нельзя.</li>
<li><strong>Стоимость.</strong> Чем больше токенов — тем дороже.</li>
</ul>
<p>Стандарт: <strong>500–600 слов с перекрытием 50–100 слов</strong> между чанками — чтобы не потерять смысл на границах. Лучше делить по абзацам или разделам, а не механически.</p>

<h2>4. Векторная база данных</h2>
<p>Обычные БД плохо подходят: они ищут по точным значениям, но не умеют «найти ближайших соседей в многомерном пространстве». Векторная БД — специализированное хранилище именно для такого поиска.</p>
<table>
<tr><th>База</th><th>Особенность</th><th>Когда</th></tr>
<tr><td>Chroma</td><td>Локальная, простая</td><td>Прототипы и учёба</td></tr>
<tr><td>Pinecone</td><td>Облачная, масштабируемая</td><td>Продакшен без инфраструктуры</td></tr>
<tr><td>Qdrant</td><td>Self-hosted, высокая производительность</td><td>Продакшен на своих серверах</td></tr>
<tr><td>pgvector</td><td>Расширение для PostgreSQL</td><td>Уже используешь Postgres</td></tr>
</table>

<h2>5. Как работает поиск: косинусное сходство</h2>
<p><strong>Косинусное сходство</strong> измеряет <strong>угол</strong> между двумя векторами:</p>
<ul>
<li>= 1 → идентичны (угол 0°)</li>
<li>= 0 → не связаны (угол 90°)</li>
<li>= -1 → противоположны</li>
</ul>
<p>Почему угол, а не расстояние? Длина вектора зависит от длины текста, угол — только от <strong>направления</strong>, то есть от смысла.</p>

<h2>6. Полный RAG-конвейер</h2>
<h3>Этап 1: Индексирование</h3>
<pre><code>1. Загружаешь документы (PDF, .md, .txt)
2. Нарезаешь на чанки (~500 слов, с перекрытием)
3. Каждый чанк → embedding-модель → вектор
4. Сохраняешь в векторную БД: {вектор, текст, метаданные}</code></pre>

<h3>Этап 2: Ответ на вопрос</h3>
<pre><code>1. Пользователь задаёт вопрос
2. Вопрос → embedding → вектор вопроса
3. Ищем top-K (3–5) ближайших чанков
4. Составляем промпт: "Ответь используя только этот контекст: [чанки]"
5. LLM отвечает на основе контекста
6. Показываем пользователю источники</code></pre>

<h2>7. Важные нюансы</h2>
<h3>Одна и та же embedding-модель для индексации и поиска</h3>
<p>Критично: если индексировал через <code>text-embedding-ada-002</code>, а вопросы переводишь через <code>text-embedding-3-small</code> — пространства несовместимы, поиск будет мусором.</p>

<h3>RAG vs Fine-tuning</h3>
<table>
<tr><th></th><th>RAG</th><th>Fine-tuning</th></tr>
<tr><td>Стоимость</td><td>Дёшево</td><td>Очень дорого</td></tr>
<tr><td>Актуальность данных</td><td>Обновляешь БД — сразу работает</td><td>Нужно переобучение</td></tr>
<tr><td>Прозрачность</td><td>Видишь источники</td><td>Знания внутри модели</td></tr>
<tr><td>Лучше для</td><td>Фактических знаний, поиска</td><td>Стиля, поведения</td></tr>
</table>

<h2>8. Практика: RAG по своим документам</h2>
<pre><code>pip install openai chromadb</code></pre>
<pre><code>import os, json, chromadb
from openai import OpenAI

client = OpenAI(api_key="твой-ключ")
chroma = chromadb.Client()
collection = chroma.create_collection("docs", metadata={"hnsw:space": "cosine"})

def embed(text):
    return client.embeddings.create(
        model="text-embedding-3-small", input=text
    ).data[0].embedding

def index_file(filepath):
    with open(filepath, encoding="utf-8") as f:
        text = f.read()
    words = text.split()
    chunks = [" ".join(words[i:i+500]) for i in range(0, len(words), 450)]
    for i, chunk in enumerate(chunks):
        collection.add(
            ids=[f"{filepath}_{i}"],
            embeddings=[embed(chunk)],
            documents=[chunk],
            metadatas=[{"source": os.path.basename(filepath)}]
        )
    print(f"✅ {filepath}: {len(chunks)} чанков")

def ask(question, n=4):
    results = collection.query(query_embeddings=[embed(question)], n_results=n,
                               include=["documents", "metadatas", "distances"])
    chunks = [
        f"[{results['metadatas'][0][i]['source']}]\n{results['documents'][0][i]}"
        for i in range(len(results["documents"][0]))
        if 1 - results["distances"][0][i] > 0.5
    ]
    if not chunks:
        return "❌ В документах нет информации по этому вопросу."
    
    context = "\n\n---\n\n".join(chunks)
    response = client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[
            {"role": "system", "content": "Отвечай ТОЛЬКО на основе контекста. Если ответа нет — так и скажи."},
            {"role": "user", "content": f"Контекст:\n{context}\n\nВопрос: {question}"}
        ],
        temperature=0.2
    )
    return response.choices[0].message.content

# Индексируем свои файлы
for f in ["notes.txt", "manual.txt"]:
    if os.path.exists(f):
        index_file(f)

# Интерактивный режим
while True:
    q = input("\nВопрос: ").strip()
    if q.lower() in ["выход", "exit"]: break
    print(ask(q))</code></pre>

<h2>Зачем тебе этот урок</h2>
<p>У тебя уже есть три рабочих pet-проекта: API-приложение из урока 6, чат-бот из урока 7, semantic search из урока 8, плюс function calling и RAG из 13 и 14. Они работают на твоей машине. Но <strong>работающее на твоей машине ≠ продакшен</strong>.</p>
<p>Главная разница между «скриптом» и «приложением»: у приложения есть <strong>жизненный цикл</strong>. Его нужно выпускать, тестировать, мониторить, улучшать. AI-приложения здесь особенно требовательны, потому что:</p>
<ul>
<li>LLM <strong>недетерминированы</strong> — один и тот же промпт может давать разные ответы.</li>
<li>Модели <strong>дрейфуют</strong> — OpenAI или Anthropic обновили модель, и твой промпт сломался.</li>
<li>Цена <strong>может взорваться</strong> — пользователь повторил один промпт 10 000 раз.</li>
<li>Качество <strong>трудно измерить</strong> — «хорошо ли модель ответила?» субъективно.</li>
</ul>
<p>Этот урок — карта того, как этим управлять.</p>

<h2>1. Шесть этапов жизненного цикла</h2>

<p>Любое серьёзное AI-приложение проходит через шесть этапов:</p>

<ol>
<li><strong>Use case definition</strong> — что мы делаем и для кого</li>
<li><strong>Prototyping</strong> — первая работающая версия</li>
<li><strong>Evaluation</strong> — собираем тесты, измеряем качество</li>
<li><strong>Deployment</strong> — выкатываем в прод</li>
<li><strong>Monitoring</strong> — следим за метриками и инцидентами</li>
<li><strong>Improvement</strong> — итерируем по фидбеку</li>
</ol>

<p>В отличие от классического software цикла, эти этапы <strong>цикличны</strong> — после Improvement идём снова на Evaluation. И почти всегда крутятся параллельно: один фичу мониторим, другую прототипируем.</p>

<h2>2. Этап 1: Use case — без него всё бесполезно</h2>

<p>Самая частая ошибка: «давайте сделаем AI-чат-бот для нашего сайта». Это не use case, это технология. Правильный use case отвечает на три вопроса:</p>

<ul>
<li><strong>Какую задачу пользователя</strong> мы решаем? (не «бот», а «помочь клиенту быстро найти подходящий тариф»)</li>
<li><strong>Как сейчас</strong> решается без AI? (живой менеджер, FAQ, поиск)</li>
<li><strong>Почему AI</strong> лучше / быстрее / дешевле / приятнее?</li>
</ul>

<p>Если на третий вопрос нет ответа — не делай AI. Используй существующее. <strong>«AI ради AI» — провал.</strong></p>

<h2>3. Этап 2: Prototyping — быстро, грязно, работающе</h2>

<p>Цель прототипа: <strong>проверить гипотезу за неделю или меньше</strong>. Не идеальный код, не масштабируемая архитектура — рабочий MVP.</p>

<p>Что важно на этом этапе:</p>
<ul>
<li>Используй <strong>самую сильную модель</strong> (GPT-4o, Claude Sonnet) — потом оптимизируем</li>
<li>Пиши <strong>гибкий промпт</strong>, не вылизывай</li>
<li>Тестируй на <strong>10–20 реальных кейсах</strong>, не на 1000</li>
<li>Не строй <strong>сложную инфру</strong> — пусть это будет Python-скрипт или Streamlit</li>
</ul>

<p>Сильный совет: <strong>покажи прототип реальным пользователям как можно раньше</strong>. На этом этапе ты узнаешь, что половина того, что казалось важным, не нужно — а нужно что-то совсем другое.</p>

<h2>4. Этап 3: Evaluation — главная отличительная черта AI-разработки</h2>

<p>У обычного приложения есть unit-тесты: «функция вернула X для входа Y». У AI-приложения такого нет — на одинаковый запрос модель может ответить разными словами, и оба ответа могут быть правильными.</p>

<p>Поэтому используется <strong>eval-фреймворк</strong>: набор тестовых случаев + способ оценить ответ.</p>

<h3>Тест-сет (golden dataset)</h3>
<p>Набор кейсов, на которых ты проверяешь приложение:</p>
<pre><code>{
  "id": "tc_001",
  "input": "Можно ли сменить тариф в середине месяца?",
  "expected_topics": ["возможность смены", "перерасчёт", "сроки"],
  "expected_tone": "дружелюбный, конкретный",
  "must_include_link": "/help/change-plan"
}</code></pre>
<p>20–50 кейсов хватает на старте. Со временем расширяй до 200–500.</p>

<h3>Как оценивать ответ</h3>
<p>Четыре подхода:</p>

<ol>
<li><strong>Точные совпадения</strong> — для structured output (JSON-схема правильная? всё на месте?)</li>
<li><strong>Регулярки / правила</strong> — содержит ли ответ нужную ссылку, не содержит ли запрещённых слов</li>
<li><strong>LLM-as-judge</strong> — вторая модель (GPT-4) оценивает ответ первой по критериям</li>
<li><strong>Human review</strong> — самое дорогое, но иногда необходимое</li>
</ol>

<p>На практике используется комбо: автоматические проверки (1, 2, 3) на каждом коммите + human review раз в неделю.</p>

<h3>Инструменты для eval</h3>
<ul>
<li><strong><a href="https://www.promptfoo.dev" target="_blank">Promptfoo</a></strong> — CLI и YAML конфиги, регрессионные тесты для промптов. Самый практичный для старта.</li>
<li><strong><a href="https://inspect.aisi.org.uk" target="_blank">Inspect</a></strong> — от UK AI Safety Institute, упор на безопасность.</li>
<li><strong><a href="https://www.langfuse.com" target="_blank">Langfuse</a></strong> — observability + eval в одном.</li>
<li><strong>Свой скрипт</strong> — 100 строк Python с pytest. Часто этого хватает.</li>
</ul>

<p>Базовые варианты в порядке возрастания сложности:</p>

<table>
<tr><th>Способ</th><th>Когда подходит</th><th>Минусы</th></tr>
<tr><td><strong>Streamlit Cloud</strong></td><td>Внутренние инструменты, демо для друзей</td><td>Не для большой нагрузки</td></tr>
<tr><td><strong>Vercel / Netlify</strong></td><td>Frontend + serverless backend</td><td>Лимиты длинных запросов (10 сек)</td></tr>

<tr><td><strong>AWS / GCP / Azure</strong></td><td>Серьёзный масштаб</td><td>Сложно, дорого, много возможностей напортачить</td></tr>
